    const head = el('div', {}); head.innerHTML = passagePopupHtml(p, inf); box.appendChild(head);
    const lr = linksRow(inf.links); if (lr) box.appendChild(lr);
    if (cfg.openMemo) box.appendChild(openMemoBtn(p.id, 'passage', closePassagePopup));
    return box;
  }
  // [MAP-MEMO-ROUNDTRIP] Contenu DOM du popup d'un MARQUEUR mémo classique (restaurants, points
  // géolocalisés) : titre/sous-titre + rangée 🔗 liens + bouton « Ouvrir le mémo » (kind memo).
  function buildMarkerPopup(p) {
    const box = el('div', {});
    const head = el('div', {});
    head.innerHTML = '<strong>' + (p.title || '').replace(/</g, '&lt;') + '</strong>' + (p.sub ? '<br>' + p.sub.replace(/</g, '&lt;') : '');
    box.appendChild(head);
    const lr = linksRow(p.links); if (lr) box.appendChild(lr);
    if (p.kind === 'memo' && cfg.openMemo) box.appendChild(openMemoBtn(p.id, 'marker', () => activeMap.closePopup()));
    return box;
  }
  function showPassagePopup(p, inf, ll, autoPan) {
    passagePopup = L.popup({ autoPan: !!autoPan }).setLatLng(ll).setContent(buildPassageBox(p, inf)).openOn(activeMap);
    passagePopup.on('remove', () => { clearStepSel(); tlSelId = null; passagePopup = null; });  // clic ailleurs = fermeture
  }
  // Ouvre le popup d'un passage SANS point propre sur le pin de son projet porteur (flyTo).
  function openPassageOnPorter(p) {
    if (tlSelId === p.id && passagePopup) { closePassagePopup(); return; }  // re-clic = fermer
    if (!cfg.passageInfo) return;
    const inf = cfg.passageInfo(p.id);
    if (!inf || !inf.ll) return;  // pas de porteur géolocalisé → no-op propre
    const cur = switchDayThenLocate(p);  // bascule éventuelle du filtre de jour + re-localise le chip
    selectStep(cur || null, p.id);
    activeMap.flyTo(inf.ll, 16, { duration: 0.6 });
    showPassagePopup(p, inf, inf.ll, true);
  }
  // [FESTIVAL-FRISE-FOCUS #2] Ré-ouvre la bulle d'un passage SANS flyTo (la vue est restaurée à part) ;
  // compteurs ❤️/🗳 rafraîchis (passageInfo relu, l'utilisateur a pu voter/commenter depuis le mémo).
  function reopenPassageBubble(p) {
    if (!cfg.passageInfo) return;
    const inf = cfg.passageInfo(p.id);
    if (!inf || !inf.ll) return;
    selectStep(tlEl.querySelector('[data-memo-id="' + p.id + '"]') || null, p.id);
    showPassagePopup(p, inf, inf.ll, false);
  }
  // [MAP-MEMO-ROUNDTRIP] Restaure l'état carte mémorisé (parcours carte→mémo→retour). Générique.
  function restoreMapState(rs) {
    const after = () => {
      // scrutin sélectionné (non persisté) : re-résoudre dans les scrutins reconstruits (par id ; null = dossier).
      if (rs.voteSel !== undefined && scrutins.length) {
        selVote = rs.voteSel == null ? null
          : (rs.voteSel === '__dossier__' ? scrutins.find(s => s.id === null) : scrutins.find(s => s.id === rs.voteSel)) || null;
      }
      refresh(false);  // re-dessine marqueurs/pastilles avec le scrutin restauré (sans refit)
      if (rs.day) applyDay(rs.day);  // re-filtre la frise sur le jour + scroll au jour
      const b = rs.bubble;
      if (b && b.kind === 'passage') { const p = datedAll().find(x => x.id === b.id); if (p) reopenPassageBubble(p); }
      else if (b && b.kind === 'marker') { const mk = markersByKey['memo:' + b.id]; if (mk) mk.marker.openPopup(); }
      setTimeout(() => {
        activeMap.invalidateSize();
        if (rs.center) activeMap.setView([rs.center.lat, rs.center.lng], rs.zoom);
        const strip = tlEl.querySelector('.map-frise-strip');
        if (strip && rs.friseScroll) strip.scrollLeft = rs.friseScroll;
      }, 140);
    };
    if (rs.photoOn && cfg.loadPhotos && !photoOn) togglePhotos().then(after);  // calque photo non persisté
    else after();
  }

  function renderTimeline() {
    tlEl.innerHTML = '';
    clearStepSel();  // les éléments de chips sont recréés → oublier l'ancienne réf (le popup reste)
    const dated = datedAll().filter(p => isFocused(p));
    if (!tlOn || !dated.length) { tlEl.style.display = 'none'; return; }
    tlEl.style.display = 'block';
    tlEl.style.cssText += ';margin:0.45rem 0 0;';
    const past = dated.filter(p => p.due_date < tlToday).length;
    const pct = Math.round((past / dated.length) * 100);
    // barre de progression remplie jusqu'à aujourd'hui
    tlEl.appendChild(el('div', { attrs: { style: 'height:4px;border-radius:999px;background:linear-gradient(90deg,' + ACCENT + ' ' + pct + '%, var(--border) ' + pct + '%);margin:0 0.2rem 0.3rem' } }));
    const strip = el('div', { class: 'map-frise-strip', attrs: { style: 'display:flex;gap:0.3rem;align-items:stretch;overflow-x:auto;padding:0 0.2rem 0.3rem;-webkit-overflow-scrolling:touch' } });
    // [MAP-TRIP-POLISH] chips « Jour 1… » cliquables (si plusieurs jours distincts) :
    // clic = faire défiler la frise jusqu'à la première étape du jour.
    // [FESTIVAL-DATES] journée de festival ; [MEMO-DATE-RANGE] un séjour couvre plusieurs jours →
    // chaque jour de sa plage a son chip « Jour N » (l'hôtel Osaka apparaît Jours 1..4).
    // [TIMELINE-CALENDAR-DAYS] Deux modes de numérotation des jours de la frise :
    //  • VOYAGE (dossier is_trip, tous les points datés `trip`) → « Jour N » CALENDAIRE : plage
    //    continue min(due_date)→max(due_end) (D1), les jours SANS mémo existent en chips grisées (D2),
    //    ≥ 3 jours vides consécutifs condensés en « Jours X–Y · rien » (D3). Recalcul immédiat (D4).
    //  • autres (festival…) → comportement historique : « Jour N » = N-ième DATE DISTINCTE portant un mémo.
    // Un mémo à plage couvre chacun de ses jours ([MEMO-DATE-RANGE], memoDays) → l'hôtel 3→6 est aux Jours 1-4.
    const memoDaySet = new Set();
    dated.forEach(p => ((p.due_end && p.due_date && p.due_end > p.due_date) ? memoDays(p) : [festivalDay(p)]).forEach(d => memoDaySet.add(d)));
    const tripMode = dated.length > 0 && dated.every(p => p.trip);
    const range = tripMode ? tripRange(dated) : null;
    const days = (tripMode && range) ? tripDays(range) : [...memoDaySet].sort();
    const firstStepOfDay = {};
    if (tlActiveDay && !days.includes(tlActiveDay)) tlActiveDay = null; // jour disparu (focus/renumérotation)
    // [TIMELINE-TODAY] aujourd'hui dans la plage du voyage ? (avant → début, passé → début : inchangé)
    const todayInRange = tripMode && range && tlToday >= range.start && tlToday <= range.end;
    let chipsBand = null;  // bande des jours (référencée par le scroll-vers-aujourd'hui)
    // [TIMELINE-TODAY] positionne la bande des jours sur la chip du jour courant ET la frise sur sa
    // 1re tuile (à la 1re nuit d'aujourd'hui, sinon le curseur « auj. »). NE FILTRE PAS (pas d'applyDay).
    // Requête sur le DOM VIVANT (`#map-timeline`) : renderTimeline peut re-rendre à l'ouverture → les
    // refs de closure seraient détachées ; le DOM courant, lui, porte toujours la frise affichée.
    // Centre horizontalement `child` dans `box`. NB : le scroll SMOOTH (scrollIntoView comme scrollTo)
    // est ignoré dans le top-layer <dialog> sous Chromium → positionnement INSTANTANÉ (scrollLeft), fiable.
    const centerH = (box, child) => {
      if (!box || !child) return;
      box.scrollLeft = Math.max(0, Math.min(child.offsetLeft - (box.clientWidth - child.offsetWidth) / 2, box.scrollWidth - box.clientWidth));
    };
    const scrollToToday = () => {
      if (!todayInRange) return;
      const tlx = document.getElementById('map-timeline'); if (!tlx) return;
      const bandx = tlx.querySelector('.map-days-band');
      if (bandx) centerH(bandx, bandx.querySelector('[data-day-iso="' + tlToday + '"]'));
      const stripx = tlx.querySelector('.map-frise-strip');
      if (stripx) centerH(stripx, stripx.querySelector('[data-day="' + tlToday + '"]') || [...stripx.children].find(x => x.getAttribute && x.getAttribute('title') === 'Aujourd\'hui'));
    };
    if (days.length > 1) {
      // [TIMELINE-TODAY] bande des jours SCROLLABLE (nowrap + overflow-x) → peut se centrer sur aujourd'hui.
      chipsBand = el('div', { class: 'map-days-band', attrs: { style: 'display:flex;gap:0.25rem;flex-wrap:nowrap;overflow-x:auto;margin:0 0.2rem 0.3rem;padding-bottom:0.1rem;-webkit-overflow-scrolling:touch' } });
      const chipsRow = chipsBand;
      // [MAP-DAYCHIP-ALL] chip « 🌍 Tous » en tête : actif quand aucun jour choisi ; clic = réaffiche tout.
      const allActive = !tlActiveDay;
      const allStyle = allActive ? ';background:' + ACCENT + ';border-color:' + ACCENT + ';color:#10141a;font-weight:700' : '';
      chipsRow.appendChild(el('button', {
        class: 'prio-btn', text: (allActive ? '✓ ' : '') + '🌍 Tous',
        attrs: { type: 'button', title: allActive ? 'Tous les jours affichés' : 'Réafficher tous les jours et recadrer la carte sur l\'ensemble', style: 'flex:0 0 auto;padding:0.05rem 0.4rem;font-size:0.66rem' + allStyle },
        on: { click: () => applyDay(null) },
      }));
      // [TIMELINE-TODAY] bouton « Aujourd'hui » (esprit Agenda), visible seulement si aujourd'hui ∈ plage ;
      // re-scroll vers le jour courant SANS filtrer.
      if (todayInRange) {
        chipsRow.appendChild(el('button', {
          class: 'prio-btn', text: '📍 Aujourd\'hui',
          attrs: { type: 'button', title: 'Revenir au jour courant dans la frise', style: 'flex:0 0 auto;padding:0.05rem 0.4rem;font-size:0.66rem;border-color:' + ACCENT + ';color:' + ACCENT },
          on: { click: () => scrollToToday() },
        }));
      }
      // chip « Jour N » (n = index calendaire 1-based ; en mode voyage = tripDayIndex, gratuit car `days` continu).
      const dayChip = (d, n, hasMemo) => {
        const lbl = new Date(d + 'T00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
        const isActive = tlActiveDay === d;
        let style = 'flex:0 0 auto;padding:0.05rem 0.4rem;font-size:0.66rem';
        if (isActive) style += ';background:' + ACCENT + ';border-color:' + ACCENT + ';color:#10141a;font-weight:700';
        else if (!hasMemo) style += ';opacity:0.5;color:var(--muted);border-style:dashed';   // [D2] jour vide discret
        else if (d === tlToday) style += ';border-color:' + ACCENT + ';color:' + ACCENT;
        const b = el('button', {
          class: 'prio-btn', text: (isActive ? '✓ ' : '') + 'Jour ' + n,
          attrs: { type: 'button', 'data-day-iso': d, title: lbl + (hasMemo ? '' : ' — aucun mémo') + (isActive ? ' — cliquer pour désélectionner' : ' — mettre ce jour en avant'), style },
          on: { click: () => applyDay(isActive ? null : d) },
        });
        return b;
      };
      if (tripMode) {
        let i = 0;
        while (i < days.length) {
          if (memoDaySet.has(days[i])) { chipsRow.appendChild(dayChip(days[i], i + 1, true)); i++; continue; }
          let j = i; while (j < days.length && !memoDaySet.has(days[j])) j++;   // run de jours vides [i, j[
          if (j - i >= 3) {
            // [D3] condensation : une seule chip « Jours X–Y · rien » (non-action V1, cursor default).
            chipsRow.appendChild(el('span', {
              class: 'prio-btn', text: 'Jours ' + (i + 1) + '–' + j + ' · rien',
              attrs: { title: 'Aucun mémo du Jour ' + (i + 1) + ' au Jour ' + j, style: 'flex:0 0 auto;padding:0.05rem 0.4rem;font-size:0.66rem;opacity:0.5;color:var(--muted);border-style:dashed;cursor:default' },
            }));
          } else {
            for (let k = i; k < j; k++) chipsRow.appendChild(dayChip(days[k], k + 1, false));  // [D2] 1-2 jours vides = chips grises
          }
          i = j;
        }
      } else {
        days.forEach((d, i) => chipsRow.appendChild(dayChip(d, i + 1, true)));
      }
      tlEl.appendChild(chipsRow);
    }
    let cursorPlaced = false;
    const cursor = () => el('div', {
      attrs: { title: 'Aujourd\'hui', style: 'flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:0.6rem;color:' + ACCENT + ';font-weight:700' },
    }, el('span', { attrs: { style: 'width:2px;flex:1;background:' + ACCENT + ';border-radius:1px' } }), el('span', { text: 'auj.' }));
    // [TIMELINE-CALENDAR-DAYS/nuits] Dans la frise VOYAGE, un mémo à plage émet une tuile par NUIT :
    // de due_date à la VEILLE de due_end (Kyoto 6→8 = tuiles les 6 et 7 = 2 nuits). Le jour du due_end
    // (check-out) n'a pas de tuile dédiée mais reste COUVERT (memoDaySet inclusif → pas une chip « rien »,
    // clic sur ce jour montre l'étape via memoCoversDay). Hors voyage / sans plage : 1 tuile (inchangé).
    // `filterDay` = jour de rattachement pour le filtre chip (nuit en voyage ; festivalDay sinon).
    const tiles = [];
    dated.forEach(p => {
      const isRange = p.due_end && p.due_date && p.due_end > p.due_date;
      if (tripMode && isRange) {
        const nights = memoDays(p).slice(0, -1);   // [due_date..veille(due_end)] — retire le check-out
        (nights.length ? nights : [p.due_date]).forEach(d => tiles.push({ p, day: d, filterDay: d }));
      } else {
        tiles.push({ p, day: p.due_date, filterDay: festivalDay(p) });
      }
    });
    tiles.sort((a, b) => a.day.localeCompare(b.day) || agendaDayCompare(a.p, b.p));
    tiles.forEach(({ p, day, filterDay }) => {
      if (!cursorPlaced && day >= tlToday) { strip.appendChild(cursor()); cursorPlaced = true; }
      const isPast = day < tlToday;
      const isToday = day === tlToday;
      const hasGps = p.lat != null && p.lng != null;
      const d = new Date(day + 'T00:00');
      // Heure = check-in → sur la 1re nuit seulement (jour === due_date), pas sur chaque nuit.
      const dayLbl = d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) + ((p.due_time && day === p.due_date) ? ' ' + fmtMemoTime(p.due_time) : '');
      // [MAP-DAYCHIP-ACTIVE] jour actif : ses étapes ressortent (anneau accent),
      // les autres jours s'estompent ; sans jour actif, comportement classique.
      const isActiveDay = tlActiveDay === filterDay;
      const dimOtherDay = tlActiveDay && !isActiveDay;
      const step = el('button', {
        attrs: {
          type: 'button',
          'data-day': filterDay,  // [FESTIVAL-DATES] journée de festival ; [TIMELINE-CALENDAR-DAYS] nuit en voyage
          'data-memo-id': p.id,  // [FESTIVAL-FRISE-FOCUS] re-trouver le chip après un re-render (bascule de jour)
          // [FESTIVAL-FRISE-FOCUS] un passage sans point PROPRE reste cliquable si un projet
          // porteur géolocalisé existe (cfg.passageInfo fourni) → pin de la scène.
          title: (p.title || '') + (hasGps ? '' : (cfg.passageInfo ? ' — voir la scène sur la carte' : ' — sans position (non centrable)')),
          // overflow:hidden : les titres longs restent DANS leur étape (pas de chevauchement).
          style: 'flex-shrink:0;max-width:9.5rem;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;gap:0.08rem;'
            + 'background:var(--panel-2);border:1px ' + (hasGps ? 'solid' : 'dashed') + ' var(--border);border-radius:8px;'
            + 'padding:0.25rem 0.45rem;color:inherit;font:inherit;font-size:0.7rem;text-align:left;'
            + 'cursor:' + ((hasGps || cfg.passageInfo) ? 'pointer' : 'default') + ';'
            + (dimOtherDay ? 'opacity:0.35;' : (isPast ? 'opacity:0.45;' : ''))
            + ((isActiveDay || isToday) ? 'box-shadow:0 0 0 2px ' + ACCENT + ';' : ''),
        },
      });
      // [MAP-TRIP-POLISH] miniature de la photo du mémo dans l'étape (si dispo).
      const col = el('span', { attrs: { style: 'display:flex;flex-direction:column;gap:0.08rem;min-width:0' } });
      col.appendChild(el('span', { text: (isPast ? '✓ ' : '') + dayLbl, attrs: { style: 'color:var(--muted);font-size:0.64rem;white-space:nowrap' } }));
      col.appendChild(el('span', { text: p.title || '(mémo)', attrs: { style: 'max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600' } }));
      if (p.imgUrl) {
        const rowWrap = el('span', { attrs: { style: 'display:flex;align-items:center;gap:0.35rem;min-width:0' } });
        rowWrap.appendChild(el('img', { attrs: { src: p.imgUrl, loading: 'lazy', alt: '', style: 'width:26px;height:26px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid var(--border)' } }));
        rowWrap.appendChild(col);
        step.appendChild(rowWrap);
        step.style.flexDirection = 'row';
        step.style.alignItems = 'center';
      } else {
        step.appendChild(col);
      }
      if (!firstStepOfDay[filterDay]) firstStepOfDay[filterDay] = step;
      if (hasGps) {
        step.addEventListener('click', () => {
          // [FESTIVAL-FRISE-FOCUS] chip d'un autre jour que le filtre actif → basculer le filtre d'abord.
          const cur = switchDayThenLocate(p) || step;
          selectStep(cur, p.id);  // même repère visuel que le porteur
          const mk = markersByKey['memo:' + p.id];
          activeMap.setView([p.lat, p.lng], 15);
          if (mk) mk.marker.openPopup();
        });
      } else if (cfg.passageInfo) {
        // [FESTIVAL-FRISE-FOCUS] mémo sans point propre → pin du projet porteur (scène) + popup.
        step.addEventListener('click', () => openPassageOnPorter(p));
      }
      strip.appendChild(step);
    });
    if (!cursorPlaced) strip.appendChild(cursor()); // tout est passé → curseur en fin
    tlEl.appendChild(strip);
    // [TIMELINE-TODAY] à l'OUVERTURE seulement (1er rendu), si aujourd'hui ∈ plage ET aucun scroll de
    // frise mémorisé à restaurer → centrer la bande des jours + la frise sur aujourd'hui (sans filtrer).
    if (tlFirstRender) {
      tlFirstRender = false;
      if (todayInRange && !(cfg.restore && cfg.restore.friseScroll)) setTimeout(scrollToToday, 180);
    }
  }

  // [PHOTO-MAP] Calque photo optionnel + frise « où on était ». Activé seulement si
  // cfg.loadPhotos est fourni (carte d'un vrai projet). Lit image_meta via l'endpoint
  // scopé (déjà géocodé à l'upload) — aucun appel réseau ici. Marqueurs 📷 distincts
  // des points-mémo, filtrés par le même focus sous-projet/groupe. Clic → openImage.
  let photoOn = false, photoData = null, photoLayer = null, photoGreyLayer = null, photoBtn = null;
  // Réutilise isFocused (groupes + sous-projet) en synthétisant un point depuis la photo.
  function photoFocus(ph) { return isFocused({ kind: 'memo', project_id: ph.project_id, groups: ph.groups || [] }); }

  function drawPhotos() {
    if (!photoLayer) return;
    photoLayer.clearLayers();
    if (photoGreyLayer) photoGreyLayer.clearLayers();
    (photoData || []).forEach(ph => {
      if (ph.lat == null || ph.lng == null) return;
      const focused = photoFocus(ph);
      const icon = L.divIcon({ className: 'photo-pin', html: '<span style="font-size:16px;line-height:1;opacity:' + (focused ? 1 : 0.35) + '">📷</span>', iconSize: [22, 22], iconAnchor: [11, 11] });
      // [PHOTO-CLUSTER] Photos en focus → cluster (compteur = photos affichées) ; photos
      // grisées (hors focus) → calque plain non clusterisé, pour garder leur opacité.
      const target = (focused || !photoGreyLayer) ? photoLayer : photoGreyLayer;
      L.marker([ph.lat, ph.lng], { icon, zIndexOffset: 1000 })
        .addTo(target)
        .bindPopup('<strong>📷 ' + (ph.label || '').replace(/</g, '&lt;') + '</strong>' + (ph.taken_at ? '<br>' + fmtTaken(ph.taken_at) : ''))
        .on('click', () => cfg.openImage(ph.filename));
    });
  }

  function renderFrieze() {
    listEl.innerHTML = '';
    const list = (photoData || []).filter(ph => ph.has_gps || ph.taken_at)
      .slice().sort((a, b) => (a.taken_at || '￿').localeCompare(b.taken_at || '￿'));
    if (!list.length) {
      listEl.appendChild(el('div', { text: 'Aucune photo géolocalisée ou datée dans cette vue.', attrs: { style: 'font-size:0.8rem;color:var(--muted);padding:0.5rem' } }));
      return;
    }
    listEl.appendChild(el('div', { text: '🕘 Où on était', attrs: { style: 'font-size:0.74rem;color:var(--muted);font-weight:600;padding:0.1rem 0.35rem 0.25rem' } }));
    list.forEach(ph => {
      const focused = photoFocus(ph);
      const row = el('button', {
        attrs: { type: 'button', title: 'Ouvrir la photo', style: 'display:flex;flex-direction:column;align-items:flex-start;gap:0.1rem;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--border);padding:0.35rem 0.5rem;color:inherit;font:inherit;cursor:pointer' + (focused ? '' : ';opacity:0.4') },
        on: { click: () => cfg.openImage(ph.filename) },
      });
      row.appendChild(el('strong', { text: '📷 ' + (fmtTaken(ph.taken_at) || 'date inconnue'), attrs: { style: 'font-size:0.78rem' } }));
      row.appendChild(el('span', { text: ph.has_gps ? (ph.label || '') : 'lieu inconnu', attrs: { style: 'font-size:0.72rem;color:var(--muted)' } }));
      listEl.appendChild(row);
    });
  }

  async function togglePhotos() {
    if (!photoOn) {
      if (photoData === null) {
        photoBtn.textContent = '📷 …';
        try { photoData = await cfg.loadPhotos(); } catch (e) { photoData = []; }
        if (!Array.isArray(photoData)) photoData = [];
      }
      photoOn = true;
      // [PHOTO-CLUSTER] Cluster si le plugin auto-hébergé est chargé, sinon dégradation
      // propre vers un layerGroup simple (= comportement [PHOTO-MAP]). Défauts du plugin :
      // spiderfyOnMaxZoom (éventail au même point exact) + zoomToBoundsOnClick (split zoom).
      photoLayer = (typeof L.markerClusterGroup === 'function'
        ? L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 40, spiderfyOnMaxZoom: true, zoomToBoundsOnClick: true })
        : L.layerGroup()).addTo(activeMap);
      photoGreyLayer = L.layerGroup().addTo(activeMap);
    } else {
      photoOn = false;
      if (photoLayer) { photoLayer.remove(); photoLayer = null; }
      if (photoGreyLayer) { photoGreyLayer.remove(); photoGreyLayer = null; }
    }
    photoBtn.textContent = photoOn ? '📷 Photos ✓' : '📷 Photos';
    photoBtn.style.background = photoOn ? 'var(--accent)' : '';
    photoBtn.style.color = photoOn ? '#10141a' : '';
    photoBtn.style.borderColor = photoOn ? 'var(--accent)' : '';
    refresh(false);
  }

  // [MAP-TIMELINE] barre d'outils : 📷 (si dispo) + 🕒 Frise (si ≥1 mémo daté).
  const hasDated = !!(cfg.datedPoints && datedAll().length);
  let tlBtn = null;
  // (fix au passage : la barre s'insérait à CHAQUE ouverture sans retrait → doublons)
  const oldBar = document.getElementById('map-toolbar');
  if (oldBar) oldBar.remove();
  if (cfg.loadPhotos || hasDated || scrutins.length || planOverlay) {
    const bar = el('div', { attrs: { id: 'map-toolbar', style: 'display:flex;gap:0.35rem;align-items:center;margin:0 0 0.45rem;flex-wrap:wrap' } });
    // [FESTIVAL-MAP-OVERLAY] chip toggle « 🎪 Plan » (off par défaut, état localStorage).
    if (planOverlay) {
      planBtn = el('button', { class: 'prio-btn', text: '🎪 Plan',
        attrs: { type: 'button', title: 'Afficher le plan illustré du festival en surcouche', style: 'padding:0.1rem 0.5rem' },
        on: { click: () => setPlan(!planOn) } });
      bar.appendChild(planBtn);
    }
    // [VOTE-MAP] coche « 🗳 Voix » (gabarit « 🕒 Frise ») : pastilles visibles + perdants lisibles ;
    // décochée → pastilles masquées et (scrutin clos) perdants estompés. Persistée par projet/page.
    if (scrutins.length) {
      const vBtn = el('button', { class: 'prio-btn', attrs: { type: 'button', title: 'Afficher les compteurs de voix et mes choix sur la carte', style: 'padding:0.1rem 0.5rem' } });
      const syncV = () => { vBtn.textContent = votesOn ? '🗳 Voix ✓' : '🗳 Voix'; vBtn.style.background = votesOn ? 'var(--accent)' : ''; vBtn.style.color = votesOn ? '#10141a' : ''; vBtn.style.borderColor = votesOn ? 'var(--accent)' : ''; };
      vBtn.addEventListener('click', () => { votesOn = !votesOn; if (VOTEKEY) localStorage.setItem(VOTEKEY, votesOn ? '1' : '0'); syncV(); refresh(false); });
      syncV();
      bar.appendChild(vBtn);
    }
    if (cfg.loadPhotos) {
      photoBtn = el('button', {
        class: 'prio-btn', text: '📷 Photos',
        attrs: { type: 'button', title: 'Afficher les lieux des photos du projet (EXIF)', style: 'padding:0.1rem 0.5rem' },
        on: { click: togglePhotos },
      });
      bar.appendChild(photoBtn);
    }
    if (hasDated) {
      const syncTlBtn = () => {
        tlBtn.textContent = tlOn ? '🕒 Frise ✓' : '🕒 Frise';
        tlBtn.style.background = tlOn ? 'var(--accent)' : '';
        tlBtn.style.color = tlOn ? '#10141a' : '';
        tlBtn.style.borderColor = tlOn ? 'var(--accent)' : '';
      };
      tlBtn = el('button', {
        class: 'prio-btn',
        attrs: { type: 'button', title: 'Frise chronologique des mémos datés (masquage mémorisé)', style: 'padding:0.1rem 0.5rem' },
        // [MAP-TIMELINE-LAYOUT] invalidateSize après (dé)pliage : Leaflet recalcule
        // proprement si le dialog a changé de hauteur (la carte, elle, ne bouge pas).
        on: { click: () => { tlOn = !tlOn; if (TLKEY) localStorage.setItem(TLKEY, tlOn ? '1' : '0'); syncTlBtn(); refresh(false); setTimeout(() => activeMap && activeMap.invalidateSize(), 60); } },
      });
      syncTlBtn();
      bar.appendChild(tlBtn);
    }
    subbar.parentNode.insertBefore(bar, subbar);
  }

  function refresh(fit) {
    renderVoteBar();  // [VOTE-MAP] chips de scrutin (masqué si aucun scrutin)
    renderSubbar();
    renderGroupbar();
    renderSelbar();
    draw(current, fit);
    // [MAP-TIMELINE] frise + tracé voyage suivent le même focus que les marqueurs.
    renderTimeline();
    drawRoute();
    // [PHOTO-MAP] Le calque suit les mêmes filtres ; la frise remplace la liste mémo.
    if (photoOn) { drawPhotos(); renderFrieze(); }
  }

  // [PHOTO-TEMPLATE-MEMO] Centre la carte sur une photo précise (depuis « 📍 localiser »).
  function focusPhoto(name) {
    const p = (photoData || []).find(x => x.filename === name);
    if (p && p.lat != null) { activeMap.invalidateSize(); activeMap.setView([p.lat, p.lng], 16); }
  }

  refresh(true);
  if (planOverlay) setPlan(planOn);  // [FESTIVAL-MAP-OVERLAY] applique l'état persisté (+ sync du chip)
  if (cfg.restore) restoreMapState(cfg.restore);  // [FESTIVAL-FRISE-FOCUS #2] retour depuis la pop-in mémo

  // [PHOTO-TEMPLATE-MEMO] Ouverture directe sur le calque photo (cfg.autoPhoto), centrée
  // sur une photo si cfg.focusFilename. N'altère pas l'usage normal (cfg absents = inchangé).
  if (cfg.loadPhotos && cfg.autoPhoto) {
    togglePhotos().then(() => { if (cfg.focusFilename) setTimeout(() => focusPhoto(cfg.focusFilename), 80); });
  }
}

// [PHOTO-TEMPLATE-MEMO] Vue « Photos » d'un projet (pop-in #photo-dialog), partagée
// owner/invité (ADR-001). Données = image_meta via cfg.loadPhotos (endpoints scopés
// [PHOTO-MAP], aucune écriture mémo). Réutilise runImageViewer (plein écran) et, via
// cfg.openMap, runMapDialog (calque photo). Seule mutation = suppression (cfg.canEdit
// + cfg.deletePhoto, route image existante). Invariant 8 : pas de GSAP sur le dialog.
// cfg = { title, loadPhotos:async()=>[...], canEdit, deletePhoto:async(ph)=>{},
//         openMap:(focusFilename)=>{}, imageUrl(n), downloadUrl(n), exifUrl(n) }
async function runPhotoView(cfg) {
  const dlg = document.getElementById('photo-dialog');
  const body = document.getElementById('photo-body');
  if (!dlg || !body) return;
  document.getElementById('photo-title').textContent = '📷 ' + (cfg.title || 'Photos');
  const closeBtn = document.getElementById('photo-close');
  if (closeBtn) closeBtn.onclick = () => dlg.close();
  dlg.showModal();

  const dayKey = ph => { const m = /^(\d{4}-\d{2}-\d{2})/.exec(ph.taken_at || ''); return m ? m[1] : ''; };
  const hourKey = ph => { const m = /[T ](\d{2}:\d{2})/.exec(ph.taken_at || ''); return m ? m[1] : ''; };
  const fmtDay = k => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(k || ''); return m ? (parseInt(m[3], 10) + ' ' + (PHOTO_MONTHS_FR[parseInt(m[2], 10) - 1] || '')) : 'sans date'; };
  const byName = n => photos.find(p => p.filename === n);

  let photos = [], dayFilter = null, expandedDay = null, cur = 0;

  function sortPhotos(arr) {
    // Datées d'abord (taken_at croissant), « sans date » à la fin.
    return arr.slice().sort((a, b) => {
      const ka = dayKey(a) ? a.taken_at : '￿', kb = dayKey(b) ? b.taken_at : '￿';
      return ka.localeCompare(kb) || a.filename.localeCompare(b.filename);
    });
  }
  function visibleList() {
    return dayFilter ? photos.filter(p => dayKey(p) === dayFilter) : photos;
  }

  async function reload() {
    let data = [];
    try { data = await cfg.loadPhotos(); } catch (e) { data = []; }
    photos = sortPhotos(Array.isArray(data) ? data : []);
    if (dayFilter && !photos.some(p => dayKey(p) === dayFilter)) { dayFilter = null; expandedDay = null; }
    render();
  }

  function render() {
    body.innerHTML = '';
    if (!photos.length) {
      body.appendChild(el('div', { text: 'Aucune photo dans ce projet.', attrs: { style: 'color:var(--muted);font-size:0.85rem;padding:1.2rem;text-align:center' } }));
      return;
    }
    const vis = visibleList();
    if (cur >= vis.length) cur = vis.length - 1;
    if (cur < 0) cur = 0;
    const ph = vis[cur];

    // (1) Carrousel
    // [PHOTOS-POPIN-SIZE] la scène prend TOUTE la hauteur libre de la pop-in (classe `.pv-stage`,
    // CSS par page) ; la hauteur inline reste comme REPLI si la feuille manque, et le mobile
    // retrouve l'ancien gabarit via la media query ≤900px. `center/contain` = object-fit contain.
    const stage = el('div', { class: 'pv-stage', attrs: { style: 'position:relative;width:100%;flex:1 1 auto;min-height:min(46vh,300px);border-radius:8px;background:var(--panel-2) center/contain no-repeat;overflow:hidden;display:flex;align-items:center;justify-content:center' } });
    if (ph) stage.style.backgroundImage = 'url("' + cfg.imageUrl(ph.filename) + '")';
    const counter = el('span', { text: (cur + 1) + ' / ' + vis.length, attrs: { style: 'position:absolute;top:8px;right:10px;background:#000a;color:#fff;font-size:0.72rem;padding:0.1rem 0.45rem;border-radius:10px' } });
    stage.appendChild(counter);
    // [PHOTO-UI-CONSISTENCY] Flèches sur l'image = .iv-nav (overlay rond, comme la visionneuse).
    const nav = (txt, fn, side) => el('button', { class: 'iv-nav', text: txt, attrs: { type: 'button', style: side + ':8px' }, on: { click: fn } });
    if (vis.length > 1) {
      stage.appendChild(nav('‹', () => { cur = (cur - 1 + vis.length) % vis.length; render(); }, 'left'));
      stage.appendChild(nav('›', () => { cur = (cur + 1) % vis.length; render(); }, 'right'));
    }
    if (ph && (ph.label || ph.taken_at)) {
      const txt = '📷 ' + [ph.label || '', fmtTaken(ph.taken_at)].filter(Boolean).join(' · ');
      stage.appendChild(el('span', { text: txt, attrs: { style: 'position:absolute;left:8px;bottom:8px;max-width:80%;background:#000b;color:#fff;font-size:0.74rem;padding:0.15rem 0.5rem;border-radius:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap' } }));
    }
    body.appendChild(stage);

    // (3) Barre d'options (rotation/zoom vivent dans runImageViewer en plein écran)
    const bar = el('div', { attrs: { style: 'display:flex;gap:0.3rem;align-items:center;margin:0.5rem 0 0.4rem;flex:0 0 auto' } });
    // [PHOTO-UI-CONSISTENCY] Boutons = .iv-btn (look cards). Principal (plein écran) en
    // accent (.iv-accent), suppression en danger (.iv-del). Une seule source de vérité.
    // [HUB-CHROME] boutons d'action monochromes : icône Tabler TRAIT (currentColor) au lieu des
    // emojis/accent. La corbeille garde un danger DISCRET (rouge au survol seulement, `.iv-danger`).
    const obtn = (icon, title, fn, cls) => {
      const b2 = el('button', { class: 'iv-btn' + (cls ? ' ' + cls : ''), attrs: { type: 'button', title }, on: { click: fn } });
      const ic = hdrIcon(icon); ic.setAttribute('width', '17'); ic.setAttribute('height', '17');
      b2.appendChild(ic);
      return b2;
    };
    const openFull = () => runImageViewer({
      images: vis.map(p => p.filename), startIndex: cur,
      imageUrl: cfg.imageUrl, downloadUrl: cfg.downloadUrl, exifUrl: cfg.exifUrl,
      canDelete: !!cfg.canEdit,
      onDelete: async (name) => { const p = byName(name); if (p) { await cfg.deletePhoto(p); await reload(); } },
      // [PHOTO-ROTATE-SAVE] owner-only : seul un gabarit propriétaire pose `canRotate`. Les
      // pages invité/hub appellent ce même code sans le flag → aucun bouton, comportement
      // inchangé chez eux.
      rotateUrl: cfg.canRotate ? ((n) => '/api/images/' + n + '/rotate') : null,
      onRotated: cfg.canRotate ? (() => { reload(); }) : null,   // la grille repart droite
    });
    bar.appendChild(obtn('maximize', 'Plein écran (zoom, rotation)', openFull));
    if (ph) {
      const dl = el('a', { class: 'iv-btn', attrs: { href: (cfg.downloadUrl || cfg.imageUrl)(ph.filename), download: '', title: 'Télécharger' } });
      const dic = hdrIcon('download'); dic.setAttribute('width', '17'); dic.setAttribute('height', '17');
      dl.appendChild(dic);
      bar.appendChild(dl);
    }
    if (ph && ph.has_gps) bar.appendChild(obtn('map-pin', 'Localiser cette photo sur la carte', () => cfg.openMap(ph.filename)));
    if (cfg.canEdit && ph) {
      bar.appendChild(obtn('trash', 'Supprimer cette photo', async () => {
        if (!(await confirmPopin('Elle sera retirée de son mémo.', { title: 'Supprimer cette photo ?', okLabel: 'Supprimer' }))) return;
        await cfg.deletePhoto(ph); await reload();
      }, 'iv-danger'));
    }
    body.appendChild(bar);

    // (5) Vignettes
    const thumbs = el('div', { attrs: { style: 'display:flex;gap:0.3rem;flex-wrap:wrap;margin:0 0 0.6rem;flex:0 0 auto' } });
    vis.forEach((p, i) => {
      const t = el('button', { attrs: { type: 'button', title: fmtTaken(p.taken_at) || p.filename, style: 'width:34px;height:34px;border-radius:5px;background:var(--panel-2) center/cover no-repeat;background-image:url("' + cfg.imageUrl(p.filename) + '");cursor:pointer;flex-shrink:0;border:' + (i === cur ? '2px solid var(--accent)' : '1px solid var(--border)') }, on: { click: () => { cur = i; render(); } } });
      thumbs.appendChild(t);
    });
    body.appendChild(thumbs);

    // (6) Frise par dates
    const dated = photos.filter(p => dayKey(p));
    const days = [];
    const counts = {};
    dated.forEach(p => { const k = dayKey(p); if (!(k in counts)) days.push(k); counts[k] = (counts[k] || 0) + 1; });
    const undatedN = photos.length - dated.length;
    if (days.length || undatedN) {
      const frieze = el('div', { attrs: { style: 'display:flex;gap:0.4rem;align-items:flex-start;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:0.5rem;flex:0 0 auto' } });
      // [PHOTO-UI-CONSISTENCY] Chips = .prio-btn ; sélection = accent standard ; compteur = .badge.
      const SEL = ';background:var(--accent);border-color:var(--accent);color:#10141a';
      frieze.appendChild(el('button', { class: 'prio-btn', text: 'Tout', attrs: { type: 'button', style: dayFilter ? '' : SEL }, on: { click: () => { dayFilter = null; expandedDay = null; cur = 0; render(); } } }));
      days.forEach(k => {
        const on = dayFilter === k;
        const wrap = el('div', { attrs: { style: 'display:flex;flex-direction:column;align-items:center;gap:0.15rem' } });
        const d = el('button', { class: 'prio-btn', attrs: { type: 'button', title: counts[k] + ' photo(s)', style: 'display:inline-flex;align-items:center;gap:0.3rem' + (on ? SEL : '') }, on: { click: () => { dayFilter = on ? null : k; expandedDay = null; cur = 0; render(); } } });
        d.appendChild(el('span', { text: fmtDay(k) }));
        d.appendChild(el('span', { class: 'badge', text: String(counts[k]) }));
        wrap.appendChild(d);
        // (7) « + » → frise heures si plusieurs photos ce jour-là
        if (counts[k] > 1) {
          const exp = expandedDay === k;
          wrap.appendChild(el('button', { class: 'prio-btn', text: exp ? '−' : '+', attrs: { type: 'button', title: exp ? 'Replier les heures' : 'Déplier par heures' }, on: { click: () => { dayFilter = k; expandedDay = exp ? null : k; cur = 0; render(); } } }));
        }
        frieze.appendChild(wrap);
      });
      if (undatedN) {
        const on = dayFilter === '';
        frieze.appendChild(el('button', { class: 'prio-btn', text: 'sans date · ' + undatedN, attrs: { type: 'button', title: undatedN + ' sans date', style: on ? SEL : '' }, on: { click: () => { dayFilter = on ? null : ''; expandedDay = null; cur = 0; render(); } } }));
      }
      body.appendChild(frieze);
    }

    // (7) Panneau heures
    if (expandedDay) {
      const dayPhotos = photos.filter(p => dayKey(p) === expandedDay);
      const hours = [];
      const hc = {};
      dayPhotos.forEach(p => { const h = hourKey(p) || '??'; if (!(h in hc)) { hours.push(h); hc[h] = []; } hc[h].push(p); });
      const panel = el('div', { attrs: { style: 'margin-top:0.5rem;padding:0.5rem 0.6rem;background:var(--panel-2);border-radius:8px' } });
      panel.appendChild(el('div', { text: fmtDay(expandedDay) + ' — par heures (' + dayPhotos.length + ' photos)', attrs: { style: 'font-size:0.74rem;color:var(--muted);margin-bottom:0.35rem' } }));
      const row = el('div', { attrs: { style: 'display:flex;gap:0.5rem;flex-wrap:wrap;align-items:center' } });
      hours.forEach(h => {
        const first = hc[h][0];
        const b = el('button', { class: 'prio-btn', attrs: { type: 'button', title: hc[h].length + ' photo(s)', style: 'display:inline-flex;align-items:center;gap:0.3rem' }, on: { click: () => { dayFilter = expandedDay; cur = Math.max(0, visibleList().indexOf(first)); render(); } } });
        b.appendChild(el('span', { text: h.replace(':', 'h') }));
        if (hc[h].length > 1) b.appendChild(el('span', { class: 'badge', text: String(hc[h].length) }));
        row.appendChild(b);
      });
      panel.appendChild(row);
      body.appendChild(panel);
    }
  }

  await reload();
}

function setTheme(t) {
  const light = t === 'light';
  if (light) document.documentElement.setAttribute('data-theme', 'light');
  else document.documentElement.removeAttribute('data-theme');
  try { localStorage.setItem('theme', light ? 'light' : 'dark'); } catch (e) {}
  const u = themeBtn && themeBtn.querySelector('use');
  if (u) u.setAttribute('href', light ? '#ic-sun' : '#ic-moon');
}

function stagger(sel, opts) {
  // Autonome : calcule g (GSAP) et le reduced-motion lui-même (pas de dépendance
  // au contexte de page — cf. fix [SHARED-HELPERS], les locaux g/reduce des
  // callbacks DOMContentLoaded ne sont pas visibles depuis ce partial).
  const g = window.gsap;
  if (!g) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const nodes = document.querySelectorAll(sel);
  if (!nodes.length) return;
  g.killTweensOf(nodes);
  g.fromTo(nodes,
    { autoAlpha: 0, y: 14 },
    Object.assign({
      autoAlpha: 1, y: 0, duration: 0.4, ease: 'power2.out',
      stagger: 0.045, overwrite: true, clearProps: 'transform,opacity,visibility',
    }, opts || {}));
}

function announce(msg) {
  const e = document.getElementById('sr-live');
  if (!e) return;
  e.textContent = '';
  setTimeout(() => { e.textContent = msg; }, 40);
}

function syncHeaderHeight() {
  const h = document.querySelector('header');
  if (h) document.documentElement.style.setProperty('--header-h', h.offsetHeight + 'px');
}

// [UNDO-DELETE] Toast « … supprimé — Annuler » (~5 s) après une suppression douce. Générique :
// `onUndo` est le callback de restauration (route propre à la page). Élément flottant créé à la
// volée, tokens CSS, pas de GSAP (invariant 8). Un seul toast à la fois (remplace le précédent).
function undoToast(msg, onUndo, ms) {
  const prev = document.getElementById('undo-toast');
  if (prev) { clearTimeout(prev._t); prev.remove(); }
  const t = document.createElement('div');
  t.id = 'undo-toast';
  t.setAttribute('role', 'status');
  t.style.cssText = 'position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);z-index:4000;'
    + 'display:flex;align-items:center;gap:0.75rem;padding:0.55rem 0.9rem;border-radius:10px;'
    + 'background:var(--panel);border:1px solid var(--border);color:var(--text);font-size:0.85rem;'
    + 'box-shadow:0 6px 24px rgba(0,0,0,0.35);max-width:calc(100vw - 2rem)';
  const label = document.createElement('span');
  label.textContent = msg;
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = 'Annuler';
  btn.className = 'prio-btn';
  btn.style.cssText = 'background:var(--accent);border-color:var(--accent);color:#10141a;padding:0.15rem 0.6rem';
  const close = () => { clearTimeout(t._t); t.remove(); };
  btn.addEventListener('click', async () => { close(); try { await onUndo(); } catch (e) {} });
  t.appendChild(label); t.appendChild(btn);
  document.body.appendChild(t);
  t._t = setTimeout(close, ms || 5000);
  return t;
}

// [UPDATE-PROMPT] Invite de rechargement quand le serveur a une version PLUS RÉCENTE que celle
// embarquée au rendu de la page (JS en mémoire périmé après un déploiement — critique en PWA
// standalone : pas de bouton recharger). Appelée à CHAQUE tick de poll des 3 pages avec
// (version embarquée Jinja, version renvoyée par le serveur). Bannière persistante, PAS de reload
// sauvage. Respecte uiBusy() (pop-in/saisie) : si occupé, on ne montre pas → le prochain tick
// réessaie. Une seule bannière (idempotent). Tokens invariant 9, pas de GSAP (invariant 8).
let _updatePromptShown = false;
function promptReloadIfStale(embedded, server) {
  if (!embedded || !server || embedded === server || _updatePromptShown) return;
  if (typeof uiBusy === 'function' && uiBusy()) return;  // différé : le poll rappellera
  _updatePromptShown = true;
  const t = document.createElement('div');
  t.id = 'update-toast';
  t.setAttribute('role', 'status');
  t.style.cssText = 'position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);z-index:4200;'
    + 'display:flex;align-items:center;gap:0.75rem;padding:0.55rem 0.9rem;border-radius:10px;'
    + 'background:var(--panel);border:1px solid var(--accent);color:var(--text);font-size:0.85rem;'
    + 'box-shadow:0 6px 24px rgba(0,0,0,0.35);max-width:calc(100vw - 2rem)';
  const label = document.createElement('span');
  label.textContent = '⬆ Nouvelle version (' + server + ')';
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = 'Recharger';
  btn.className = 'prio-btn';
  btn.style.cssText = 'background:var(--accent);border-color:var(--accent);color:#10141a;padding:0.15rem 0.6rem';
  btn.addEventListener('click', async () => {
    // [OFFLINE] si un service worker est EN ATTENTE (nouvelle version prête), on l'active avant de
    // recharger → la page repart sur le nouveau cache. No-op propre là où il n'y a pas de SW (share/hub).
    try {
      if ('serviceWorker' in navigator) {
        const reg = await navigator.serviceWorker.getRegistration();
        if (reg && reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
      }
    } catch (e) {}
    try { location.reload(); } catch (e) { location.href = location.href; }
  });
  t.appendChild(label); t.appendChild(btn);
  document.body.appendChild(t);
}

// [SAVE-INDICATOR] Petit ✓ discret (~1,2 s) à chaque sauvegarde OK d'un mémo ; état d'erreur
// discret (~2,2 s) si l'enregistrement échoue. Élément flottant créé à la volée (aucun markup à
// ajouter aux pages), tokens CSS (--green/--red), aria-live. Pas de GSAP (invariant 8). PUR :
// appelé depuis chaque entonnoir de patch (owner patchMemo, invité put/putMemo) → parité 3 pages.
function flashSaved(ok) {
  let ind = document.getElementById('save-indicator');
  if (!ind) {
    ind = document.createElement('div');
    ind.id = 'save-indicator';
    ind.setAttribute('role', 'status');
    ind.setAttribute('aria-live', 'polite');
    ind.style.cssText = 'position:fixed;bottom:1rem;right:1rem;z-index:4000;padding:0.4rem 0.8rem;'
      + 'border-radius:8px;font-size:0.85rem;font-weight:600;pointer-events:none;opacity:0;'
      + 'transition:opacity 0.2s;box-shadow:0 4px 16px rgba(0,0,0,0.3)';
    document.body.appendChild(ind);
  }
  const good = ok !== false;
  ind.textContent = good ? '✓ Enregistré' : '⚠ Non enregistré';
  ind.style.background = good ? 'var(--green)' : 'var(--red)';
  ind.style.color = good ? '#10141a' : '#fff';
  ind.style.opacity = '1';
  clearTimeout(ind._t);
  ind._t = setTimeout(() => { ind.style.opacity = '0'; }, good ? 1200 : 2200);
}

function registerMentionBlot() {
  if (typeof Quill === 'undefined' || Quill.__mentionReady) return;
  const Inline = Quill.import('blots/inline');
  class MentionBlot extends Inline {
    static create(value) { const node = super.create(); node.setAttribute('data-mention', value); return node; }
    static formats(node) { return node.getAttribute('data-mention'); }
  }
  MentionBlot.blotName = 'mention';
  MentionBlot.tagName = 'span';
  MentionBlot.className = 'mention';
  Quill.register(MentionBlot, true);
  Quill.__mentionReady = true;
}

// [MEMO-TABLES] Active le module tableau (quill-table-better vendorisé) sur une config
// Quill : enregistre le module (une fois), ajoute le bouton ⊞ avant « clean » et les
// options fr. Sans le fichier vendorisé (QuillTableBetter absent), no-op → l'éditeur
// fonctionne comme avant, les tableaux existants restent rendus (invariant 6).
function applyTableBetter(modules) {
  if (typeof Quill === 'undefined' || typeof QuillTableBetter === 'undefined') return modules;
  if (!Quill.__tableBetterReady) {
    Quill.register({ 'modules/table-better': QuillTableBetter }, true);
    Quill.__tableBetterReady = true;
  }
  modules.table = false;
  modules['table-better'] = {
    language: 'fr_FR',
    menus: ['column', 'row', 'merge', 'table', 'cell', 'wrap', 'delete'],
    toolbarTable: true,
  };
  modules.keyboard = { bindings: QuillTableBetter.keyboardBindings };
  if (Array.isArray(modules.toolbar)) {
    const tb = modules.toolbar;
    const last = tb[tb.length - 1];
    const isClean = Array.isArray(last) && last.length === 1 && last[0] === 'clean';
    tb.splice(isClean ? tb.length - 1 : tb.length, 0, ['table-better']);
  }
  return modules;
}

function addMentionMatcher(q) {
  const Delta = Quill.import('delta');
  q.clipboard.addMatcher('SPAN', (node, delta) => {
    if (node.classList && node.classList.contains('mention')) {
      const nm = node.getAttribute('data-mention') || node.textContent.replace(/^@/, '');
      return new Delta().insert('@' + nm, { mention: nm });
    }
    return delta;
  });
}

/* ===== [EDITOR-AUTOLINK] Les URL deviennent des liens toutes seules dans l'éditeur =====
   Coller une URL la laissait en texte mort : il fallait re-sélectionner + bouton lien + re-coller
   (double saisie pénible au doigt). Ici le format `link` est posé dans le DELTA Quill — donnée
   riche propre, pas un post-traitement d'affichage (le `linkify()` du rendu des cards reste, il
   couvre le contenu NON riche). Zéro lib : regex maison stricte, http/https uniquement. */
// URL nue, sans la ponctuation de fin de phrase (« … voir https://x.fr/a. » → lien sans le point).
const AUTOLINK_RE = /https?:\/\/[^\s<>"'`]+/g;
function _autolinkTrim(url) {
  const m = /[.,;:!?)\]}'"»]+$/.exec(url);
  let u = m ? url.slice(0, -m[0].length) : url;
  // une parenthèse fermante n'est retirée que si elle n'est pas appariée (Wikipédia…)
  if (m && m[0].indexOf(')') >= 0 && (url.match(/\(/g) || []).length > (u.match(/\)/g) || []).length) u += ')';
  return u;
}
/* [COMMENT-LINKIFY] Rendu d'un corps de commentaire : le champ est un `<input type="text">`
   (pas de Quill) → l'auto-lien ne peut pas se faire à la SAISIE, il se fait au RENDU.
   SÉCURITÉ : on part du TEXTE brut et on construit des nœuds (`createTextNode` + `<a>`) —
   **jamais** de HTML assemblé, donc « <b>test</b> » tapé dans un commentaire reste du texte.
   Même regex qu'[EDITOR-AUTOLINK] (`AUTOLINK_RE` + `_autolinkTrim`) : UNE source de vérité,
   http/https seulement, ponctuation finale exclue. Les mentions « @Marie » et les emojis
   traversent en texte, intacts. Rétroactif : c'est du rendu, aucune migration. */
/* ===== [LINK-RENDER] Habillage des liens du CONTENU des mémos (maquette validée, règle B+C) =====
   AFFICHAGE PUR : le `href` n'est JAMAIS modifié, aucune donnée touchée, rétroactif d'office.
   Une seule source de vérité, appliquée au RENDU (cards + fiche de lecture, 3 pages).
   1a. Texte du lien = son URL, et lien SEUL dans son bloc → **chip** (icône link + domaine gras
       + chemin muted tronqué + ↗).
   1b. Texte = son URL au milieu d'une phrase → **inline apprivoisé** (pas de soulignement plein,
       bordure basse pointillée discrète, domaine gras, chemin muted).
   2.  Texte PERSONNALISÉ (≠ URL) → texte conservé tel quel + habillage inline + ↗.
   Dans une checklist / un tableau / une liste : TOUJOURS le rendu inline (jamais de chip dans une
   ligne cochable). `title` = l'URL COMPLÈTE sur chaque lien habillé. */
function _linkRenderStyle() {
  if (document.getElementById('link-render-style')) return;
  const st = document.createElement('style');
  st.id = 'link-render-style';
  st.textContent =
    // ⚠️ Spécificité : chaque page a un `.task-content a { color: var(--accent) }` (0,1,1) qui bat
    // un simple `.lnk` (0,1,0) → le repos serait accent. On qualifie donc avec `a.lnk` (0,1,1 +
    // ordre) et on double avec `.task-content a.lnk` (0,2,1) pour gagner à coup sûr.
      'a.lnk,.task-content a.lnk{display:inline;text-decoration:none;color:var(--text);'
    + 'border-bottom:1px dotted var(--muted);overflow-wrap:anywhere;transition:color .15s ease,border-color .15s ease}'
    + 'a.lnk:hover,.task-content a.lnk:hover{color:var(--accent);border-bottom-color:var(--accent)}'
    + '.lnk .lnk-dom{font-weight:600}'
    + '.lnk .lnk-path{color:var(--muted)}'
    + '.lnk:hover .lnk-path{color:var(--accent)}'
    + '.lnk .lnk-ext{font-size:0.78em;color:var(--muted);margin-left:0.15em}'
    + '.lnk:hover .lnk-ext{color:var(--accent)}'
    // chip : conteneur bordé, monochrome au repos, accent au survol ; ne déborde jamais la card
    + 'a.lnk-chip,.task-content a.lnk-chip{display:inline-flex;align-items:center;gap:0.35em;max-width:100%;'
    + 'vertical-align:baseline;border:1px solid var(--border);background:var(--panel-2);border-radius:8px;'
    + 'padding:0.12em 0.5em;text-decoration:none;color:var(--text);overflow:hidden}'
    + 'a.lnk-chip:hover,.task-content a.lnk-chip:hover{border-color:var(--accent);color:var(--accent)}'
    + '.lnk-chip .lnk-ic{flex:0 0 auto;opacity:0.75}'
    + '.lnk-chip:hover .lnk-ic{opacity:1}'
    + '.lnk-chip .lnk-dom{font-weight:600;flex:0 0 auto}'
    + '.lnk-chip .lnk-path{color:var(--muted);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto}'
    + '.lnk-chip:hover .lnk-path{color:var(--accent)}';
  document.head.appendChild(st);
}
// Découpe une URL en { dom, path } pour l'affichage (https:// et www. retirés — jamais du href).
function _linkParts(href) {
  let rest = String(href || '').replace(/^https?:\/\//i, '').replace(/^www\./i, '');
  const cut = rest.search(/[/?#]/);
  return cut < 0 ? { dom: rest, path: '' } : { dom: rest.slice(0, cut), path: rest.slice(cut) };
}
// Le texte du lien EST-il son URL ? (tolère la forme raccourcie posée par `linkify`.)
function _linkTextIsUrl(a) {
  const t = (a.textContent || '').trim().replace(/…$/, '');
  if (!t) return true;
  const h = (a.getAttribute('href') || '').trim();
  const norm = (x) => x.replace(/^https?:\/\//i, '').replace(/^www\./i, '').replace(/\/+$/, '');
  const nt = norm(t), nh = norm(h);
  return nt === nh || (nt.length > 8 && nh.indexOf(nt) === 0);
}
/* [LINK-RENDER correctif] Linkifie les URL restées en TEXTE dans un nœud déjà rendu.
   Le postulat du lot initial (« le contenu non riche passe déjà par linkify ») était faux dans un
   cas courant : un contenu RICHE (donc rendu par sanitizeHTML, sans linkify) peut contenir une URL
   tapée avant [EDITOR-AUTOLINK] — elle restait du texte mort. On travaille sur les NŒUDS TEXTE
   (jamais d'innerHTML : mentions, emojis et tout le markup existant sont préservés tels quels),
   on saute ce qui est déjà dans un <a>/<code>/<pre> et le chrome de l'app. Même regex partagée
   qu'[EDITOR-AUTOLINK]/[COMMENT-LINKIFY] (AUTOLINK_RE + _autolinkTrim) : une seule source de vérité. */
function linkifyTextNodes(root) {
  if (!root || !root.ownerDocument) return root;
  const walker = root.ownerDocument.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const targets = [];
  let n;
  while ((n = walker.nextNode())) {
    const t = n.nodeValue || '';
    if (t.indexOf('http') < 0) continue;
    const p = n.parentElement;
    if (!p || p.closest('a, code, pre, .prio-btn, .chip, .mention, .hdr-btn, .me-crumb, .task-acts')) continue;
    targets.push(n);
  }
  targets.forEach((node) => {
    const text = node.nodeValue || '';
    const frag = document.createDocumentFragment();
    let last = 0, m;
    AUTOLINK_RE.lastIndex = 0;
    while ((m = AUTOLINK_RE.exec(text)) !== null) {
      const url = _autolinkTrim(m[0]);
      if (!url) continue;
      if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      const a = document.createElement('a');
      a.href = url; a.textContent = url;                       // propriétés, jamais de HTML assemblé
      a.target = '_blank'; a.rel = 'noopener noreferrer'; a.title = url;
      a.addEventListener('click', (e) => e.stopPropagation()); // la card ne s'ouvre pas sous le lien
      frag.appendChild(a);
      last = m.index + url.length;
    }
    if (!frag.childNodes.length) return;
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    node.replaceWith(frag);
  });
  return root;
}
/* Habille les <a> d'un nœud DÉJÀ rendu. `opts.inlineOnly` force le mode inline (commentaires).
   Idempotent (`data-dressed`), et ne touche jamais les chips/mentions/chrome de l'app.
   [LINK-RENDER correctif] Linkifie d'ABORD les URL restées en texte (contenu riche compris) :
   un seul point d'entrée pour tous les chemins de rendu, impossible d'en oublier un. */
function dressLinks(root, opts) {
  if (!root || !root.querySelectorAll) return root;
  _linkRenderStyle();
  linkifyTextNodes(root);
  const inlineOnly = !!(opts && opts.inlineOnly);
  root.querySelectorAll('a[href]').forEach((a) => {
    if (a.dataset.dressed) return;
    const href = a.getAttribute('href') || '';
    if (!/^https?:\/\//i.test(href)) return;                 // http/https uniquement
    if (a.closest('.prio-btn, .chip, .mention, .hdr-btn, .me-crumb, .task-acts')) return;  // chrome de l'app
    a.dataset.dressed = '1';
    a.title = href;                                          // l'URL COMPLÈTE au survol
    const { dom, path } = _linkParts(href);
    const custom = !_linkTextIsUrl(a);
    // chip seulement si : texte = URL, lien SEUL dans son bloc, et hors liste/tableau/checklist
    const parent = a.parentElement;
    const alone = !custom && parent
      && (parent.textContent || '').trim() === (a.textContent || '').trim()
      && !a.closest('li, td, th');
    if (!custom) {
      a.textContent = '';
      if (alone && !inlineOnly) {
        a.className = (a.className ? a.className + ' ' : '') + 'lnk-chip';
        const ic = hdrIcon('link'); ic.setAttribute('width', '15'); ic.setAttribute('height', '15');
        ic.classList.add('lnk-ic');
        a.appendChild(ic);
        a.appendChild(el('span', { class: 'lnk-dom', text: dom }));
        if (path) a.appendChild(el('span', { class: 'lnk-path', text: path }));
        a.appendChild(el('span', { class: 'lnk-ext', text: '↗' }));
        return;
      }
      a.className = (a.className ? a.className + ' ' : '') + 'lnk';
      a.appendChild(el('span', { class: 'lnk-dom', text: dom }));
      if (path) a.appendChild(el('span', { class: 'lnk-path', text: path }));
      a.appendChild(el('span', { class: 'lnk-ext', text: '↗' }));
      return;
    }
    // 2. texte personnalisé : on GARDE le texte, on ajoute l'habillage inline + ↗
    a.className = (a.className ? a.className + ' ' : '') + 'lnk';
    a.appendChild(el('span', { class: 'lnk-ext', text: '↗' }));
  });
  return root;
}

function commentBodyNode(text) {
  const frag = document.createDocumentFragment();
  const src = String(text == null ? '' : text);
  let last = 0, m;
  AUTOLINK_RE.lastIndex = 0;
  while ((m = AUTOLINK_RE.exec(src)) !== null) {
    const url = _autolinkTrim(m[0]);
    if (m.index > last) frag.appendChild(document.createTextNode(src.slice(last, m.index)));
    const a = document.createElement('a');
    a.href = url;                       // http/https uniquement (garanti par la regex)
    a.textContent = url;                // texte = l'URL, jamais du HTML
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    frag.appendChild(a);
    last = m.index + url.length;
  }
  if (!last) return document.createTextNode(src);   // aucun lien → un simple nœud texte
  if (last < src.length) frag.appendChild(document.createTextNode(src.slice(last)));
  // [LINK-RENDER] habillage INLINE apprivoisé (jamais de chip dans un commentaire).
  const box = document.createElement('span');
  box.appendChild(frag);
  dressLinks(box, { inlineOnly: true });
  return box;
}

function setupAutoLink(q) {
  if (!q || q.__autolink) return q;
  q.__autolink = true;
  const Delta = Quill.import('delta');

  // 1) COLLER : chaque nœud TEXTE collé est découpé en (texte | lien | texte…). On NE touche pas
  //    au texte déjà dans un <a> (Quill lui pose son propre format link).
  q.clipboard.addMatcher(Node.TEXT_NODE, (node, delta) => {
    if (node.parentElement && node.parentElement.closest('a')) return delta;
    const text = node.data || '';
    if (!/https?:\/\//i.test(text)) return delta;
    const out = new Delta();
    let last = 0;
    AUTOLINK_RE.lastIndex = 0;
    let m;
    while ((m = AUTOLINK_RE.exec(text)) !== null) {
      const url = _autolinkTrim(m[0]);
      if (m.index > last) out.insert(text.slice(last, m.index));
      out.insert(url, { link: url });
      last = m.index + url.length;
    }
    if (!last) return delta;
    if (last < text.length) out.insert(text.slice(last));
    return out;
  });

  // 2) TAPER : une URL suivie d'un ESPACE ou d'une ENTRÉE est liée au moment du séparateur
  //    (façon messageries). On ne réagit qu'aux frappes de l'utilisateur (`source === 'user'`)
  //    et jamais à notre propre `formatText` (drapeau `busy`, sinon récursion).
  let busy = false;
  q.on('text-change', (delta, _old, source) => {
    if (source !== 'user' || busy) return;
    // Position DÉDUITE DU DELTA (retain cumulés) plutôt que de `getSelection()` : celle-ci peut
    // être nulle (éditeur non focalisé, saisie programmatique, IME mobile) — le delta, lui, est
    // toujours juste.
    const ops = delta.ops || [];
    let at = 0, ins = '';
    for (const op of ops) {
      if (typeof op.retain === 'number') { at += op.retain; continue; }
      if (typeof op.insert === 'string') { ins = op.insert; break; }
      return;                                                      // suppression/embed → rien à faire
    }
    if (ins !== ' ' && ins !== '\n') return;                       // seuls les séparateurs déclenchent
    const end = at;                                                // fin du mot, juste avant le séparateur
    if (end <= 0) return;
    const caret = at + ins.length;
    const start = Math.max(0, end - 2048);
    const before = q.getText(start, end - start);
    const m = /(?:^|\s)(https?:\/\/[^\s<>"'`]+)$/.exec(before);
    if (!m) return;
    const url = _autolinkTrim(m[1]);
    const idx = end - url.length;
    if (idx < 0) return;
    if ((q.getFormat(idx, url.length) || {}).link) return;         // déjà un lien → on ne re-lie pas
    // Étape d'historique PROPRE : `cutoff()` isole la transformation, donc un seul Ctrl+Z la défait
    // sans effacer la frappe.
    setTimeout(() => {
      busy = true;
      try {
        if (q.history && q.history.cutoff) q.history.cutoff();
        q.formatText(idx, url.length, 'link', url, 'user');
        // Curseur remis APRÈS le séparateur. ⚠️ NE PAS appeler `q.format('link', false)` ici :
        // à sélection vide Quill matérialise un « cursor blot » (`<span class="ql-cursor">`) qui
        // se retrouvait DANS le HTML sauvegardé (`getSemanticHTML`). Inutile de toute façon : le
        // séparateur est hors de la plage formatée, la frappe suivante n'hérite donc pas du lien.
        if (q.hasFocus()) q.setSelection(caret, 0, 'silent');
      } finally { busy = false; }
    }, 0);
  });
  return q;
}

function attachInputMention(input, getNames) {
  const menu = document.createElement('div');
  menu.className = 'mention-menu';
  menu.style.display = 'none';
  (input.closest('dialog') || document.body).appendChild(menu);
  let open = false, items = [], active = 0, qstart = -1;
  const close = () => { open = false; menu.style.display = 'none'; };
  const draw = () => {
    menu.innerHTML = '';
    items.forEach((it, i) => {
      const row = document.createElement('div');
      row.className = 'mention-item' + (i === active ? ' active' : '');
      row.textContent = it.add ? ('➕ Ajouter « ' + it.value + ' »') : ('@' + it.value);
      row.addEventListener('mousedown', (e) => { e.preventDefault(); pick(i); });
      menu.appendChild(row);
    });
  };
  const place = () => {
    const r = input.getBoundingClientRect();
    menu.style.left = Math.round(r.left) + 'px';
    menu.style.top = Math.round(r.bottom + 4) + 'px';
    menu.style.minWidth = Math.round(r.width) + 'px';
  };
  const pick = (i) => {
    const it = items[i]; if (!it) { close(); return; }
    const name = String(it.value).trim(); if (!name) { close(); return; }
    const val = input.value, pos = input.selectionStart;
    input.value = val.slice(0, qstart) + '@' + name + ' ' + val.slice(pos);
    const np = qstart + name.length + 2;
    input.setSelectionRange(np, np);
    close(); input.focus();
  };
  const detect = () => {
    const before = input.value.slice(0, input.selectionStart);
    const m = /(?:^|\s)@([^\s@]*)$/.exec(before);
    if (!m) { close(); return; }
    qstart = input.selectionStart - m[1].length - 1;
    const q = m[1].toLowerCase();
    const all = (getNames() || []).filter(Boolean);
    const list = all.filter(n => n.toLowerCase().includes(q)).map(v => ({ value: v }));
    if (m[1] && !all.some(n => n.toLowerCase() === q)) list.push({ value: m[1], add: true });
    items = list;
    if (!items.length) { close(); return; }
    if (active >= items.length) active = 0;
    draw(); place(); menu.style.display = 'block'; open = true;
  };
  input.addEventListener('input', detect);
  input.addEventListener('keydown', (e) => {
    if (!open || !items.length) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); e.stopImmediatePropagation(); active = (active + 1) % items.length; draw(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); e.stopImmediatePropagation(); active = (active - 1 + items.length) % items.length; draw(); }
    else if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); e.stopImmediatePropagation(); pick(active); }
    else if (e.key === 'Escape') { e.stopImmediatePropagation(); close(); }
  });
  input.addEventListener('blur', () => setTimeout(close, 150));
}

function setupMentions(quill, getNames, onPick) {
  const host = quill.container.closest('dialog') || document.body;
  const menu = document.createElement('div');
  menu.className = 'mention-menu';
  menu.style.display = 'none';
  host.appendChild(menu);
  let open = false, items = [], active = 0, query = '', picking = false;

  const close = () => { open = false; menu.style.display = 'none'; };
  const draw = () => {
    menu.innerHTML = '';
    items.forEach((it, i) => {
      const row = document.createElement('div');
      row.className = 'mention-item' + (i === active ? ' active' : '');
      row.textContent = it.add ? ('➕ Ajouter « ' + it.value + ' »') : ('@' + it.value);
      row.addEventListener('mousedown', (e) => { e.preventDefault(); pick(i); });
      row.addEventListener('mousemove', () => { if (active !== i) { active = i; draw(); } });
      menu.appendChild(row);
    });
  };
  const place = () => {
    const sel = quill.getSelection(); if (!sel) return;
    const b = quill.getBounds(sel.index);
    const c = quill.container.getBoundingClientRect();
    menu.style.left = Math.round(c.left + b.left) + 'px';
    menu.style.top = Math.round(c.top + b.bottom + 4) + 'px';
  };
  const refresh = () => {
    const all = (getNames() || []).filter(Boolean);
    const q = query.toLowerCase();
    const list = all.filter(n => n.toLowerCase().includes(q)).map(v => ({ value: v }));
    if (query && !all.some(n => n.toLowerCase() === q)) list.push({ value: query, add: true });
    items = list;
    if (!items.length) { close(); return; }
    if (active >= items.length) active = 0;
    draw(); place();
    menu.style.display = 'block'; open = true;
  };
  const pick = (i) => {
    const it = items[i]; if (!it) { close(); return; }
    const name = String(it.value).trim(); if (!name) { close(); return; }
    const sel = quill.getSelection(true); if (!sel) { close(); return; }
    const delLen = query.length + 1;
    const start = sel.index - delLen;
    picking = true;
    quill.deleteText(start, delLen, 'user');
    quill.insertText(start, '@' + name, { mention: name }, 'user');
    quill.insertText(start + name.length + 1, ' ', { mention: false }, 'user');
    quill.setSelection(start + name.length + 2, 0, 'user');
    picking = false;
    close();
    try { onPick(name); } catch (e) {}
  };
  const detect = () => {
    if (picking) return;
    const sel = quill.getSelection();
    if (!sel || sel.length) { close(); return; }
    const m = /(?:^|\s)@([^\s@]*)$/.exec(quill.getText(0, sel.index));
    if (!m) { close(); return; }
    query = m[1];
    refresh();
  };
  quill.on('text-change', (d, o, source) => { if (source === 'user') detect(); else close(); });
  quill.on('selection-change', (range) => { if (!range && !picking) close(); });
  quill.root.addEventListener('keydown', (e) => {
    if (!open || !items.length) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); e.stopImmediatePropagation(); active = (active + 1) % items.length; draw(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); e.stopImmediatePropagation(); active = (active - 1 + items.length) % items.length; draw(); }
    else if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); e.stopImmediatePropagation(); pick(active); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); close(); }
  }, true);
}

// [IMAGE-CAROUSEL] Visionneuse carrousel partagée (ADR-001, modèle runMapDialog).
// Pure / sans état hors `cfg` ; tout le spécifique page passe par cfg, donc le
// périmètre invité ne s'élargit pas. Construit le DOM dans le <dialog id="lightbox">.
//   cfg = { images:[name], startIndex, imageUrl(name), downloadUrl(name),

// [IMAGE-EXIF] exifUrl optionnel : URL renvoyant {lat,lng,label,datetime} lus à la
// volée côté serveur. Affichage SEUL (badge 📷), aucune écriture mémo.
// Rotation/zoom = AFFICHAGE SEUL (transform CSS, non persisté, aucun fetch),
// remis à zéro à chaque navigation et fermeture. Pas de GSAP sur le dialog (invariant 8).
// [VIEWER-FILMSTRIP] Style de la bande de vignettes, auto-contenu (injecté une fois) → parité

function attachQuickView(title, makeCfg) {
  let dlg = document.getElementById('attach-view-dialog');
  if (!dlg) {
    dlg = document.createElement('dialog');
    dlg.id = 'attach-view-dialog';
    dlg.style.cssText = 'width:min(520px,94vw);border:1px solid var(--border);border-radius:14px;'
      + 'background:var(--panel);color:var(--text);padding:1rem';
    document.body.appendChild(dlg);
  }
  function render() {
    dlg.innerHTML = '';
    const head = el('div', { attrs: { style: 'display:flex;align-items:center;gap:0.5rem;margin-bottom:0.6rem' } });
    head.appendChild(el('h3', { text: title, attrs: { style: 'margin:0;font-size:1rem;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap' } }));
    const x = el('button', { class: 'prio-btn', text: '✕', attrs: { type: 'button', title: 'Fermer', style: 'padding:0.1rem 0.5rem' } });
    x.addEventListener('click', () => dlg.close());
    head.appendChild(x);
    dlg.appendChild(head);
    const cfg = makeCfg(render);
    const list = cfg.attachments || [];
    if (!list.length && !cfg.canEdit) dlg.appendChild(el('div', { attrs: { style: 'color:var(--muted);font-size:0.85rem' }, text: 'Aucun fichier joint.' }));
    dlg.appendChild(renderAttachments(cfg));
  }
  render();
  dlg.showModal();
}

// ── [POMODORO] Widget minuteur/chrono flottant (3 pages via le partial) ──────────────
// 3 modes : 🍅 Pomodoro (travail/pause en cycles) · ⏳ Minuteur (décompte) · ⏱ Chrono (croissant).
// Source de vérité = timestamps absolus (endAt / chronoStart) recalculés à chaque tick depuis
// Date.now() → exact même onglet en arrière-plan (recalage sur visibilitychange). Alerte double
// (dés)activable : SON via Web Audio (bip synthétisé à la volée, ZÉRO asset — invariant 6) +
// VIBRATION via navigator.vibrate (guardée, no-op sur iOS). État 100 % local (localStorage),
// zéro route/schéma/export, aucune donnée partagée → parité owner/invité/hub gratuite.
function initPomodoro() {
  if (typeof document === 'undefined' || !document.body || document.getElementById('pomo-launch')) return;
  const LS = 'pomo:v1';
  const LR_R = 44, LR_C = 2 * Math.PI * 44;   // [B] anneau du LANCEUR (rayon/circonférence)
  const P = { mode: 'pomodoro', alarmSound: true, alarmVibrate: true, alarmNotify: false, workMin: 25, breakMin: 5, timerMin: 10 };
  try { Object.assign(P, JSON.parse(localStorage.getItem(LS) || '{}')); } catch (e) {}
  const save = () => { try { localStorage.setItem(LS, JSON.stringify({ mode: P.mode, alarmSound: P.alarmSound, alarmVibrate: P.alarmVibrate, alarmNotify: P.alarmNotify, workMin: P.workMin, breakMin: P.breakMin, timerMin: P.timerMin })); } catch (e) {} };
  // Runtime (non persisté — un reload = minuteur arrêté, config conservée).
  let running = false, endAt = 0, remainMs = 0, phase = 'work', chronoStart = 0, chronoAcc = 0, launchRingFg = null;
  // [C] Couleurs d'anneau en tokens : travail/minuteur = accent (action), pause = vert (repos).
  const ringColor = () => (P.mode === 'pomodoro' && phase === 'break') ? 'var(--green)' : 'var(--accent)';

  // Audio synthétisé (débloqué au 1er Démarrer = geste utilisateur).
  let actx = null;
  function ensureAudio() { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx && actx.state === 'suspended') actx.resume().catch(() => {}); } catch (e) { actx = null; } }
  function beep() {
    if (!P.alarmSound || !actx) return;
    try {
      const t = actx.currentTime;
      for (let i = 0; i < 3; i++) {
        const o = actx.createOscillator(), g = actx.createGain(), s = t + i * 0.22;
        o.type = 'sine'; o.frequency.value = 880;
        g.gain.setValueAtTime(0.0001, s);
        g.gain.exponentialRampToValueAtTime(0.3, s + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, s + 0.18);
        o.connect(g); g.connect(actx.destination); o.start(s); o.stop(s + 0.2);
      }
    } catch (e) {}
  }
  function buzz() { if (P.alarmVibrate && navigator.vibrate) { try { navigator.vibrate([120, 60, 120, 60, 120]); } catch (e) {} } }

  const baseMs = () => (P.mode === 'timer' ? P.timerMin : (phase === 'work' ? P.workMin : P.breakMin)) * 60000;
  const fmt = (ms) => { ms = Math.max(0, Math.round(ms / 1000)); return String(Math.floor(ms / 60)).padStart(2, '0') + ':' + String(ms % 60).padStart(2, '0'); };

  // Injection CSS unique (tokens, pas de GSAP).
  if (!document.getElementById('pomo-style')) {
    const st = document.createElement('style'); st.id = 'pomo-style';
    st.textContent = '#pomo-launch{position:fixed;left:1rem;bottom:1rem;z-index:3500;width:2.6rem;height:2.6rem;border-radius:50%;'
      + 'border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:1.1rem;cursor:pointer;'
      + 'box-shadow:0 4px 16px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center}'
      + '#pomo-launch.run{border-color:var(--accent)}'
      + '.pomo-launch-ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);pointer-events:none}'
      + '.plr-bg{fill:none;stroke:var(--border);stroke-width:7}'
      + '.plr-fg{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset 0.25s linear,stroke 0.2s}'
      + '.plr-ic{position:relative;font-size:1.1rem;line-height:1}'
      + '#pomo-panel{position:fixed;left:1rem;bottom:3.9rem;z-index:3500;width:16rem;max-width:calc(100vw - 2rem);'
      + 'background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:0.8rem;color:var(--text);'
      + 'box-shadow:0 8px 30px rgba(0,0,0,0.4);font-size:0.85rem}'
      + '#pomo-panel[hidden]{display:none}'
      + '#pomo-launch[hidden],#pomo-reshow[hidden]{display:none}'
      + '#pomo-reshow{position:fixed;left:0;bottom:1.2rem;z-index:3500;width:1.5rem;height:1.9rem;'
      + 'border:1px solid var(--border);border-left:none;border-radius:0 8px 8px 0;background:var(--panel);'
      + 'color:var(--muted);font-size:0.85rem;cursor:pointer;opacity:0.6;display:flex;align-items:center;justify-content:center}'
      + '#pomo-reshow:hover{opacity:1;color:var(--text)}'
      + '.pomo-head{display:flex;align-items:center;gap:0.4rem;margin:-0.2rem -0.2rem 0.5rem;padding:0.15rem 0.2rem;'
      + 'cursor:move;touch-action:none;user-select:none;-webkit-user-select:none}'
      + '.pomo-grip{flex:1;font-weight:600;font-size:0.8rem;color:var(--muted)}'
      + '.pomo-x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.9rem;line-height:1;padding:0.1rem 0.3rem;border-radius:5px}'
      + '.pomo-x:hover{color:var(--text);background:var(--panel-2)}'
      + '.pomo-modes{display:flex;gap:0.3rem;margin-bottom:0.6rem}'
      + '.pomo-ring-wrap{position:relative;width:8.5rem;height:8.5rem;margin:0.2rem auto}'
      + '.pomo-ring{width:100%;height:100%;transform:rotate(-90deg)}'
      + '.pomo-ring-bg{fill:none;stroke:var(--border);stroke-width:6}'
      + '.pomo-ring-fg{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset 0.25s linear}'
      + '.pomo-ring-fg.pause{stroke:var(--yellow)}'
      + '.pomo-time{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;'
      + 'font-size:1.9rem;font-weight:700;letter-spacing:0.02em;font-variant-numeric:tabular-nums}'
      + '.pomo-phase{text-align:center;font-size:0.78rem;color:var(--muted);min-height:1em;margin-bottom:0.5rem}'
      + '.pomo-phase.flash{color:var(--accent);font-weight:700}'
      + '.pomo-cfg{display:flex;gap:0.4rem;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:0.5rem;font-size:0.78rem;color:var(--muted)}'
      + '.pomo-cfg input{width:3rem;background:var(--bg);border:1px solid var(--border);border-radius:5px;color:var(--text);font:inherit;padding:0.2rem 0.3rem;text-align:center}'
      + '.pomo-ctrl{display:flex;gap:0.4rem;margin-bottom:0.5rem}.pomo-ctrl button{flex:1}'
      /* [BUTTONS-AUDIT] « Démarrer » quitte l'aplat `button.primary` pour la teinte accent LÉGÈRE
         du gabarit `.luc-primary`. Classe dédiée (et non `lucioleize`) : ce bouton réécrit son
         libellé via `textContent` (Démarrer ⇄ Pause), ce qui effacerait la lueur Luciole. */
      + '.pomo-start{background:color-mix(in srgb, var(--accent) 12%, var(--panel-2));color:var(--accent);border:1px solid var(--accent);font-weight:600}'
      + '.pomo-start:hover{background:color-mix(in srgb, var(--accent) 24%, var(--panel-2))}'
      + ':root[data-theme="light"] .pomo-start{background:rgba(79,195,247,0.12);border-color:#4fc3f7;color:#1565c0}'
      + ':root[data-theme="light"] .pomo-start:hover{background:rgba(79,195,247,0.22)}'
      + '.pomo-alarms{display:flex;gap:0.8rem;justify-content:center;font-size:0.78rem;color:var(--muted)}'
      + '.pomo-alarms label{display:flex;align-items:center;gap:0.25rem;cursor:pointer}';
    document.head.appendChild(st);
  }

  const launch = document.createElement('button');
  launch.id = 'pomo-launch'; launch.type = 'button';
  // [B] anneau de progression autour du lanceur (visible panneau fermé) + ⏱ centré.
  launch.innerHTML = '<svg class="pomo-launch-ring" viewBox="0 0 100 100">'
    + '<circle class="plr-bg" cx="50" cy="50" r="' + LR_R + '"></circle>'
    + '<circle class="plr-fg" cx="50" cy="50" r="' + LR_R + '" stroke-dasharray="' + LR_C + '" stroke-dashoffset="0"></circle></svg>'
    + '<span class="plr-ic">⏱</span>';
  launchRingFg = launch.querySelector('.plr-fg');
  launch.title = 'Minuteur / Pomodoro / Chronomètre'; launch.setAttribute('aria-label', launch.title);
  const panel = document.createElement('div');
  panel.id = 'pomo-panel'; panel.hidden = true; panel.setAttribute('role', 'dialog'); panel.setAttribute('aria-label', 'Minuteur');
  // [POMODORO V1.1] pastille de réaffichage (universelle owner+invité : pas de Paramètres sur share/hub).
  const reshow = document.createElement('button');
  reshow.id = 'pomo-reshow'; reshow.type = 'button'; reshow.textContent = '⏱';
  reshow.title = 'Afficher le minuteur'; reshow.setAttribute('aria-label', reshow.title);
  document.body.appendChild(launch); document.body.appendChild(panel); document.body.appendChild(reshow);

  // [POMODORO V1.1] préférence d'affichage du lanceur, persistée (état local, chacun pour soi).
  let hidden = false; try { hidden = localStorage.getItem('pomoHidden') === '1'; } catch (e) {}
  function applyVisibility() { launch.hidden = hidden; reshow.hidden = !hidden; if (hidden) { panel.hidden = true; restoreTitle(); } }
  function setHidden(v) { hidden = !!v; try { localStorage.setItem('pomoHidden', hidden ? '1' : '0'); } catch (e) {} applyVisibility(); }
  reshow.addEventListener('click', () => setHidden(false));
  window.pomoSetHidden = setHidden;               // pilotable depuis les Paramètres owner
  window.pomoIsHidden = () => hidden;

  const MODES = [['pomodoro', '🍅', 'Pomodoro'], ['timer', '⏳', 'Minuteur'], ['chrono', '⏱', 'Chrono']];
  let timeEl, phaseEl, cfgEl, startBtn, ringFg;
  const RING_R = 42, RING_C = 2 * Math.PI * 42;   // [E] rayon / circonférence de l'anneau
  let origTitle = null;                            // [C] snapshot du titre d'onglet

  // [POMODORO V1.1] Position persistée du panneau + contrainte au viewport (jamais hors écran).
  let pomoPos = null; try { pomoPos = JSON.parse(localStorage.getItem('pomoPos') || 'null'); } catch (e) {}
  function clampPos(x, y, w, h) {
    const maxX = Math.max(0, window.innerWidth - w), maxY = Math.max(0, window.innerHeight - h);
    return [Math.min(Math.max(0, x), maxX), Math.min(Math.max(0, y), maxY)];
  }
  // [POMODORO V1.2] position persistée du LANCEUR + suppression du clic d'ouverture après un drag.
  let pomoLaunchPos = null; try { pomoLaunchPos = JSON.parse(localStorage.getItem('pomoLaunchPos') || 'null'); } catch (e) {}
  let launchSuppressClick = 0;
  function applyLaunchPos() {
    if (!pomoLaunchPos) return;  // sinon défaut CSS (bas-gauche)
    const r = launch.getBoundingClientRect();
    const [x, y] = clampPos(pomoLaunchPos.x, pomoLaunchPos.y, r.width || 42, r.height || 42);
    launch.style.left = x + 'px'; launch.style.top = y + 'px'; launch.style.bottom = 'auto';
  }
  // [POMODORO V1.2] Ouvre le panneau PRÈS du lanceur, en basculant côté/haut-bas près d'un bord
  // pour rester dans le viewport. Utilisé quand le panneau n'a pas de position propre (pomoPos).
  function positionPanelNearLaunch() {
    const lr = launch.getBoundingClientRect(), pr = panel.getBoundingClientRect(), gap = 8;
    const pw = pr.width || 256, ph = pr.height || 320;
    let x = lr.left; if (x + pw > window.innerWidth) x = lr.right - pw;   // déborde à droite → aligne à droite
    let y = lr.top - ph - gap; if (y < 0) y = lr.bottom + gap;            // pas de place au-dessus → en dessous
    const [cx, cy] = clampPos(x, y, pw, ph);
    panel.style.left = cx + 'px'; panel.style.top = cy + 'px'; panel.style.bottom = 'auto';
  }
  function applyPanelPos() {
    // Position propre du panneau (déplacé par l'utilisateur) prioritaire ; sinon près du lanceur.
    if (pomoPos) {
      const r = panel.getBoundingClientRect();
      const [x, y] = clampPos(pomoPos.x, pomoPos.y, r.width || 256, r.height || 200);
      panel.style.left = x + 'px'; panel.style.top = y + 'px'; panel.style.bottom = 'auto';
    } else { positionPanelNearLaunch(); }
  }
  // Panneau déplaçable par sa barre d'en-tête (poignée), Pointer Events souris + tactile,
  // même pattern que le DnD des favoris (invariant 6/9). Position clampée + persistée au drop.
  function makeDraggable(handle) {
    let pid = null, sx = 0, sy = 0, ox = 0, oy = 0, dragging = false;
    handle.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button')) return;  // pas de drag depuis le ✕
      pid = e.pointerId; const r = panel.getBoundingClientRect(); ox = r.left; oy = r.top; sx = e.clientX; sy = e.clientY; dragging = true;
      panel.style.bottom = 'auto';
      try { handle.setPointerCapture(pid); } catch (_) {}
      e.preventDefault();
    });
    handle.addEventListener('pointermove', (e) => {
      if (!dragging || e.pointerId !== pid) return;
      e.preventDefault();
      const r = panel.getBoundingClientRect();
      const [x, y] = clampPos(ox + (e.clientX - sx), oy + (e.clientY - sy), r.width, r.height);
      panel.style.left = x + 'px'; panel.style.top = y + 'px';
    });
    const end = (e) => {
      if (e.pointerId !== pid || !dragging) return;
      dragging = false; const r = panel.getBoundingClientRect(); pomoPos = { x: r.left, y: r.top };
      try { localStorage.setItem('pomoPos', JSON.stringify(pomoPos)); } catch (_) {}
    };
    handle.addEventListener('pointerup', end);
    handle.addEventListener('pointercancel', end);
  }

  function buildPanel() {
    panel.innerHTML = '';
    // [POMODORO V1.1] barre d'en-tête = poignée de déplacement + ✕ masquer.
    const head = el('div', { class: 'pomo-head' });
    head.appendChild(el('span', { class: 'pomo-grip', text: '⏱ Minuteur' }));
    head.appendChild(el('button', { class: 'pomo-x', text: '✕', attrs: { type: 'button', title: 'Masquer le minuteur' }, on: { click: () => setHidden(true) } }));
    panel.appendChild(head);
    makeDraggable(head);
    const modes = el('div', { class: 'pomo-modes' });
    MODES.forEach(([m, ic, lbl]) => {
      modes.appendChild(el('button', {
        class: 'prio-btn', text: ic + ' ' + lbl,
        attrs: { type: 'button', style: 'padding:0.15rem 0.4rem;font-size:0.75rem;' + (P.mode === m ? 'background:var(--accent);border-color:var(--accent);color:#10141a' : '') },
        on: { click: () => { if (P.mode === m) return; stop(); P.mode = m; phase = 'work'; save(); buildPanel(); render(); } },
      }));
    });
    panel.appendChild(modes);
    // [POMODORO V1.1-E] anneau de progression SVG + temps centré (recalculé depuis les timestamps).
    const ringWrap = el('div', { class: 'pomo-ring-wrap' });
    ringWrap.innerHTML = '<svg class="pomo-ring" viewBox="0 0 100 100">'
      + '<circle class="pomo-ring-bg" cx="50" cy="50" r="' + RING_R + '"></circle>'
      + '<circle class="pomo-ring-fg" cx="50" cy="50" r="' + RING_R + '" stroke-dasharray="' + RING_C + '" stroke-dashoffset="0"></circle></svg>';
    ringFg = ringWrap.querySelector('.pomo-ring-fg');
    timeEl = el('div', { class: 'pomo-time', text: '00:00' });
    ringWrap.appendChild(timeEl);
    phaseEl = el('div', { class: 'pomo-phase' });
    panel.appendChild(ringWrap); panel.appendChild(phaseEl);

    cfgEl = el('div', { class: 'pomo-cfg' });
    const numIn = (val, min, max, on) => { const i = el('input', { attrs: { type: 'number', min: String(min), max: String(max), value: String(val) } }); i.addEventListener('change', () => { let v = parseInt(i.value, 10); if (isNaN(v)) v = min; v = Math.max(min, Math.min(max, v)); i.value = String(v); on(v); }); return i; };
    if (P.mode === 'pomodoro') {
      cfgEl.append('Travail ', numIn(P.workMin, 1, 180, v => { P.workMin = v; save(); if (!running) render(); }), 'min · Pause ', numIn(P.breakMin, 1, 60, v => { P.breakMin = v; save(); if (!running) render(); }), 'min');
    } else if (P.mode === 'timer') {
      cfgEl.append('Durée ', numIn(P.timerMin, 1, 600, v => { P.timerMin = v; save(); if (!running) render(); }), 'min');
    } else {
      cfgEl.append('Chronomètre — compte croissant');
    }
    panel.appendChild(cfgEl);

    const ctrl = el('div', { class: 'pomo-ctrl' });
    startBtn = el('button', { class: 'pomo-start', text: 'Démarrer', attrs: { type: 'button' }, on: { click: toggle } });
    ctrl.appendChild(startBtn);
    ctrl.appendChild(el('button', { text: 'Réinitialiser', attrs: { type: 'button' }, on: { click: () => { stop(); render(); } } }));
    panel.appendChild(ctrl);

    if (P.mode !== 'chrono') {
      const al = el('div', { class: 'pomo-alarms' });
      const mk = (key, label) => { const w = el('label'); const cb = el('input', { attrs: { type: 'checkbox' } }); cb.checked = !!P[key]; cb.addEventListener('change', () => { P[key] = cb.checked; save(); }); w.appendChild(cb); w.append(' ' + label); return w; };
      al.appendChild(mk('alarmSound', '🔔 Son')); al.appendChild(mk('alarmVibrate', '📳 Vibration'));
      // [POMODORO V1.1-D] Notification desktop : permission demandée au clic (geste), dégradation propre.
      if ('Notification' in window) {
        const w = el('label'); const cb = el('input', { attrs: { type: 'checkbox' } });
        cb.checked = !!P.alarmNotify && Notification.permission === 'granted';
        cb.addEventListener('change', () => {
          if (cb.checked) {
            if (Notification.permission === 'granted') { P.alarmNotify = true; }
            else if (Notification.permission === 'denied') { cb.checked = false; P.alarmNotify = false; notify('Notifications bloquées par le navigateur.', { error: true }); }
            else { Notification.requestPermission().then((perm) => { P.alarmNotify = (perm === 'granted'); cb.checked = P.alarmNotify; save(); }); }
          } else { P.alarmNotify = false; }
          save();
        });
        w.appendChild(cb); w.append(' 🖥 Notification'); al.appendChild(w);
      }
      panel.appendChild(al);
    }
    render();
  }

  function currentMs() {
    if (P.mode === 'chrono') return chronoAcc + (running ? (Date.now() - chronoStart) : 0);
    return running ? Math.max(0, endAt - Date.now()) : (remainMs || baseMs());
  }
  function render() {
    if (!timeEl) return;
    const ms = currentMs();
    timeEl.textContent = fmt(ms);
    phaseEl.textContent = P.mode === 'pomodoro' ? (phase === 'work' ? '🍅 Travail' : '☕ Pause') : (P.mode === 'chrono' ? 'Chronomètre' : 'Minuteur');
    if (startBtn) startBtn.textContent = running ? 'Pause' : (P.mode === 'chrono' ? 'Démarrer' : ((remainMs && remainMs < baseMs()) ? 'Reprendre' : 'Démarrer'));
    launch.classList.toggle('run', running);
    // [E]/[B]/[C] anneaux (panneau + lanceur) : décompte = se vide (frac restant) ; chrono = plein.
    // Couleur bicolore en Pomodoro : travail = accent (action), pause = vert (repos).
    let frac = 1;
    if (P.mode !== 'chrono') { const base = baseMs(); frac = base > 0 ? Math.max(0, Math.min(1, ms / base)) : 0; }
    const col = ringColor();
    if (ringFg) { ringFg.setAttribute('stroke-dashoffset', String(RING_C * (1 - frac))); ringFg.style.stroke = col; }
    if (launchRingFg) { launchRingFg.setAttribute('stroke-dashoffset', String(LR_C * (1 - frac))); launchRingFg.style.stroke = col; }
    // [C] titre d'onglet = temps restant pendant un décompte/chrono actif ; restauré sinon/masqué.
    if (running && !hidden) updateTitle(ms); else restoreTitle();
  }
  function updateTitle(ms) {
    if (origTitle == null) origTitle = document.title;
    document.title = '⏱ ' + fmt(ms) + ' · ' + origTitle;
  }
  function restoreTitle() { if (origTitle != null) { document.title = origTitle; origTitle = null; } }
  function toggle() { running ? pause() : start(); }
  function start() {
    ensureAudio();
    if (P.mode === 'chrono') { chronoStart = Date.now(); }
    else { if (!remainMs || remainMs <= 0) remainMs = baseMs(); endAt = Date.now() + remainMs; }
    running = true; render();
  }
  function pause() {
    if (P.mode === 'chrono') { chronoAcc += Date.now() - chronoStart; }
    else { remainMs = Math.max(0, endAt - Date.now()); }
    running = false; render();
  }
  function stop() { running = false; remainMs = 0; chronoAcc = 0; chronoStart = 0; phase = 'work'; }
  function fireAlarm() {
    beep(); buzz();
    // [POMODORO V1.1-D] notification desktop (complète son + vibration, ne les remplace pas).
    if (P.alarmNotify && ('Notification' in window) && Notification.permission === 'granted') {
      try { new Notification(P.mode === 'pomodoro' ? '🍅 Pomodoro terminé !' : '⏳ Minuteur terminé !'); } catch (e) {}
    }
    if (phaseEl) { phaseEl.classList.add('flash'); setTimeout(() => phaseEl && phaseEl.classList.remove('flash'), 1500); }
  }

    render();
  }
  setInterval(tick, 250);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
  window.addEventListener('focus', render);

  // [POMODORO V1.2] Lanceur déplaçable (Pointer Events souris + tactile, même clampPos que le
  // panneau). Distinction clic/glisser : mouvement > 4 px = drag (déplace, n'ouvre pas) ; sinon
  // clic = ouvre/ferme le panneau. touch-action:none → glisser tactile sans scroller la page.

    launch.addEventListener('pointercancel', end);

// Préférence de thème à TROIS états (Auto / Clair / Sombre). Le mode « Auto » suit

// le thème reste une préférence de NAVIGATEUR (globale), pas par token — un invité qui ouvre
// deux partages veut un seul thème ; les réglages propres à un accès (favoris) restent par token.
function themePref() {

    const v = localStorage.getItem('themePref');
    if (v === 'light' || v === 'dark' || v === 'auto') return v;
    // Migration douce : un invité qui avait déjà choisi son thème à la lune garde SON choix
    // (l'ancienne clé `theme` fait foi une fois) au lieu de repartir en Auto sans prévenir.
    const legacy = localStorage.getItem('theme');

function openGuestSettings(cfg) {
  cfg = cfg || {};
  _guestSettingsStyle();
  let dlg = document.getElementById('guest-settings-dialog');
  if (!dlg) {
    dlg = document.createElement('dialog');
    dlg.id = 'guest-settings-dialog';
    document.body.appendChild(dlg);
    dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });   // voile = sortir
  }
  const gear = document.getElementById('guest-settings-btn');
  if (gear) gear.classList.add('on');
  const section = (title) => {
    const s = el('div', { class: 'gs-sec' });
    s.appendChild(el('div', { class: 'gs-sec-h', text: title }));
    return s;
  };
  const draw = () => {
    dlg.innerHTML = '';
    dlg.appendChild(el('div', { class: 'gs-handle', attrs: { 'aria-hidden': 'true' } }));
    const head = el('div', { class: 'gs-head' });
    head.appendChild(el('h3', { text: 'Paramètres' }));
    dlg.appendChild(head);
    const body = el('div', { class: 'gs-body' });

    // (a) MON ACCÈS — se renvoyer son lien (route existante ; le serveur FORCE le destinataire).
    if (cfg.email) {
      const s = section('Mon accès');
      const row = el('div', { class: 'gs-row' });
      const send = el('button', { class: 'prio-btn', attrs: { type: 'button' } });
      send.appendChild(hdrIconAt('send', 14));
      send.appendChild(el('span', { text: cfg.email.label || 'Recevoir mon lien par e-mail' }));
      send.style.cssText = 'display:inline-flex;align-items:center;gap:0.35rem';
      const state = el('span', { class: 'gs-hint', attrs: { 'aria-live': 'polite', style: 'margin:0' } });
      let busy = false;
      send.addEventListener('click', async () => {
        if (busy || send.disabled) return;                    // pas d'envoi répété
        busy = true; send.disabled = true; send.style.opacity = '0.6';
        state.textContent = 'Envoi…';
        let res = null;
        try { res = await cfg.email.onSend(); } catch (e) { res = { ok: false, msg: 'Envoi impossible.' }; }
        busy = false;
        state.textContent = (res && res.msg) || (res && res.ok ? 'Envoyé.' : 'Envoi impossible.');
        if (res && res.ok) {
          notify((res && res.msg) || 'Envoyé ! Vérifie ta boîte mail (et les spams).');
          send.style.opacity = '0.6';                          // reste désactivé : un envoi suffit
        } else { send.disabled = false; send.style.opacity = ''; }
      });

      s.appendChild(el('div', { class: 'gs-hint', text: 'Le lien part à votre adresse enregistrée — rien à saisir.' }));
      body.appendChild(s);
    }

    // (b) AFFICHAGE — thème Auto / Clair / Sombre (la lune de l'en-tête a disparu).
    {
      const s = section('Affichage');
      const row = el('div', { class: 'gs-row' });
      const cur = themePref();
      [['auto', 'Auto'], ['light', 'Clair'], ['dark', 'Sombre']].forEach(([val, label]) => {
        const b = el('button', { class: 'prio-btn', text: label, attrs: { type: 'button', 'aria-pressed': cur === val ? 'true' : 'false' } });
        if (cur === val) { b.style.background = 'var(--accent)'; b.style.borderColor = 'var(--accent)'; b.style.color = '#10141a'; }
        b.addEventListener('click', () => { applyThemePref(val); draw(); });
        row.appendChild(b);
      });
      s.appendChild(row);
      s.appendChild(el('div', { class: 'gs-hint', text: 'Auto suit le réglage de votre appareil.' }));
      body.appendChild(s);
    }

    // (c) ⭐ FAVORIS — hub seulement (le share est mono-partage).

      const items = (typeof cfg.favorites.items === 'function')
        ? (cfg.favorites.items() || [])
        : (Array.isArray(cfg.favorites.items) ? cfg.favorites.items : []);
      const n = items.length;

      s.appendChild(el('div', { class: 'gs-hint', attrs: { style: 'margin:0 0 0.4rem' },
        text: n ? (n + ' dossier' + (n > 1 ? 's' : '') + ' épinglé' + (n > 1 ? 's' : '')) : 'Aucun dossier épinglé.' }));
      if (n) {
        const clear = dangerSoftBtn('Vider les favoris', async () => {
          if (!(await confirmPopin('Les ' + n + ' dossier(s) seront dépinglés. Les dossiers eux-mêmes ne sont pas touchés.', { title: 'Vider les favoris ?', okLabel: 'Vider' }))) return;
          if (typeof cfg.favorites.onClear === 'function') cfg.favorites.onClear();
          draw();

        s.appendChild(clear);
      }
      if (n) {
        const list = el('div', { class: 'gs-fav-list' });
        items.forEach((item) => {
          if (!item) return;
          const row = el('div', {
            class: 'cat-item',
            attrs: { title: (item.name || '') + ' — glisser pour réordonner', 'data-favkey': item.key || '' },
          });
          row.appendChild(el('span', { class: 'gs-fav-grip', text: '⋮⋮', attrs: { 'aria-hidden': 'true' } }));
          if (item.icon) row.appendChild(item.icon);
          row.appendChild(el('span', { class: 'cat-label', text: item.name || '', attrs: { title: item.name || '' } }));
          if (item.proj && item.proj.can_edit === false) row.appendChild(el('span', { class: 'ro', text: '👁' }));
          list.appendChild(row);
        });
        s.appendChild(list);
        if (typeof cfg.favorites.makeSortable === 'function' && n > 1) {
          cfg.favorites.makeSortable(list, (order) => {
            if (typeof cfg.favorites.onReorder === 'function') cfg.favorites.onReorder(order);
            draw();
          });
        }
        s.appendChild(el('div', { class: 'gs-hint', text: n > 1 ? 'Appui long puis glisser pour réordonner.' : 'Un seul favori, rien à trier.' }));
      }
      body.appendChild(s);
    }

    (cfg.sections || []).forEach(sec => {
      if (!sec || !sec.node) return;
      const s = section(sec.title || '');
      s.appendChild(sec.node);
      body.appendChild(s);
    });

    dlg.appendChild(body);
    const foot = el('div', { class: 'gs-foot' });
    const close = el('button', { text: 'Fermer', attrs: { type: 'button' } });
    close.addEventListener('click', () => dlg.close());
    foot.appendChild(close);
    lucioleize(close, 'luc-neutral');
    dlg.appendChild(foot);
  };
  draw();
  dlg.addEventListener('close', () => { const g = document.getElementById('guest-settings-btn'); if (g) g.classList.remove('on'); }, { once: true });
  if (!dlg.open) dlg.showModal();
}

function openGuestAdmin(cfg) {

  }
  function makeDraggable(handle) {
    let pid = null, sx = 0, sy = 0, ox = 0, oy = 0, dragging = false;
    handle.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button')) return;
      pid = e.pointerId; const r = panel.getBoundingClientRect(); ox = r.left; oy = r.top; sx = e.clientX; sy = e.clientY; dragging = true;
      panel.style.bottom = 'auto';
      try { handle.setPointerCapture(pid); } catch (_) {}
      e.preventDefault();
    });
    handle.addEventListener('pointermove', (e) => {
      if (!dragging || e.pointerId !== pid) return;
      e.preventDefault();
      const r = panel.getBoundingClientRect();
      const [x, y] = clampPos(ox + (e.clientX - sx), oy + (e.clientY - sy), r.width, r.height);
      panel.style.left = x + 'px'; panel.style.top = y + 'px';
    });
    const end = (e) => {
      if (e.pointerId !== pid || !dragging) return;
      dragging = false; const r = panel.getBoundingClientRect(); fxPos = { x: r.left, y: r.top };
      try { localStorage.setItem('fxPos', JSON.stringify(fxPos)); } catch (_) {}
    };
    handle.addEventListener('pointerup', end);
    handle.addEventListener('pointercancel', end);
  }

  let topEl, botEl, topSel, botSel, noteEl, histEl, histListEl, ghostSel, lastEdited = 'top';
  /* [FX-CONVERTER V2] Historique des conversions — 100 % LOCAL (`localStorage`, comme la position
     du panneau et la paire de devises) : zéro table, zéro route, export 27 inchangé, et rien
     n'est exposé à personne. Sur les pages invitées il vit dans le navigateur de l'invité, ce qui
     n'élargit aucun périmètre (invariant 5). Une entrée = { a, f, t, r, rate, d } — montant,
     devises, résultat, taux appliqué et date du taux au moment de la conversion. */
  const FX_HIST_MAX = 10;
  let hist = [];
  try { const h = JSON.parse(localStorage.getItem('fxHist') || '[]'); if (Array.isArray(h)) hist = h.slice(0, FX_HIST_MAX); } catch (e) {}
  const saveHist = () => { try { localStorage.setItem('fxHist', JSON.stringify(hist.slice(0, FX_HIST_MAX))); } catch (e) {} };
  function pushHist(a, f, t, r) {
    if (!isFinite(a) || !isFinite(r) || a === 0) return;
    const h0 = hist[0];
    // Dédoublonnage des répétitions IMMÉDIATES : re-taper le même montant sur la même paire ne
    // crée pas trois lignes. Une conversion différente intercalée « rouvre » la répétition.
    if (h0 && h0.a === a && h0.f === f && h0.t === t) return;
    hist.unshift({ a: a, f: f, t: t, r: r, rate: (rates && f !== t) ? (r / a) : 1, d: rateDate || null });
    hist = hist.slice(0, FX_HIST_MAX);
    saveHist(); renderHist();
  }
  function renderHist() {
    if (!histEl || !histListEl) return;
    histEl.hidden = hist.length === 0;
    histListEl.innerHTML = '';
    hist.forEach((h) => {
      const line = el('button', { class: 'fx-line', attrs: { type: 'button',
        title: 'Reprendre cette conversion' } });
      line.appendChild(el('b', { text: fxNum(h.a, h.f, 0) + ' ' + fxSym(h.f) }));
      line.appendChild(document.createTextNode(' → '));
      line.appendChild(el('b', { text: fxNum(h.r, h.t) + ' ' + fxSym(h.t) }));
      if (h.d) line.appendChild(document.createTextNode(' · taux du ' + fxDateFR(h.d)));
      // Cliquer une ligne re-remplit montant ET les deux devises, puis recalcule.
      line.addEventListener('click', () => {
        pair = { from: h.f, to: h.t }; savePair();
        fillSelect(topSel, pair.from); fillSelect(botSel, pair.to);
        topEl.value = String(h.a); lastEdited = 'top'; recompute();
        topEl.focus();
      });
      histListEl.appendChild(line);
    });
  }
  function ccyOptions() {
    if (!rates) return TOP.slice();
    const all = Object.keys(rates);
    const rest = all.filter(c => TOP.indexOf(c) < 0).sort();
    return TOP.filter(c => all.indexOf(c) >= 0).concat(rest);
  }
  function fillSelect(sel, val) {
    sel.innerHTML = '';
    ccyOptions().forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; if (c === val) o.selected = true; sel.appendChild(o); });
    sel.value = val;
    syncGhost();
  }
  // [FX-SWAP-ALIGN] Le fantôme reçoit les MÊMES options que les vrais sélecteurs : un `<select>`
  // se dimensionne sur son option la plus large, donc c'est la seule façon d'en garantir la
  // largeur EXACTE. Avec une option unique il était 4 px trop étroit et l'axe dérivait d'autant.
  function syncGhost() {
    if (!ghostSel || !topSel) return;
    ghostSel.innerHTML = topSel.innerHTML;
  }
  function fmt(v, ccy) { return (v == null || !isFinite(v)) ? '' : v.toFixed(decimals(ccy)); }
  function recompute() {
    if (!rates) return;
    if (lastEdited === 'bot') {
      const a = parseFloat(botEl.value);
      const r = convert(a, pair.to, pair.from);
      topEl.value = fmt(r, pair.from);
    } else {
      const a = parseFloat(topEl.value);
      const r = convert(a, pair.from, pair.to);
      botEl.value = fmt(r, pair.to);
    }
  }
  function buildPanel() {
    panel.innerHTML = '';
    const head = el('div', { class: 'fx-head' });
    head.appendChild(el('span', { class: 'fx-grip', text: '¥€ Convertisseur' }));
    head.appendChild(el('button', { class: 'fx-x', text: '✕', attrs: { type: 'button', title: 'Masquer le convertisseur' }, on: { click: () => setHidden(true) } }));
    panel.appendChild(head);
    makeDraggable(head);

    /* [FX-COPY-V4] La copie est descendue au PIED (elle cassait la ligne entre montant et devise) :
       les rangées redeviennent naturellement `[montant][devise]`, symétriques d'elles-mêmes —
       plus besoin des cales invisibles de [FX-LAYOUT-V3], supprimées. */
    const rowT = el('div', { class: 'fx-row' });
    topEl = el('input', { class: 'fx-amount', attrs: { type: 'number', inputmode: 'decimal', step: 'any', 'aria-label': 'Montant à convertir' } });
    topSel = el('select', { class: 'fx-ccy', attrs: { 'aria-label': 'Devise source' } });
    rowT.appendChild(topEl); rowT.appendChild(topSel); panel.appendChild(rowT);

    const sw = el('div', { class: 'fx-swap' });
    const swCol = el('div', { class: 'fx-swap-col' });
    swCol.appendChild(el('button', { text: '↔', attrs: { type: 'button', title: 'Inverser les devises' }, on: { click: () => {
      pair = { from: pair.to, to: pair.from }; savePair();
      fillSelect(topSel, pair.from); fillSelect(botSel, pair.to);
      lastEdited = 'top'; recompute();
    } } }));
    sw.appendChild(swCol);
    // [FX-SWAP-ALIGN] fantôme d'alignement : même gabarit que les vrais sélecteurs, invisible mais
    // occupant sa place, donc la colonne souple ci-dessus tombe pile sur celle des montants. Hors
    // du parcours clavier et de l'arbre d'accessibilité — il ne porte aucune information.
    ghostSel = el('select', { class: 'fx-ccy fx-ghost', attrs: { 'aria-hidden': 'true', tabindex: '-1' } });
    sw.appendChild(ghostSel);
    panel.appendChild(sw);

    const rowB = el('div', { class: 'fx-row' });
    botEl = el('input', { class: 'fx-amount', attrs: { type: 'number', inputmode: 'decimal', step: 'any', 'aria-label': 'Montant converti' } });
    botSel = el('select', { class: 'fx-ccy', attrs: { 'aria-label': 'Devise cible' } });
    rowB.appendChild(botEl); rowB.appendChild(botSel); panel.appendChild(rowB);

    /* [FX-LAYOUT-V3] Ligne de PIED : la mention du taux (muted, à gauche) et « Garder » (à droite)
       partagent la même ligne — « Garder » ne flotte plus seul et la composition ferme le panneau.
       « Garder » reste le SEUL geste qui alimente l'historique (avec Entrée), en Luciole NEUTRE :
       le convertisseur n'a pas d'action principale, et le signet dit « je mets de côté ». */
    const foot = el('div', { class: 'fx-foot' });
    noteEl = el('div', { class: 'fx-note' });
    foot.appendChild(noteEl);
    // Fabrique commune aux deux actions jumelles du pied : même gabarit Luciole neutre, même
    // taille d'icône trait, même graisse — elles se lisent comme une paire.
    const footBtn = (icon, label, title, onClick) => {
      const b = el('button', { attrs: { type: 'button', title: title } });
      b.appendChild(hdrIconAt(icon, 13));
      b.appendChild(el('span', { text: label }));
      if (onClick) b.addEventListener('click', onClick);
      return lucioleize(b, 'luc-neutral');
    };
    /* [FX-COPY-V4] « Copier » rejoint « Garder » au pied : entre le montant et la devise, il
       cassait la ligne. Copie la VALEUR NUE (sans devise ni espace) — c'est ce qu'on recolle dans
       une note ou une calculette. Feedback bref sans pop-in : `lucioleize` ayant enveloppé le
       contenu dans `.mab-btxt`, on remplace ce contenu 1,2 s puis on le restaure tel quel. */
    const copyBtn = footBtn('clipboard', 'Copier', 'Copier le montant converti');
    const copyTxt = copyBtn.querySelector('.mab-btxt');
    copyBtn.addEventListener('click', async () => {
      const v = botEl.value;
      if (!v) return;
      let ok = true;
      try { await navigator.clipboard.writeText(v); }
      catch (e) { ok = false; try { botEl.select(); ok = document.execCommand('copy'); } catch (e2) { ok = false; } }
      const prev = copyTxt.innerHTML;
      copyTxt.textContent = ok ? '✓ Copié' : '✕ Échec';
      copyBtn.classList.toggle('ok', ok);
      setTimeout(() => { copyTxt.innerHTML = prev; copyBtn.classList.remove('ok'); }, 1200);
    });
    const actions = el('div', { class: 'fx-actions' });
    actions.appendChild(copyBtn);
    actions.appendChild(footBtn('bookmark', 'Garder', 'Garder cette conversion dans l\'historique', () => record()));
    foot.appendChild(actions);
    panel.appendChild(foot);

    histEl = el('div', { class: 'fx-hist', attrs: { hidden: '' } });
    { const hh = el('div', { class: 'fx-hist-head' });
      hh.appendChild(el('span', { text: 'Dernières conversions' }));
      hh.appendChild(el('button', { class: 'fx-clear', text: 'vider',
        attrs: { type: 'button', title: 'Vider l\'historique' },
        on: { click: () => { hist = []; saveHist(); renderHist(); } } }));
      histEl.appendChild(hh); }
    histListEl = el('div');
    histEl.appendChild(histListEl);
    panel.appendChild(histEl);

    fillSelect(topSel, pair.from); fillSelect(botSel, pair.to);
    topEl.addEventListener('input', () => { lastEdited = 'top'; recompute(); });
    botEl.addEventListener('input', () => { lastEdited = 'bot'; recompute(); });
    /* [FX-CONVERTER V2 — correctif] L'historique ne s'alimente QUE sur geste explicite.
       Version précédente : enregistrement sur `change`. Insuffisant — un input `number` émet
       `change` à chaque pas de valeur, donc taper « 102 » écrivait « 1 », « 1,0 », « 1,02 ».
       Aucun réglage de debounce ne rattrape ça proprement : c'est le déclencheur qui était
       mauvais, pas sa fréquence. Désormais : bouton « Garder », ou Entrée dans un champ montant
       (même geste au clavier). Les lignes parasites déjà stockées partent avec « vider ». */
    const record = () => {
      if (!rates) return;
      const a = parseFloat(topEl.value), r = parseFloat(botEl.value);
      if (isFinite(a) && isFinite(r)) pushHist(a, pair.from, pair.to, r);
    };
    const onEnter = (e) => { if (e.key === 'Enter') { e.preventDefault(); record(); } };
    topEl.addEventListener('keydown', onEnter);
    botEl.addEventListener('keydown', onEnter);
    topSel.addEventListener('change', () => { pair.from = topSel.value; savePair(); lastEdited = (lastEdited === 'top') ? 'top' : 'bot'; recompute(); });
    botSel.addEventListener('change', () => { pair.to = botSel.value; savePair(); lastEdited = (lastEdited === 'bot') ? 'bot' : 'top'; recompute(); });
    applyNote();
    renderHist();
    if (topEl.value === '' && botEl.value === '') { topEl.value = '1'; lastEdited = 'top'; }
    recompute();
  }
  function todayISO() { try { return new Date().toISOString().slice(0, 10); } catch (e) { return null; } }
  /* [FX-CONVERTER V2] Le seuil passe de « pas aujourd'hui » à « plus de 48 h ». La BCE ne publie
     que les jours ouvrés : avec l'ancien test, la mention était orange tous les week-ends et
     chaque matin avant publication — donc orange en permanence, donc ne signalant rien. 48 h
     laisse passer un week-end normal et n'alerte que sur un vrai décrochage (hors-ligne
     prolongé → conversion approximative). */
  const STALE_MS = 48 * 60 * 60 * 1000;
  function rateIsStale() {
    if (!rateDate) return false;
    const t = Date.parse(rateDate + 'T00:00:00Z');
    return isFinite(t) && (Date.now() - t) > STALE_MS;
  }
  function applyNote() {
    if (!noteEl) return;
    if (!rates) { noteEl.textContent = '⚠ Taux indisponibles'; noteEl.classList.add('stale'); return; }
    noteEl.textContent = 'Taux BCE du ' + (rateDate ? fxDateFR(rateDate) : '?');
    noteEl.classList.toggle('stale', rateIsStale());
  }
  // « 2026-08-05 » → « 5 août » (l'année n'apporte rien sur un taux du jour).
  function fxDateFR(iso) {
    try {
      const d = new Date(iso + 'T00:00:00Z');
      return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', timeZone: 'UTC' });
    } catch (e) { return iso; }
  }
  const FX_SYM = { EUR: '€', JPY: '¥', USD: '$', GBP: '£' };
  const fxSym = (c) => FX_SYM[c] || c;
  // `min = 0` sur le montant SAISI (« 5 000 JPY », pas « 5 000,00 JPY » — la ligne d'historique
  // doit tenir sans être tronquée) ; `min = decimals` sur le RÉSULTAT, où « 29,10 € » se lit
  // comme une somme et « 29,1 € » non.
  const fxNum = (v, ccy, min) => {
    try { return v.toLocaleString('fr-FR', { minimumFractionDigits: (min == null ? decimals(ccy) : min), maximumFractionDigits: decimals(ccy) }); }
    catch (e) { return String(fmt(v, ccy)); }
  };

  async function loadRates() {
    try {
      const r = await fetch(FETCH_URL, { headers: { 'Accept': 'application/json' } });
      const d = await r.json();
      if (d && d.rates && typeof d.rates === 'object') { rates = d.rates; rateDate = d.date || null; }
      else { rates = null; rateDate = null; }
    } catch (e) { rates = null; rateDate = null; }
    if (rates) { fillSelect(topSel, pair.from); fillSelect(botSel, pair.to); }
    applyNote(); recompute();
  }

  // Lanceur déplaçable (souris + tactile), distinction clic/glisser (>4px = drag).
  (function () {
    let pid = null, sx = 0, sy = 0, ox = 0, oy = 0, dragging = false;
    launch.addEventListener('pointerdown', (e) => {
      pid = e.pointerId; const r = launch.getBoundingClientRect(); ox = r.left; oy = r.top; sx = e.clientX; sy = e.clientY; dragging = false;
      try { launch.setPointerCapture(pid); } catch (_) {}
    });
    launch.addEventListener('pointermove', (e) => {
      if (e.pointerId !== pid) return;
      if (!dragging) { if (Math.abs(e.clientX - sx) > 4 || Math.abs(e.clientY - sy) > 4) { dragging = true; launch.style.bottom = 'auto'; } else return; }
      e.preventDefault();
      const r = launch.getBoundingClientRect();
      const [x, y] = clampPos(ox + (e.clientX - sx), oy + (e.clientY - sy), r.width, r.height);
      launch.style.left = x + 'px'; launch.style.top = y + 'px';
    });
    const end = (e) => {
      if (e.pointerId !== pid) return;
      if (dragging) {
        const r = launch.getBoundingClientRect(); fxLaunchPos = { x: r.left, y: r.top };
        try { localStorage.setItem('fxLaunchPos', JSON.stringify(fxLaunchPos)); } catch (_) {}
        launchSuppressClick = Date.now() + 300;
        if (!panel.hidden) applyPanelPos();
      }
      pid = null; dragging = false;
    };
    launch.addEventListener('pointerup', end);
    launch.addEventListener('pointercancel', end);
  })();
  launch.addEventListener('click', () => {
    if (Date.now() < launchSuppressClick) return;
    const open = panel.hidden; panel.hidden = !open; if (open) { applyPanelPos(); }
  });
  window.addEventListener('resize', () => { applyLaunchPos(); if (!panel.hidden) applyPanelPos(); });
  buildPanel();
  applyLaunchPos();
  applyVisibility();
  loadRates();
}

// [QUICK-MEMO] Options de dossier indentées (arbre, tokens) pour le sélecteur du widget. Chaque
// projet = {id, name, emoji, parent_id, position}. Renvoie [{value, label}] SANS l'Inbox (ajoutée
// en tête par le widget). Les projets dont le parent est hors de la liste (périmètre invité filtré)
// sont traités comme racine. Anti-cycle par `seen`.
function qmFolderOptions(projects) {
  const list = Array.isArray(projects) ? projects.slice() : [];
  const byParent = {};
  list.forEach(p => { const k = p.parent_id || 0; (byParent[k] = byParent[k] || []).push(p); });
  Object.keys(byParent).forEach(k => byParent[k].sort((x, y) => (x.position || 0) - (y.position || 0) || (x.id - y.id)));
  const out = [], seen = new Set();
  const label = (p, depth) => (depth > 0 ? '  '.repeat(depth) + '↳ ' : '')
    + ((p.emoji || '').trim() ? (p.emoji || '').trim() + ' ' : '') + (p.name || '(sans nom)');
  const walk = (pid, depth) => {
    (byParent[pid] || []).forEach(p => {
      if (seen.has(p.id)) return; seen.add(p.id);
      out.push({ value: String(p.id), label: label(p, depth) });
      walk(p.id, depth + 1);
    });
  };
  walk(0, 0);
  list.forEach(p => { if (!seen.has(p.id)) { seen.add(p.id); out.push({ value: String(p.id), label: label(p, 0) }); } });
  return out;
}

// [QUICK-MEMO] Widget flottant de capture rapide de mémo (gabarit Pomodoro/FX, invariant 9).
// cfg = { canUse():bool, folders():[{value,label}], defaultFolder():value, submit({title,content,folder})->bool }.
// Le widget vit HORS des zones re-rendues (comme Pomodoro/FX) → la saisie survit au poll 15 s.
function initQuickMemo(cfg) {
  cfg = cfg || {};
  if (typeof document === 'undefined' || !document.body || document.getElementById('qm-launch')) return;
  if (cfg.canUse && !cfg.canUse()) return;  // invité sans droit de création → pas de widget

  if (!document.getElementById('qm-style')) {
    const st = document.createElement('style'); st.id = 'qm-style';
    st.textContent = '#qm-launch{position:fixed;left:1rem;bottom:7rem;z-index:3500;width:2.6rem;height:2.6rem;border-radius:50%;'
      + 'border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:1.1rem;cursor:pointer;'
      + 'box-shadow:0 4px 16px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;touch-action:none}'
      + '#qm-panel{position:fixed;left:1rem;bottom:9.9rem;z-index:3500;width:17rem;max-width:calc(100vw - 2rem);'
      + 'background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:0.8rem;color:var(--text);'
      + 'box-shadow:0 8px 30px rgba(0,0,0,0.4);font-size:0.85rem}'
      + '#qm-panel[hidden]{display:none}'
      + '#qm-launch[hidden],#qm-reshow[hidden]{display:none}'
      + '#qm-reshow{position:fixed;left:0;bottom:7.2rem;z-index:3500;width:1.5rem;height:1.9rem;'
      + 'border:1px solid var(--border);border-left:none;border-radius:0 8px 8px 0;background:var(--panel);'
      + 'color:var(--muted);font-size:0.9rem;cursor:pointer;opacity:0.6;display:flex;align-items:center;justify-content:center}'
      + '#qm-reshow:hover{opacity:1;color:var(--text)}'
      + '.qm-head{display:flex;align-items:center;gap:0.4rem;margin:-0.2rem -0.2rem 0.5rem;padding:0.15rem 0.2rem;'
      + 'cursor:move;touch-action:none;user-select:none;-webkit-user-select:none}'
      + '.qm-grip{flex:1;font-weight:600;font-size:0.8rem;color:var(--muted)}'
      + '.qm-x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.9rem;line-height:1;padding:0.1rem 0.3rem;border-radius:5px}'
      + '.qm-x:hover{color:var(--text);background:var(--panel-2)}'
      + '.qm-title,.qm-text,.qm-folder{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;'
      + 'color:var(--text);font:inherit;font-size:0.85rem;padding:0.4rem 0.5rem;margin-bottom:0.45rem}'
      + '.qm-text{resize:vertical;min-height:3.4rem}'
      + '.qm-title:focus,.qm-text:focus,.qm-folder:focus{outline:none;border-color:var(--accent)}'
      /* [BUTTONS-AUDIT V2] « Créer » quitte l'aplat accent plein pour la teinte LÉGÈRE du gabarit
         `.luc-primary`, posé par `lucioleize` à la construction du panneau. C'est le gabarit qui
         porte fond, bordure, couleur, graisse et survol — sur les 3 pages et les 2 thèmes. Ne
         restent ici que la mise en page propre au widget (bouton pleine largeur) et l'état
         désactivé : `.mab-btn:hover` soulève le bouton de 2 px, ce qui n'a aucun sens pendant
         l'envoi, d'où la neutralisation explicite du lift et de l'ombre. */
      + '.qm-go{width:100%}'
      + '.qm-go:disabled{opacity:0.5;cursor:default}'
      + '.qm-go:disabled:hover{transform:none;box-shadow:none}'
      /* [QUICK-MEMO V2] rangée médias — vocal + photos dans le MÊME mémo. Zéro couleur en dur :
         tout passe par les variables (invariant 9), et les deux boutons sont des Luciole neutres
         posés par `lucioleize` (donc fond/bordure/survol viennent du gabarit `.mab-btn`, comme
         « Créer »). `flex:1` pour qu'ils se partagent la largeur du panneau à parts égales. */
      + '.qm-media{display:flex;gap:0.4rem;margin-bottom:0.45rem}'
      + '.qm-media .mab-btn{flex:1;min-height:34px;padding:0.32rem 0.6rem;font-size:0.8rem}'
      + '.qm-media .mab-btxt{gap:0.3rem}'
      /* ⚠️ `display:flex` de l'auteur BAT le `display:none` que l'attribut [hidden] tient de la
         feuille UA — sans ces règles, les panneaux d'état du vocal s'affichent tous en même temps.
         Même parade que `#qm-panel[hidden]` plus haut. */
      + '.qm-media[hidden],.qm-shots[hidden],.qm-rec[hidden],.qm-clips[hidden],'
      + '.qm-media .mab-btn[hidden]{display:none}'
      /* vignettes photo 44 px (cible tactile du ✕ volontairement petite : geste secondaire,
         la cible principale reste la vignette elle-même) */
      + '.qm-shots{display:flex;flex-wrap:wrap;gap:0.35rem;margin-bottom:0.45rem}'
      + '.qm-shot{position:relative;width:44px;height:44px;border-radius:7px;overflow:hidden;'
      + 'border:1px solid var(--border);background:var(--panel-2)}'

    folderEl = el('select', { class: 'qm-folder', attrs: { 'aria-label': 'Dossier de destination' } });
    // [BUTTONS-AUDIT V2] gabarit Luciole (`lucioleize`, pas une classe dédiée comme `.pomo-start`) :
    // ce bouton ne réécrit JAMAIS son libellé — seul `disabled` bascule pendant l'envoi — la lueur
    // survit donc au cycle de soumission. `buildPanel()` reconstruit le panneau, chaque bouton neuf
    // repasse par ici, et `lucioleize` est idempotent de toute façon.
    goEl = lucioleize(el('button', { class: 'qm-go', text: 'Créer', attrs: { type: 'button' } }), 'luc-primary');
    panel.appendChild(titleEl); panel.appendChild(textEl);
    buildMediaRow();
    panel.appendChild(folderEl); panel.appendChild(goEl);
    fillFolders();
    // Entrée dans le titre = créer ; Échap = replier (pas de raccourci global clavier — [CMD-K] réservé).
    titleEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); submit(); } else if (e.key === 'Escape') { panel.hidden = true; } });
    textEl.addEventListener('keydown', (e) => { if (e.key === 'Escape') panel.hidden = true; });
    folderEl.addEventListener('keydown', (e) => { if (e.key === 'Escape') panel.hidden = true; });
    // « Créer » n'est actif que si le mémo porte QUELQUE CHOSE (titre, texte, vocal ou photo).
    titleEl.addEventListener('input', refreshGo);
    textEl.addEventListener('input', refreshGo);
    goEl.addEventListener('click', submit);
    refreshGo();
  }

  (function () {  // lanceur déplaçable (souris + tactile), distinction clic/glisser (>4px = drag)
    let pid = null, sx = 0, sy = 0, ox = 0, oy = 0, dragging = false;
    launch.addEventListener('pointerdown', (e) => { pid = e.pointerId; const r = launch.getBoundingClientRect(); ox = r.left; oy = r.top; sx = e.clientX; sy = e.clientY; dragging = false; try { launch.setPointerCapture(pid); } catch (_) {} });
    launch.addEventListener('pointermove', (e) => {
      if (e.pointerId !== pid) return;
      if (!dragging) { if (Math.abs(e.clientX - sx) > 4 || Math.abs(e.clientY - sy) > 4) { dragging = true; launch.style.bottom = 'auto'; } else return; }
      e.preventDefault();
      const r = launch.getBoundingClientRect();
      const [x, y] = clampPos(ox + (e.clientX - sx), oy + (e.clientY - sy), r.width, r.height);
      launch.style.left = x + 'px'; launch.style.top = y + 'px';
    });
    const end = (e) => {
      if (e.pointerId !== pid) return;
      if (dragging) {
        const r = launch.getBoundingClientRect(); qmLaunchPos = { x: r.left, y: r.top };
        try { localStorage.setItem('qmLaunchPos', JSON.stringify(qmLaunchPos)); } catch (_) {}
        launchSuppressClick = Date.now() + 300;
        if (!panel.hidden) applyPanelPos();
      }
      pid = null; dragging = false;
    };
    launch.addEventListener('pointerup', end);
    launch.addEventListener('pointercancel', end);
  })();
  launch.addEventListener('click', () => {
    if (Date.now() < launchSuppressClick) return;
    const open = panel.hidden; panel.hidden = !open;
    // À l'ouverture on ré-évalue l'état des médias : `voiceAvailable()` et surtout le mode hors
    // ligne peuvent avoir changé depuis la construction du panneau (bascule réseau à chaud).
    if (open) { fillFolders(); setVoiceState('idle'); applyPanelPos(); if (titleEl) titleEl.focus(); }
  });
  window.addEventListener('resize', () => { applyLaunchPos(); if (!panel.hidden) applyPanelPos(); });
  buildPanel();
  applyLaunchPos();
  applyVisibility();
}

function hdrIcon(name) {

  const svg = document.createElementNS(NS, 'svg');

/* [VOTES-FRAME] cadre légendé « 🗳 Votes ». Le caller appende ses chips dans `frame.body`

   devient une ligne cliquable « 🗳 Votes · N » ; déplier restaure l'encart ACTUEL à l'identique
   (aucun accès perdu — consigne historique [VOTES-FRAME]). État persisté par contexte via

function voteFrame(cfg) {

  // zéro réécriture des 3 pages (la légende, elle, a déjà été posée sur le cadre).

// [VOTES-FRAME] nb de voix total d'un vote nommé = somme des voix de ses options (front, sans route).
function voteNamedCount(v) { return (((v && v.options) || []).reduce((s, o) => s + (Number(o && o.vote_count) || 0), 0)); }
/* ===== Helpers Luciole (style : docs/design/LUCIOLE-boutons.md) =====
   [GUEST-ADD-BAR] remontés d'index.html vers le partial (fonctions PURES, sans état ni
   dépendance à `state`/`DATA` — règle du partial, invariant 6/ADR-001) : les 3 pages en ont
   désormais besoin (owner, share, hub). `hdrMixHex` est dédoublonné au passage : `mabMixHex`
   est la seule interpolation hex. Le CSS, lui, reste par page (comme d'habitude). */
function mabMixHex(a, b, t) {
  const pa = a.match(/[0-9a-f]{2}/gi), pb = b.match(/[0-9a-f]{2}/gi);
  if (!pa || !pb || pa.length < 3 || pb.length < 3) return a;
  return '#' + pa.slice(0, 3).map((v, i) =>
    Math.round(parseInt(v, 16) + (parseInt(pb[i], 16) - parseInt(v, 16)) * t)
      .toString(16).padStart(2, '0')).join('');
}
// Lueur qui suit la souris (lissage rAF 0.11, boucle active SEULEMENT en survol — zéro
// coût au repos), teinte caméléon selon x, paire choisie PAR THÈME à chaque pointerenter
// (sombre : accent → accent éclairci ; clair : bleu profond #1e88e5 → accent, le pastel
// se noyait dans le blanc). Zéro lib (invariant 6) ; tactile = jamais déclenché.
function attachLuciole(btn, glow) {
  let x = 0, y = 0, tx = 0, ty = 0, hovering = false, g1 = '#4fc3f7', g2 = '#a5e2fb';
  const loop = () => {
    if (!hovering) return;
    x += (tx - x) * 0.11; y += (ty - y) * 0.11;
    glow.style.left = x + 'px'; glow.style.top = y + 'px';
    requestAnimationFrame(loop);
  };
  btn.addEventListener('pointerenter', e => {
    const acc = (getComputedStyle(document.documentElement).getPropertyValue('--accent') || '').trim();
    if (document.documentElement.dataset.theme === 'light') {
      g1 = '#1e88e5';
      g2 = mabMixHex(g1, /^#[0-9a-f]{6}$/i.test(acc) ? acc : '#4fc3f7', 0.7);
    } else if (/^#[0-9a-f]{6}$/i.test(acc)) {
      g1 = acc; g2 = mabMixHex(acc, '#ffffff', 0.35);
    }
    const r = btn.getBoundingClientRect();
    x = tx = e.clientX - r.left; y = ty = e.clientY - r.top;
    hovering = true; loop();
  });
  btn.addEventListener('pointermove', e => {
    const r = btn.getBoundingClientRect();
    tx = e.clientX - r.left; ty = e.clientY - r.top;
    glow.style.background = mabMixHex(g1, g2, Math.min(1, Math.max(0, tx / r.width)));
  });
  btn.addEventListener('pointerleave', () => { hovering = false; });
}
// Construit un bouton Luciole neuf (barres d'ajout).
function mabGlowButton(cls, label, attrs) {
  const btn = el('button', { class: cls, attrs: Object.assign({ type: 'button' }, attrs || {}) });
  const glow = el('span', { class: 'mab-glow' });
  btn.append(glow, el('span', { class: 'mab-btxt', text: label }));
  attachLuciole(btn, glow);
  return btn;
}
/* ===== [DANGER-SOFT] le danger MURMURE au repos =====
   Doctrine (docs/design/LUCIOLE-boutons.md, § Danger — 31 juil. 2026) : un bouton destructif ne
   prend JAMAIS l'accent ni l'aplat au repos. Au repos il est monochrome (fond `--panel`, bordure
   `--border`, libellé `--muted`, icône Tabler `trash` en TRAIT — plus aucun emoji 🗑) ; il ROUGIT
   au survol ET au `:focus-visible` (bordure + texte + icône `--red`/`--danger`, fond `--panel-2`).
   C'est le LIBELLÉ qui porte la gravité (« Vider la corbeille », « Supprimer définitivement »),
   plus la couleur permanente — et `confirmPopin` reste OBLIGATOIRE avant toute exécution.
   Exception assumée : le bouton de CONFIRMATION de la pop-in (`#confirm-yes`) garde son rouge
   plein — c'est la dernière marche, l'intention y est déjà déclarée. */
function _dangerSoftStyle() {

  const st = document.createElement('style'); st.id = 'danger-soft-style';
  st.textContent = '.danger-soft{display:inline-flex;align-items:center;gap:0.35rem;background:var(--panel);'
    + 'border:1px solid var(--border);color:var(--muted);border-radius:9px;padding:0.35rem 0.7rem;'
    + 'font:inherit;font-size:0.85rem;line-height:1;cursor:pointer}'
    + '.danger-soft:hover,.danger-soft:focus-visible{background:var(--panel-2);'
    + 'border-color:var(--red,var(--danger));color:var(--red,var(--danger))}'
    + '.danger-soft:focus-visible{outline:2px solid var(--red,var(--danger));outline-offset:1px}'
    // entrées de menu ⋯ : même doctrine, sans le cadre (une ligne de menu reste une ligne)
    + '.card-menu .danger-item,.danger-item{display:flex;align-items:center;gap:0.4rem;color:var(--muted)}'
    + '.card-menu .danger-item:hover,.card-menu .danger-item:focus-visible,'
    + '.danger-item:hover,.danger-item:focus-visible{color:var(--red,var(--danger))}';
  document.head.appendChild(st);
}
// Bouton destructif NEUF : icône trait + libellé explicite, danger discret.
function dangerSoftBtn(label, onClick, opts) {
  opts = opts || {};
  _dangerSoftStyle();
  const b = el('button', { class: 'danger-soft' + (opts.class ? ' ' + opts.class : ''),
    attrs: { type: 'button', title: opts.title || label } });
  b.appendChild(hdrIconAt(opts.icon || 'trash', 15));
  b.appendChild(el('span', { text: label }));

}
// Convertit un bouton EXISTANT (markup statique, entrée de menu ⋯) : retire l'emoji de tête,
// pose l'icône trait et la bonne classe. Idempotent. `mode` = 'item' → ligne de menu (pas de cadre).
function dangerSoftize(btn, icon, mode) {
  if (!btn || btn.dataset.dangerSoft) return btn;
  _dangerSoftStyle();
  const label = String(btn.textContent || '').replace(/^[^\p{L}\p{N}]+/u, '').trim();
  btn.textContent = '';
  btn.classList.remove('danger', 'btn-soft');
  btn.classList.add(mode === 'item' ? 'danger-item' : 'danger-soft');
  btn.appendChild(hdrIconAt(icon || 'trash', 15));
  if (label) btn.appendChild(el('span', { text: label }));
  btn.dataset.dangerSoft = '1';
  return btn;
}
// [LUCIOLE-POPIN] convertit un bouton EXISTANT au style Luciole : idempotent, enveloppe
// le contenu dans .mab-btxt (net au-dessus de la lueur), retire l'ancien `.primary`
// (aplat accent plein — remplacé par la variante .luc-primary teintée).
function lucioleize(btn, variant) {
  if (!btn || btn.querySelector('.mab-glow')) return btn;
  btn.classList.remove('primary');
  btn.classList.add('mab-btn');
  if (variant) btn.classList.add(variant);
  const lbl = el('span', { class: 'mab-btxt' });
  while (btn.firstChild) lbl.appendChild(btn.firstChild);
  const glow = el('span', { class: 'mab-glow' });
  btn.append(glow, lbl);
  attachLuciole(btn, glow);
  return btn;
}

/* [GUEST-ADD-BAR] Barre d'ajout de mémo INVITÉE, alignée sur la barre owner [ADD-BAR-V2] :
   rangée 1 (titre + « Détails » ⇄ « Réduire » + « Ajouter », les deux en Luciole) et rangée 2
   repliable (Quand = due_date → due_end + heure, Priorité en chips, Récurrence, Dossier).
   Helper PUR : il ne connaît ni le réseau ni `DATA` — la page fournit les dossiers déjà scopés,
   les priorités, les droits résolus, et exécute l'écriture dans `onCreate` (POST /share/<t>/memos
   puis PUT scopé pour les métadonnées — zéro route nouvelle, le serveur revalide, invariant 5).
   cfg = { storageKey, placeholder, folders:[{value,label,selected}], showFolder, priorities,
           allowMeta, onCreate({title, projectValue, meta}) → bool }.
   Gardes client v24/v18 (jamais de 400) : la fin exige une date, la fin est exclusive de la
   récurrence, vider la date vide la fin ET l'heure. */
function guestMemoAddBar(cfg) {
  const bar = el('div', { class: 'mab-bar' });
  const row1 = el('div', { class: 'mab-row1' });
  const txt = el('input', { attrs: { type: 'text', placeholder: cfg.placeholder || '+ Titre du nouveau mémo…' } });
  const detailsBtn = cfg.allowMeta
    ? mabGlowButton('mab-btn mab-details-btn', 'Détails', { title: 'Afficher/masquer date, priorité, récurrence, dossier' })
    : null;
  const addBtn = mabGlowButton('mab-btn mab-add', 'Ajouter');
  row1.appendChild(txt);
  if (detailsBtn) row1.appendChild(detailsBtn);
  row1.appendChild(addBtn);

  const details = el('div', { class: 'mab-row2' });
  const whenGroup = el('div', { class: 'mab-group' });
  whenGroup.appendChild(el('span', { class: 'mab-lbl', text: 'Quand' }));
  const dateIn = el('input', { attrs: { type: 'date', title: 'Date de début (optionnelle)' } });
  const endIn = el('input', { attrs: { type: 'date', title: 'Date de fin (plage, optionnelle)' } });
  const timeIn = el('input', { attrs: { type: 'time', title: 'Heure (optionnelle)' } });
  whenGroup.append(dateIn, el('span', { class: 'mab-arrow', text: '→' }), endIn, timeIn);
  const prioGroup = el('div', { class: 'mab-group' });
  prioGroup.appendChild(el('span', { class: 'mab-lbl', text: 'Priorité' }));
  const prioWrap = el('div', { class: 'mab-prios' });
  let prio = 0;
  const renderPrios = () => {
    prioWrap.innerHTML = '';
    const mk = (id, label, color) => {
      const on = prio === id;
      const style = on
        ? (color ? `background:${color};border-color:${color};color:${textOn(color)}` : 'background:var(--accent);border-color:var(--accent);color:#10141a')
        : '';
      const b = el('button', { class: 'prio-btn', text: label, attrs: { type: 'button', style } });
      b.addEventListener('click', () => { prio = id; renderPrios(); });
      return b;
    };
    prioWrap.appendChild(mk(0, 'Aucune', null));
    (cfg.priorities || []).forEach(p => prioWrap.appendChild(mk(p.id, p.name, p.color)));
  };
  renderPrios();
  prioGroup.appendChild(prioWrap);
  const recurGroup = el('div', { class: 'mab-group' });
  recurGroup.appendChild(el('span', { class: 'mab-lbl', text: 'Récurrence' }));
  const recurSel = el('select', { attrs: { title: 'Récurrence (replanifié automatiquement quand coché)' } });
  [['', '🔁 Récurrence'], ['daily', 'Quotidienne'], ['weekly', 'Hebdomadaire'],
   ['monthly', 'Mensuelle'], ['quarterly', 'Trimestrielle'], ['yearly', 'Annuelle']]
    .forEach(([v, label]) => recurSel.appendChild(el('option', { attrs: { value: v }, text: label })));
  recurGroup.appendChild(recurSel);
  const projGroup = el('div', { class: 'mab-group' });
  projGroup.appendChild(el('span', { class: 'mab-lbl', text: 'Dossier' }));
  const projSel = el('select', { attrs: { title: 'Dossier de destination' } });
  (cfg.folders || []).forEach(f => {
    const o = el('option', { attrs: { value: String(f.value) }, text: f.label });
    if (f.selected) o.selected = true;
    projSel.appendChild(o);
  });
  projGroup.appendChild(projSel);
  details.append(whenGroup, prioGroup, recurGroup);
  if (cfg.showFolder !== false && (cfg.folders || []).length > 1) details.appendChild(projGroup);

  // Gardes client (miroir des gardes serveur v24/v18) — jamais de 400.
  dateIn.addEventListener('change', () => { if (!dateIn.value) { endIn.value = ''; timeIn.value = ''; } });
  recurSel.addEventListener('change', () => { if (recurSel.value) endIn.value = ''; });
  endIn.addEventListener('change', () => { if (endIn.value && (!dateIn.value || recurSel.value)) endIn.value = ''; });

  let open = false;
  if (detailsBtn) {
    try { open = localStorage.getItem(cfg.storageKey) === '1'; } catch (e) {}
    const sync = () => {
      details.style.display = open ? '' : 'none';
      detailsBtn.querySelector('.mab-btxt').textContent = open ? 'Réduire' : 'Détails';
      detailsBtn.classList.toggle('on', open);
      detailsBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    };
    sync();
    detailsBtn.addEventListener('click', () => {
      open = !open;
      try { localStorage.setItem(cfg.storageKey, open ? '1' : '0'); } catch (e) {}
      sync();
    });
  } else {
    details.style.display = 'none';
  }

  const submit = async () => {
    const title = txt.value.trim();
    if (!title) return;
    const meta = {};
    if (cfg.allowMeta) {
      if (dateIn.value) {
        meta.due_date = dateIn.value;
        if (timeIn.value) meta.due_time = timeIn.value;
        if (endIn.value && !recurSel.value && endIn.value >= dateIn.value) meta.due_end = endIn.value;
      }
      if (prio) meta.priority = prio;
      if (recurSel.value) meta.recurrence = recurSel.value;
    }
    const ok = await cfg.onCreate({ title, projectValue: projSel.value, meta });
    if (ok === false) return;
    // rafale : champs vidés, repli conservé
    txt.value = ''; dateIn.value = ''; endIn.value = ''; timeIn.value = '';
    prio = 0; renderPrios(); recurSel.value = '';
  };
  txt.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  addBtn.addEventListener('click', () => (typeof withBusy === 'function' ? withBusy(addBtn, submit) : submit()));

  // Les pages invitées re-rendent leur board au poll 15 s : la barre est construite UNE fois puis
  // ré-attachée, et seule la liste des dossiers est rafraîchie — la saisie et le repli survivent.
  bar.updateFolders = (folders) => {
    const prev = projSel.value;
    projSel.innerHTML = '';
    (folders || []).forEach(f => {
      const o = el('option', { attrs: { value: String(f.value) }, text: f.label });
      if (f.selected) o.selected = true;
      projSel.appendChild(o);
    });
    if (prev && [...projSel.options].some(o => o.value === prev)) projSel.value = prev;
    const many = (folders || []).length > 1;
    if (cfg.showFolder !== false && many && !projGroup.isConnected) details.appendChild(projGroup);
    if ((!many || cfg.showFolder === false) && projGroup.isConnected) projGroup.remove();
  };

  bar.append(row1, details);
  return bar;
}

// [HDR-GLOW] la lueur vise la souris et la rattrape en douceur (lissage rAF 0.11, boucle active
// SEULEMENT pendant le survol — zéro coût au repos) ; teinte caméléon accent→accent éclairci selon x.
// Accent relu à chaque entrée (suit la bascule de thème en session). Tactile : jamais déclenché.
function hdrAttachGlow(btn, glow) {
  let x = 0, y = 0, tx = 0, ty = 0, on = false, g1 = '#4fc3f7', g2 = '#a5e2fb';
  btn.addEventListener('pointerenter', e => {
    const acc = (getComputedStyle(document.documentElement).getPropertyValue('--accent') || '').trim();
    if (/^#[0-9a-f]{6}$/i.test(acc)) { g1 = acc; g2 = mabMixHex(acc, '#ffffff', 0.35); }
    const r = btn.getBoundingClientRect();
    x = tx = e.clientX - r.left; y = ty = e.clientY - r.top;
    on = true;
    (function loop() {
      if (!on) return;
      x += (tx - x) * 0.11; y += (ty - y) * 0.11;
      glow.style.left = x + 'px'; glow.style.top = y + 'px';
      requestAnimationFrame(loop);
    })();
  });
  btn.addEventListener('pointermove', e => {
    const r = btn.getBoundingClientRect();
    tx = e.clientX - r.left; ty = e.clientY - r.top;
    glow.style.background = mabMixHex(g1, g2, Math.min(1, Math.max(0, tx / r.width)));
  });
  btn.addEventListener('pointerleave', () => { on = false; });
}
// Un bouton du header : {icon, label, title, onClick, count, menu, disabled}. count>0 → pastille (DONNÉE,

}
// Conteneur bordé + bascule compact/étendu (préférence GLOBALE). Usage :

function hdrToolbarCompactPref() { try { return localStorage.getItem('hdrToolbarCompact') === '1'; } catch (e) { return false; } }
function hdrToolbar() {

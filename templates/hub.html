<script>
const EMBEDDED_BUILD = "{{ build }}";  // [UPDATE-PROMPT] version embarquée au rendu
// [HUB-ROUTE-PREFIX] URL = /share/hub/<token> → le token est le dernier segment.
const HUB_TOKEN = location.pathname.split('/').filter(Boolean).pop();
const HUB_BASE = '/share/hub/' + HUB_TOKEN;
// [FX-CONVERTER] widget convertisseur de devises (hub → /share/hub/<token>/fx, taux publics).
if (typeof initFxWidget === 'function') initFxWidget({ fetchUrl: HUB_BASE + '/fx' });
let DATA = null, FOCUS = null, VIEW = 'board';
let activeMap = null;  // [HUB-MAP-FIX] état carte attendu par runMapDialog (miroir index/share.html)
const themeBtn = document.getElementById('theme-btn');

// ── helpers minimaux (notify/confirm/icon/announce/sanitize) ──
function icon() { return document.createElement('span'); }   // hub n'utilise pas d'icônes SVG
function announce() {}
const notifyDialog = document.getElementById('notify-dialog');
document.getElementById('notify-ok').addEventListener('click', () => notifyDialog.close());
function notify(msg, opts) { document.getElementById('notify-title').textContent = (opts && opts.error) ? 'Erreur' : 'Info';
  document.getElementById('notify-msg').textContent = msg; notifyDialog.showModal(); }
const confirmDialog = document.getElementById('confirm-dialog');
// [CONFIRM-TITLES] le hub ignorait `title` ET `danger` : tous les appels (y compris ceux du
// partial, partagés avec owner/share) retombaient sur le titre statique « Confirmer » et sur un
// bouton rouge, même pour une action anodine. Signature alignée sur index/share — mêmes options,
// même comportement sur les 3 pages. Défauts identiques (suppression) : les appels existants
// qui ne passent rien gardent leur rendu.
function confirmPopin(msg, { title = 'Confirmer la suppression', okLabel = 'Supprimer', danger = true } = {}) { return new Promise(res => {
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-msg').textContent = msg;
  document.getElementById('confirm-yes').textContent = okLabel;
  document.getElementById('confirm-yes').className = 'btn ' + (danger ? 'danger' : 'primary');
  const yes = () => { cleanup(); res(true); }, no = () => { cleanup(); res(false); };
  function cleanup() { confirmDialog.close(); by.removeEventListener('click', yes); bn.removeEventListener('click', no); }
  const by = document.getElementById('confirm-yes'), bn = document.getElementById('confirm-no');
  by.addEventListener('click', yes); bn.addEventListener('click', no); confirmDialog.showModal();
}); }
function sanitize(html) {
  const tpl = document.createElement('template'); tpl.innerHTML = html;
  tpl.content.querySelectorAll('script,style,iframe,object,embed,link,meta,form').forEach(n => n.remove());
  tpl.content.querySelectorAll('*').forEach(n => { [...n.attributes].forEach(a => {
    if (/^on/i.test(a.name)) n.removeAttribute(a.name);
    if ((a.name === 'href' || a.name === 'src') && /^\s*javascript:/i.test(a.value)) n.removeAttribute(a.name);
  }); if (n.tagName === 'A') { n.setAttribute('target', '_blank'); n.setAttribute('rel', 'noopener noreferrer'); } });
  return tpl.content;
}
function isRich(c) { return /<(p|div|ul|ol|li|br|strong|em|u|s|a|h[1-6]|blockquote|pre|code|span|table)[\s>/]/i.test(c || ''); }
function linkify(text) { const frag = document.createDocumentFragment(); const re = /https?:\/\/[^\s<>"]+/g;
  let last = 0, m; while ((m = re.exec(text)) !== null) { frag.appendChild(document.createTextNode(text.slice(last, m.index)));
    const a = el('a', '', m[0].replace(/^https?:\/\//, '')); a.href = m[0]; a.target = '_blank'; a.rel = 'noopener noreferrer';
    frag.appendChild(a); last = m.index + m[0].length; } frag.appendChild(document.createTextNode(text.slice(last))); return frag; }
function stripTags(html) { const t = document.createElement('template'); t.innerHTML = html || ''; return (t.content.textContent || '').replace(/\s+/g, ' ').trim(); }
function textOn(hex) { const c = (hex || '').replace('#', ''); if (c.length < 6) return '#fff';
  const r = parseInt(c.slice(0,2),16), g = parseInt(c.slice(2,4),16), b = parseInt(c.slice(4,6),16);
  return (0.299*r+0.587*g+0.114*b) > 150 ? '#15191e' : '#fff'; }
const todayStr = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };

// [GUEST-SETTINGS] thème à TROIS états (Auto / Clair / Sombre) piloté depuis la pop-in
// Paramètres ; « Auto » suit l'appareil. La valeur résolue reste écrite dans `theme`
// (le script anti-FOUC du <head> est inchangé).
initThemePref();
{ const _hdr = document.querySelector('#dash header');
  if (_hdr) _hdr.appendChild(guestGearButton('btn', () => openGuestSettings(hubSettingsCfg()))); }
// cfg de la pop-in : e-mail (route EXISTANTE, destinataire forcé serveur) + favoris locaux.
function hubSettingsCfg() {
  const getFavItems = () => hubFavEntries();
  return {
    email: (DATA && DATA.smtp_enabled) ? {
      onSend: async () => {
        const proof = hubProof();   // cookie de session seul si pas de jeton en repli
        const r = await fetch(HUB_BASE + '/send-link', { method: 'POST', headers: proof ? { 'X-Guest-Token': proof } : {} });
        const d = await r.json().catch(() => ({}));
        if (r.ok) return { ok: true, msg: 'Envoyé à ' + (d.sent_to || 'votre adresse') + ' — vérifie aussi les spams.' };
        return { ok: false, msg: d.error || 'Envoi impossible.' };
      },
    } : null,
    favorites: {
      count: getFavItems().length,
      items: getFavItems,
      onClear: () => { hubFavsWrite([]); renderSidebar(); },
      onReorder: (order) => { hubFavsWrite(order); renderSidebar(); },
      makeSortable: makeFavSortable,
    },
  };
}

// ── écritures routées par item : token de l'item + son guest_token ──
function gtFor(token) { try { return localStorage.getItem('dashguest:' + token) || ''; } catch (e) { return ''; } }
// [HUB-TOKEN-REFRESH] (re)pose les guest_token par dossier — appelé à chaque chargement.
function persistFolderTokens(folders) {
  (folders || []).forEach(f => { if (f.token && f.guest_token) { try { localStorage.setItem('dashguest:' + f.token, f.guest_token); } catch (e) {} } });
}
// Rafraîchit les jetons depuis le serveur (preuve déjà détenue). Renvoie true si OK.
async function refreshTokens() {
  try {
    const r = await fetch(HUB_BASE + '/data', { headers: { 'X-Guest-Token': hubProof() } });
    if (!r.ok) return false;
    const d = await r.json(); persistFolderTokens(d.folders); return true;
  } catch (e) { return false; }
}
async function api(token, path, opts, _retried) {
  opts = opts || {}; opts.headers = Object.assign({ 'X-Guest-Token': gtFor(token) }, opts.headers || {});
  if (opts.body && !(opts.body instanceof FormData)) opts.headers['Content-Type'] = 'application/json';
  const r = await fetch('/share/' + token + path, opts);
  // 403 alors qu'on a un can_edit côté UI → jeton manquant/périmé (ex. dossier ajouté après coup).
  // Rafraîchir les jetons en silence et réessayer UNE fois avant d'alerter (jamais « lecture seule »).
  if (r.status === 403 && !_retried) {
    if (await refreshTokens() && gtFor(token)) return api(token, path, opts, true);
  }
  if (r.status === 403) notify('Session expirée — re-saisis ton code.', { error: true });
  return r;
}
async function putMemo(m, body) { const r = await api(m.share_token, '/memo/' + m.id, { method: 'PUT', body: JSON.stringify(body) }); if (r.ok) { await reload(); flashSaved(true); } else flashSaved(false); return r; }  // [SAVE-INDICATOR]

// ── proof header pour /share/hub/<token>/data ──
function hubProof() { try { return localStorage.getItem('dashhubproof:' + HUB_TOKEN) || ''; } catch (e) { return ''; } }

async function approve() {
  const pin = document.getElementById('pin').value.trim();
  const errEl = document.getElementById('hub-error');
  if (!/^\d{4}$/.test(pin)) { errEl.textContent = 'Le code fait 4 chiffres.'; return; }
  errEl.textContent = '';
  const r = await fetch(HUB_BASE + '/approve', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin }) });
  if (!r.ok) { const e = await r.json().catch(() => ({})); errEl.textContent = e.error || 'code invalide';
    document.getElementById('pin').value = ''; document.getElementById('pin').focus(); return; }
  const data = await r.json();
  persistFolderTokens(data.folders);
  if (data.folders && data.folders.length) { try { localStorage.setItem('dashhubproof:' + HUB_TOKEN, data.folders[0].guest_token); } catch (e) {} }
  try { localStorage.setItem('dashhubfolders:' + HUB_TOKEN, JSON.stringify(data.folders || [])); } catch (e) {}
  await loadDash(data.folders || []);
}
document.getElementById('pin-btn').addEventListener('click', approve);
document.getElementById('pin').addEventListener('keydown', e => { if (e.key === 'Enter') approve(); });

// ── chargement du dashboard agrégé (repli lanceur en cas d'échec) ──
async function loadDash(knownFolders) {
  // [HUB-SESSION] toujours tenter /data : le cookie HttpOnly part tout seul (same-origin) ;
  // le header X-Guest-Token reste en repli si le localStorage l'a encore. Sans session → 403 → écran code.
  const proof = hubProof();
  let data;
  try {
    const r = await fetch(HUB_BASE + '/data', { headers: proof ? { 'X-Guest-Token': proof } : {} });
    if (r.status === 403) { showCode(); return; }
    if (!r.ok) throw new Error('data');
    data = await r.json();
  } catch (e) {
    fallbackLauncher(knownFolders); return;   // dégradation gracieuse → lanceur
  }
  persistFolderTokens(data.folders);  // [HUB-TOKEN-REFRESH] dossiers ajoutés après coup deviennent éditables
  DATA = data;
  if (Array.isArray(DATA.reaction_emojis)) REACTION_EMOJIS = DATA.reaction_emojis;  // [REACTION-PALETTE]
  promptReloadIfStale(EMBEDDED_BUILD, DATA.build_version);  // [UPDATE-PROMPT]
  document.getElementById('code-screen').hidden = true;
  document.getElementById('dash').hidden = false;
  if (data.name) document.getElementById('dash-name').textContent = '📂 ' + data.name;
  render();
}
async function reload() {
  const r = await fetch(HUB_BASE + '/data', { headers: { 'X-Guest-Token': hubProof() } });
  if (r.ok) { DATA = await r.json(); if (Array.isArray(DATA.reaction_emojis)) REACTION_EMOJIS = DATA.reaction_emojis; persistFolderTokens(DATA.folders); render(); }
}
function showCode() { document.getElementById('dash').hidden = true; document.getElementById('code-screen').hidden = false;
  document.getElementById('pin').focus(); }

// ── repli lanceur (liste de liens) ──
function fallbackLauncher(folders) {
  folders = folders || (() => { try { return JSON.parse(localStorage.getItem('dashhubfolders:' + HUB_TOKEN) || '[]'); } catch (e) { return []; } })();
  document.getElementById('code-screen').hidden = true;
  const dash = document.getElementById('dash'); dash.hidden = false;
  document.getElementById('sidebar').hidden = true;
  const board = document.getElementById('board'); board.innerHTML = '';
  board.appendChild(el('p', { class: 'sub', attrs: { style: 'color:var(--muted)' }, text: 'Vue agrégée indisponible — voici vos dossiers :' }));
  (folders || []).forEach(f => {
    const a = el('a', { attrs: { href: f.url, style: 'display:block;padding:0.7rem 0.9rem;margin-bottom:0.6rem;background:var(--panel);border:1px solid var(--border);border-radius:10px;text-decoration:none;color:inherit' } });
    a.textContent = (f.emoji ? f.emoji + ' ' : '') + (f.label || '(dossier)') + (f.can_edit ? '  ✏️' : '  👁');
    board.appendChild(a);
  });
}

// ── données scopées (focus + recherche) ──
function projChildren(pid) { return (DATA.projects || []).filter(p => p.parent_id === pid); }
function projDescendants(pid) { const out = []; const w = (id) => projChildren(id).forEach(c => { out.push(c.id); w(c.id); }); w(pid); return out; }
// [PHOTO-BATCH-DOWNLOAD] Fichiers d'un dossier (+ sous-dossiers) — scope borné à DATA.memos.
function hubProjectZipCount(pid, scope, includeSubs) {
  const set = new Set(includeSubs ? [pid, ...projDescendants(pid)] : [pid]);
  let n = 0;
  (DATA.memos || []).forEach(m => { if (set.has(m.project_id)) n += memoZipCount(m, scope); });
  // [FOLDER-ATTACHMENTS] fichiers rattachés aux dossiers du périmètre
  (DATA.projects || []).forEach(p => { if (set.has(p.id)) (p.attachments || []).forEach(a => { if (scope === 'all' || (a.mime || '').indexOf('image/') === 0) n++; }); });
  return n;
}
// [FILES-VIEW] Vue « Fichiers » d'un dossier du hub (scopée au token du dossier, invariant 5).
function openHubFileSource(s) {
  if (!s) return;
  if (s.type === 'memo') { const m = (DATA.memos || []).find(x => x.id === s.id); if (m) { openEditor(m); return; } }
  if (s.type === 'project') { FOCUS = s.id; VIEW = 'board'; syncViewBtns(); render(); }
}
function openHubFiles(proj) {
  openFilesDialog({
    title: proj.name,
    load: () => fetch('/share/' + proj.share_token + '/project/' + proj.id + '/files').then(r => r.json()),
    onOpenSource: openHubFileSource,
    openImage: (a) => { if (typeof runImageViewer === 'function') runImageViewer({ images: [a], startIndex: 0, imageUrl: (x) => x.url }); else window.open(a.url, '_blank', 'noopener'); },
    zip: { hasSubprojects: true, count: (scope, subs) => hubProjectZipCount(proj.id, scope, subs),
           buildUrl: (scope, subs) => '/share/' + proj.share_token + '/project/' + proj.id + '/download.zip?scope=' + scope + '&subprojects=' + (subs ? 1 : 0) },
  });
}
/* ===== [SEARCH-SHARED] recherche du hub =====
   Le hub n'avait qu'un champ nu : aucune portée, aucune aide, aucun moyen d'élargir hors du
   dossier focalisé. Il reçoit ici le composant partagé (aide + feuille mobile) et, avec lui, les
   préfixes `p#`/`m#` du parseur commun. ⚠️ Constat à noter : contrairement à l'owner d'avant
   [SEARCH-IN-FOLDER], le hub était DÉJÀ borné au dossier (le filtre FOCUS s'appliquait avant la
   recherche) — la « tranche C » n'y trouvait donc pas de bug à corriger ; ce qui manquait, c'était
   l'INVERSE : pouvoir sortir du dossier. D'où `hubSearchWide`, jumeau de `searchWide` côté owner
   (non persisté : il retombe dès que la recherche est vidée). */
let hubSearchScope = 'all';
let hubSearchWide = false;
function hubSearchRaw() { const i = document.getElementById('search'); return i ? i.value : ''; }
function hubSearch() { return parseSearchPrefix(hubSearchRaw(), hubSearchScope); }
function hubMatchingProjects(q) {
  if (!q) return [];
  const n = q.charAt(0) === '#' ? q.slice(1) : q;
  return (DATA.projects || []).filter(p => (p.name || '').toLowerCase().includes(n));
}
// Filtre de recherche appliqué aux mémos — UN seul endroit, réutilisé par le board ET l'agenda
// (sinon la grille et la liste ne montreraient pas les mêmes mémos).
function hubMemoFilter(ms) {
  const { scope, q } = hubSearch();
  if (!q) return ms;
  if (scope === 'projects') {
    const ids = new Set(hubMatchingProjects(q).map(p => p.id));
    return ms.filter(m => ids.has(m.project_id));
  }
  return ms.filter(m => ((m.title || '') + ' ' + stripTags(m.content) + ' ' + (m.assignees || []).join(' ')).toLowerCase().includes(q));
}
function hubSearchScoped() {   // vrai quand la recherche est effectivement bornée au dossier focalisé
  return FOCUS != null && !!hubSearch().q && !hubSearchWide;
}
function focusedMemos() {
  let ms = DATA.memos || [];
  const wide = !!hubSearch().q && hubSearchWide;   // chip « ce dossier » éteint → on cherche partout
  if (FOCUS != null && !wide) { const set = new Set([FOCUS, ...projDescendants(FOCUS)]); ms = ms.filter(m => set.has(m.project_id)); }
  return hubMemoFilter(ms);
}
function prioOf(id) { return (DATA.priorities || []).find(p => p.id === id) || null; }
function projById(id) { return (DATA.projects || []).find(p => p.id === id) || null; }

// ── rendu ──
function render() {
  maybeInitQuickMemo();  // [QUICK-MEMO-HUB] widget de capture rapide multi-partages (idempotent)
  renderSidebar();
  if (VIEW === 'plan') renderPlan();
  else if (VIEW === 'agenda') renderAgendaHub();
  else renderBoard();
  syncMapBtn();
}

// [QUICK-MEMO-HUB] V1.1 : le hub embarque le widget (les invités réels passent par le hub, pas
// par /share direct — D4 révisée). Créé une seule fois (idempotent) dès qu'un dossier est éditable.
// Sélecteur multi-partages : optgroup par partage, chaque option porte (share_token, project_id).
// Submit = POST /share/<token>/memos EXISTANT avec le X-Guest-Token du partage choisi (invariant 5,
// zéro route). Hub 100 % lecture (aucun dossier can_add) = pas de widget. Pas d'offline (D5, owner-only).
function maybeInitQuickMemo() {
  if (typeof initQuickMemo !== 'function') return;
  initQuickMemo({
    inbox: false,
    canUse: () => editableProjects().length > 0,
    folders: () => {
      const eps = editableProjects();
      if (!eps.length) return [];
      const tokLabel = {};
      (DATA.folders || []).forEach(f => { if (f.token) tokLabel[f.token] = (f.emoji ? f.emoji.trim() + ' ' : '') + (f.label || 'Partage'); });
      const groups = [], byTok = {};
      eps.forEach(p => {
        const tk = p.share_token || '';
        if (!byTok[tk]) { byTok[tk] = { group: tokLabel[tk] || 'Partage', token: tk, projs: [] }; groups.push(byTok[tk]); }
        byTok[tk].projs.push(p);
      });
      const mk = (g) => qmFolderOptions(g.projs).map(o => ({ value: g.token + '|' + o.value, label: o.label }));
      return groups.length === 1 ? mk(groups[0]) : groups.map(g => ({ group: g.group, options: mk(g) }));
    },
    defaultFolder: () => {
      const eps = editableProjects();
      if (!eps.length) return '';
      const cur = (FOCUS != null) ? eps.find(p => p.id === FOCUS) : null;
      const pick = cur || eps[0];
      return pick.share_token + '|' + pick.id;
    },
    submit: async ({ title, content, folder }) => {
      const sep = (folder || '').indexOf('|');
      if (sep < 0) { notify('Choisis un dossier.', { error: true }); return false; }
      const token = folder.slice(0, sep), pid = Number(folder.slice(sep + 1));
      const body = {};
      if (title) body.title = title;
      if (content) body.content = content;
      if (pid) body.project_id = pid;
      const r = await api(token, '/memos', { method: 'POST', body: JSON.stringify(body) });
      if (!r.ok) { const e = await r.json().catch(() => ({})); notify(e.error || 'Création impossible', { error: true }); return null; }
      const memo = await r.json().catch(() => null);
      await reload();
      // Le token du partage choisi voyage AVEC le résultat : dans le hub, chaque dossier a le
      // sien, et `uploadMedia` en a besoin pour viser la bonne route /share/<token>/….
      return (memo && memo.id) ? { id: memo.id, token: token } : true;
    },
    // [QUICK-MEMO V2] médias posés APRÈS création, par les routes invité EXISTANTES sous /share/…
    // (invariant 5). `api()` du hub gère déjà le X-Guest-Token par partage et laisse le navigateur
    // poser le Content-Type multipart quand le corps est un FormData.
    // ⚠️ PNG/JPEG seulement côté invité (GUEST_IMG_EXT) : un HEIC est refusé et compté en échec.
    uploadMedia: async (res, { photos, voices }) => {
      let failed = 0;
      for (const file of photos) {
        const fd = new FormData(); fd.append('image', file);
        const r = await api(res.token, '/memo/' + res.id + '/images', { method: 'POST', body: fd }).catch(() => null);
        if (!r || !r.ok) failed++;
      }
      for (const v of voices) {   // un clip = une PJ ; séquentiel, chaque échec compté à part
        const fd = new FormData(); fd.append('files', v.blob, v.filename);
        const r = await api(res.token, '/memo/' + res.id + '/attachments', { method: 'POST', body: fd }).catch(() => null);
        if (!r || !r.ok) failed++;
      }
      await reload();
      return failed;
    },
  });
}

// [MAP-BTN-COUNT] parité owner (index.html renderBoard) : le bouton Carte porte le
// compteur de points géolocalisés de la vue courante et se masque à 0 (fini le clic
// qui n'affiche que « Aucun élément géolocalisé »). Même source que le check du clic
// (hubMapPoints), donc N == ce que la carte afficherait. Rafraîchi à chaque render()
// → suit dossier / sous-projet / « Tout » / recherche.
function syncMapBtn() {
  const btn = document.getElementById('btn-map');
  if (!btn) return;
  const n = (typeof L === 'undefined') ? 0 : hubMapPoints().length;
  btn.hidden = n === 0;
  btn.textContent = '🗺 Carte (' + n + ')';
}

/* [GUEST-FAVS] Favoris de la sidebar du hub (V1 — `hub.html` seul ; la page share mono-partage
   attendra une V2). 100 % LOCAL : `localStorage` par hub, AUCUNE donnée serveur, rien d'exporté,
   aucun droit élargi (invariant 5 : affichage seul). Un favori dont le dossier a disparu
   (partage révoqué) est ignoré ET purgé au rendu — jamais de ligne fantôme.
   ⚠️ Écart au brief : la clef est `<share_token>|<project_id>` et NON le token seul — dans le hub
   un même partage couvre le dossier ET tous ses descendants, donc le token seul ne distingue pas
   deux dossiers du même partage. Le couple reste stable au renommage (c'est ce que visait le brief). */
function hubFavsKey() { return 'hubFavs:' + HUB_TOKEN; }
function hubFavsRead() {
  try { const v = JSON.parse(localStorage.getItem(hubFavsKey()) || '[]'); return Array.isArray(v) ? v.filter(x => typeof x === 'string') : []; }
  catch (e) { return []; }
}
function hubFavsWrite(list) { try { localStorage.setItem(hubFavsKey(), JSON.stringify(list)); } catch (e) {} }
function hubFavId(p) { return (p.share_token || '') + '|' + p.id; }
function hubFavToggle(p) {
  const id = hubFavId(p);
  const list = hubFavsRead();
  const i = list.indexOf(id);
  if (i >= 0) list.splice(i, 1); else list.push(id);   // ordre = ordre d'épinglage (réordonner = V2)
  hubFavsWrite(list);
  renderSidebar();
}
// Étoile ☆/★ posée en bout de ligne. Ne navigue jamais (stopPropagation).
function hubFavStar(p, on) {
  const b = el('button', { class: 'fav-star' + (on ? ' on' : ''), text: on ? '★' : '☆',
    attrs: { type: 'button', title: on ? 'Retirer des favoris' : 'Épingler dans les favoris',
      'aria-label': (on ? 'Retirer « ' : 'Épingler « ') + p.name + ' »', 'aria-pressed': on ? 'true' : 'false' } });
  b.addEventListener('click', (e) => { e.stopPropagation(); hubFavToggle(p); });
  return b;
}
function hubFavEntries() {
  const byId = new Map((DATA.projects || []).map(p => [hubFavId(p), p]));
  const favIds = hubFavsRead();
  const alive = favIds.filter(id => byId.has(id));
  if (alive.length !== favIds.length) hubFavsWrite(alive);   // purge des partages révoqués
  return alive.map(id => {
    const p = byId.get(id);
    return {
      key: id,
      proj: p,
      icon: p.emoji
        ? el('span', { text: p.emoji })
        : el('span', { attrs: { style: 'width:0.5rem;height:0.5rem;border-radius:50%;flex-shrink:0;background:' + (usableProjColor(p.color) || 'var(--gray)') } }),
      name: p.name,
    };
  });
}
let favSuppressClickUntil = 0;
function makeFavSortable(container, onCommit) {
  let dragEl = null, pid = null, timer = null, dragging = false, sx = 0, sy = 0, touch = false;
  const rows = () => Array.from(container.children).filter(c => c.dataset.favkey);
  function cleanup() {
    if (timer) { clearTimeout(timer); timer = null; }
    if (dragEl) dragEl.classList.remove('fav-dragging');
    container.style.touchAction = '';
    dragEl = null; pid = null; dragging = false;
  }
  function begin() {
    if (!dragEl) return;
    dragging = true;
    dragEl.classList.add('fav-dragging');
    container.style.touchAction = 'none';
    try { dragEl.setPointerCapture(pid); } catch (e) {}
  }
  container.addEventListener('pointerdown', (e) => {
    const row = e.target.closest('[data-favkey]');
    if (!row || !container.contains(row) || (e.button !== undefined && e.button !== 0)) return;
    dragEl = row; pid = e.pointerId; sx = e.clientX; sy = e.clientY;
    touch = e.pointerType === 'touch' || e.pointerType === 'pen';
    if (touch) timer = setTimeout(() => { timer = null; begin(); }, 500);
  });
  container.addEventListener('pointermove', (e) => {
    if (e.pointerId !== pid || !dragEl) return;
    const dx = Math.abs(e.clientX - sx), dy = Math.abs(e.clientY - sy);
    if (!dragging) {
      if (touch) { if (dx > 8 || dy > 8) cleanup(); return; }
      if (dx > 4 || dy > 4) begin(); else return;
    }
    e.preventDefault();
    let placed = false;
    for (const r of rows()) {
      if (r === dragEl) continue;
      const rect = r.getBoundingClientRect();
      if (e.clientY < rect.top + rect.height / 2) { container.insertBefore(dragEl, r); placed = true; break; }
    }
    if (!placed) container.appendChild(dragEl);
  });
  container.addEventListener('touchmove', (e) => { if (dragging) e.preventDefault(); }, { passive: false });
  function finalize() {
    if (dragging) {
      favSuppressClickUntil = Date.now() + 350;
      const order = rows().map(r => r.dataset.favkey);
      cleanup();
      if (typeof onCommit === 'function') onCommit(order);
    } else cleanup();
  }
  container.addEventListener('pointerup', (e) => { if (e.pointerId !== pid) return; if (dragging) e.preventDefault(); finalize(); });
  container.addEventListener('pointercancel', (e) => { if (e.pointerId !== pid) return; finalize(); });
  container.addEventListener('click', (e) => {
    if (Date.now() < favSuppressClickUntil) { e.stopPropagation(); e.preventDefault(); }
  }, true);
}

/* [HUB-CHROME] Navigation = retour au BOARD. Avant, cliquer un dossier avec l'Agenda (ou le
   Plan) ouvert laissait l'écran sur la vue : seul le compteur suivait. Toute entrée en focus
   passe désormais par ce point unique — la vue se referme, le board demandé s'affiche. */
/* [GUEST-TREE] repli des dossiers de la sidebar du hub : état LOCAL persisté PAR HUB
   (`hubSbProjOpen:<hub_token>:<id>`, façon hubFavs), **déplié par défaut** — même défaut que les
   sidebars owner (`sbProjOpen:<id>`) et share (`shareSbProjOpen:<TOKEN>:<id>`). Pur affichage. */
/* [HUB-SECTIONS-FOLD] Sections de la sidebar repliables (⭐ FAVORIS / DOSSIERS PARTAGÉS), même
   mécanique que le owner (`sbSection:<nom>`), persistée PAR HUB. Défauts : desktop = tout déplié
   (comme avant) ; ≤ 900 px ou `pointer: coarse` = **FAVORIS REPLIÉE** (la sidebar s'empile AVANT
   le contenu en mobile, un gros bloc de favoris repoussait la navigation), DOSSIERS PARTAGÉS
   dépliée (c'est la navigation principale). Le compteur reste visible dans l'en-tête replié. */
function hubStacked() { return window.matchMedia('(max-width: 900px), (pointer: coarse)').matches; }
function hubSecOpen(name) {
  try {
    const v = localStorage.getItem('hubSbSection:' + HUB_TOKEN + ':' + name);
    if (v === '0') return false;
    if (v === '1') return true;
  } catch (e) {}
  return !(name === 'Favoris' && hubStacked());   // défaut : replié seulement pour Favoris en empilé
}
function toggleHubSec(name) {
  try { localStorage.setItem('hubSbSection:' + HUB_TOKEN + ':' + name, hubSecOpen(name) ? '0' : '1'); } catch (e) {}
}
// En-tête de section cliquable (chevron + libellé + compteur optionnel).
function hubSectionHead(name, label, count) {
  const open = hubSecOpen(name);
  const h = el('div', { class: 'sb-section-head', attrs: { role: 'button', tabindex: '0',
    'aria-expanded': open ? 'true' : 'false', title: open ? 'Replier cette section' : 'Déplier cette section' } });
  h.appendChild(el('span', { class: 'sb-chevron', text: open ? '▾' : '▸' }));
  h.appendChild(el('span', { class: 'sb-section-label', text: label + (count ? ' · ' + count : '') }));
  const act = () => { toggleHubSec(name); renderSidebar(); };
  h.addEventListener('click', act);
  h.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act(); } });
  return h;
}

function hubSbProjOpen(id) { try { return localStorage.getItem('hubSbProjOpen:' + HUB_TOKEN + ':' + id) !== '0'; } catch (e) { return true; } }
function toggleHubSbProj(id) {
  try { localStorage.setItem('hubSbProjOpen:' + HUB_TOKEN + ':' + id, hubSbProjOpen(id) ? '0' : '1'); } catch (e) {}
}
let hubDragProj = null;
// Déplacement d'un dossier : route invitée EXISTANTE, message serveur (403/409) remonté tel quel.
async function hubMoveProject(src, parentId) {
  const r = await api(src.share_token, '/project/' + src.id, { method: 'PUT', body: JSON.stringify({ parent_id: parentId }) });
  if (!r.ok) {
    const e = await r.json().catch(() => ({}));
    await notify(e.error || 'Déplacement impossible.', { error: true });
    return false;
  }
  await reload();          // re-render sidebar + board (le scroll de la page n'est pas touché)
  flashSaved(true);
  return true;
}

function hubFocusOn(pid) {
  FOCUS = pid;
  if (VIEW !== 'board') { VIEW = 'board'; syncViewBtns(); }
  render();
}

function renderSidebar() {
  const nav = document.getElementById('sidebar'); nav.hidden = false; nav.innerHTML = '';
  const all = el('div', { class: 'sitem' + (FOCUS == null ? ' active' : '') });
  all.appendChild(el('span', { text: '📂' }));
  all.appendChild(el('span', { class: 'nm', text: 'Tout' }));
  all.addEventListener('click', () => { hubFocusOn(null); });
  nav.appendChild(all);   // « Tout » n'est pas épinglable (ni « Recevoir mon lien par e-mail »)

  // [GUEST-SETTINGS V2 — correctif] `alive` vivait ici avant [V27.20.186] ; sa remontée dans
  // `hubFavEntries()` a laissé une référence orpheline dans `walk()` (ReferenceError à la 1re
  // ligne de l'arbre → forEach(roots) mort → « Dossiers partagés » VIDE). L'appartenance aux
  // favoris se lit maintenant sur un Set local, calculé UNE fois (pas d'appel par ligne).
  const favIds = new Set(hubFavsRead());
  // [GUEST-FAVS] section ⭐ FAVORIS entre « Tout » et « DOSSIERS PARTAGÉS ».
  const favItems = hubFavEntries();
  nav.appendChild(hubSectionHead('Favoris', '⭐ Favoris', favItems.length));
  if (!hubSecOpen('Favoris')) {
    // section repliée : rien d'autre (le compteur vit dans l'en-tête)
  } else if (!favItems.length) {
    nav.appendChild(el('div', { class: 'fav-hint', text: 'Survole un dossier et clique ☆ pour l\'épingler ici.' }));
  } else {
    // [HUB-FAV-SIDEBAR-DRAG] Les favoris vivent dans leur PROPRE conteneur : `makeFavSortable`
    // réordonne les enfants directs de la boîte qu'on lui donne. Sans lui, les lignes étaient des
    // enfants de `nav` mêlées aux sections, et le drag aurait promené « Tout » ou un en-tête.
    const favBox = el('div', { class: 'fav-sortable' });
    favItems.forEach(({ key, proj: p, icon }) => {
      const row = el('div', { class: 'sitem' + (FOCUS === p.id ? ' active' : ''),
        attrs: { title: p.name + ' — glisser pour réordonner', 'data-favkey': key } });
      if (icon) row.appendChild(icon);
      row.appendChild(el('span', { class: 'nm', text: p.name }));
      if (!p.can_edit) row.appendChild(el('span', { class: 'ro', text: '👁' }));
      row.addEventListener('click', () => hubFocusOn(p.id));   // MÊME navigation que la ligne d'origine
      row.appendChild(hubFavStar(p, true));
      favBox.appendChild(row);
    });
    nav.appendChild(favBox);
    // Même helper (et donc même garde anti clic-fantôme après un drop) que la pop-in Paramètres :
    // les deux surfaces écrivent le MÊME ordre, il n'y a qu'une liste.
    makeFavSortable(favBox, (order) => { hubFavsWrite(order); renderSidebar(); });
  }
  nav.appendChild(hubSectionHead('Dossiers', '📂 Dossiers partagés'));
  const _dossiersOpen = hubSecOpen('Dossiers');
  // racines = projets sans parent dans l'union (chaque share projet) ; mémos isolés listés à part
  const roots = (DATA.projects || []).filter(p => p.parent_id == null);
  // [SIDEBAR-TREE] arbre à indentation fixe (.sb-kids, ligne guide CSS) — plus de
  // connecteurs texte. Icône unique : emoji, sinon pastille couleur. Nom en title.
  const walk = (p, wrap) => {
    const row = el('div', { class: 'sitem' + (FOCUS === p.id ? ' active' : '') });
    const kids = projChildren(p.id);
    // [GUEST-TREE] chevron de repli : sur les dossiers AYANT des sous-dossiers seulement
    // (feuilles = span vide, la colonne reste alignée). Clic chevron = replier/déplier,
    // clic sur le nom = navigation (inchangé). Défaut DÉPLIÉ, comme les sidebars owner et share.
    const chev = el('span', { class: 'sb-proj-chev', text: kids.length ? (hubSbProjOpen(p.id) ? '▾' : '▸') : '' });
    if (kids.length) {
      chev.title = hubSbProjOpen(p.id) ? 'Replier ce dossier' : 'Déplier ce dossier';
      chev.addEventListener('click', (e) => { e.stopPropagation(); toggleHubSbProj(p.id); renderSidebar(); });
    } else { chev.style.cursor = 'default'; }
    row.appendChild(chev);
    if (p.emoji) row.appendChild(el('span', { text: p.emoji }));
    else { const d = el('span', { attrs: { style: 'width:0.5rem;height:0.5rem;border-radius:50%;flex-shrink:0;background:' + (usableProjColor(p.color) || 'var(--gray)') } }); row.appendChild(d); }
    row.appendChild(el('span', { class: 'nm', text: p.name, attrs: { title: p.name } }));
    if (!p.can_edit) row.appendChild(el('span', { class: 'ro', text: '👁' }));
    row.addEventListener('click', () => hubFocusOn(p.id));
    row.appendChild(hubFavStar(p, favIds.has(hubFavId(p))));   // [GUEST-FAVS] ★ pleine si épinglé
    /* [GUEST-TREE] drag-and-drop de dossiers — ÉDITEURS seulement (invariant 5) : on ne propose
       la poignée que si l'invité peut déplacer CE dossier (`can_edit`). Le déplacement passe par
       la route invitée EXISTANTE (celle du « ↗ Déplacer vers… » : PUT /share/<t>/project/<id>
       {parent_id}) — aucune route nouvelle ; le serveur revalide rôle + périmètre (hors scope
       → 403, collision de noms entre frères → 409) et `hubPut` remonte le message tel quel. */
    if (p.can_edit) {
      row.draggable = true;
      row.title = p.name + ' — glisser pour déplacer';
      row.addEventListener('dragstart', (e) => { hubDragProj = p.id; e.dataTransfer.effectAllowed = 'move'; });
      row.addEventListener('dragend', () => { hubDragProj = null; row.classList.remove('droptarget'); });
    }
    row.addEventListener('dragover', (e) => {
      if (hubDragProj == null || hubDragProj === p.id) return;
      if (projDescendants(hubDragProj).includes(p.id)) return;         // pas dans sa propre descendance
      const src = projById(hubDragProj);
      if (!src || src.share_token !== p.share_token) return;           // cross-partages : hors périmètre V1
      e.preventDefault();
      row.classList.add('droptarget');
    });
    row.addEventListener('dragleave', () => row.classList.remove('droptarget'));
    row.addEventListener('drop', async (e) => {
      e.preventDefault();
      row.classList.remove('droptarget');
      const src = projById(hubDragProj);
      hubDragProj = null;
      if (!src || src.id === p.id) return;
      await hubMoveProject(src, p.id);
    });
    wrap.appendChild(row);
    if (kids.length && hubSbProjOpen(p.id)) {
      const kw = el('div', { class: 'sb-kids' });
      kids.forEach(c => walk(c, kw));
      wrap.appendChild(kw);
    }
  };
  if (_dossiersOpen) {
    roots.forEach(p => walk(p, nav));
    if (!roots.length && !(DATA.memos || []).length) nav.appendChild(el('div', { class: 'empty', text: 'Aucun dossier.' }));
  }

  // [GUEST-SETTINGS] « Recevoir mon lien par e-mail » a quitté la sidebar : l'action vit
  // désormais dans la pop-in Paramètres (engrenage de l'en-tête), section « Mon accès ».
}

function dueInfo(m) {
  if (!m.due_date || m.done) return null;
  const t = todayStr();
  // [MEMO-DATE-RANGE] plage : libellé « 3 → 6 nov » ; en retard SEULEMENT après la fin effective.
  const hasRange = m.due_end && m.due_end > m.due_date;
  const lbl = hasRange ? fmtDateRange(m.due_date, m.due_end) : fmtDayShort(m.due_date);
  const eff = memoDueEndDay(m);
  let cls = '';
  if (eff < t) cls = 'due-late'; else if (memoCoversDay(m, t)) cls = 'due-today';
  const tm = fmtMemoTime(m.due_time);
  return { cls, label: '📅 ' + lbl + (tm ? ' · ' + tm : '') };
}

// [CARD-COVER] bascule Immersif/Compact persistée par dossier ouvert du hub (pattern toolsDock).
function hubCoverKey() { return 'hubBoardCover:' + FOCUS; }

function memoCard(m) {
  const task = el('div', { class: 'task' + (m.done ? ' done' : '') });
  // [CARD-COVER] 1re photo en couverture quand le board est en Immersif (le hub n'a pas d'état
  // « déplié » : la card reste une carte d'appel, le détail vit dans la fiche 👁 / l'éditeur).
  const coverName = (cardCoverOn(hubCoverKey()) && (m.images || []).length) ? m.images[0] : '';
  const prio = prioOf(m.priority);
  let leftCol = '';
  if (!m.done) { leftCol = (prio && prio.color) ? prio.color : (usableProjColor((projById(m.project_id) || {}).color) || ''); }
  if (leftCol) task.style.borderLeftColor = leftCol;
  const row = el('div', { class: 'task-row' });
  const check = el('button', { class: 'task-check', text: '✓', attrs: m.can_edit ? { title: m.done ? 'Rouvrir' : 'Terminer' } : { disabled: '', title: 'Lecture seule' } });
  if (m.can_edit) check.addEventListener('click', () => putMemo(m, { done: !m.done }));
  row.appendChild(check);
  const content = el('div', { class: 'task-content' + (coverName ? '' : ' clamp') });
  if (coverName) {
    // [CARD-COVER] carte d'appel : titre + une ligne, en TEXTE pur au-dessus du voile.
    content.appendChild(memoCoverHead(m, memoCoverTexts(m, stripTags)));
  } else if (m.title) {
    const tl = el('div', { class: 'task-title' }); if (m.emoji) tl.appendChild(el('span', { text: m.emoji + ' ' })); tl.appendChild(el('span', { text: m.title })); content.appendChild(tl);
    if (m.content) { const c = el('div'); if (isRich(m.content)) c.appendChild(sanitize(m.content)); else c.appendChild(linkify(m.content)); dressLinks(c); content.appendChild(c);
      if (m.can_edit) wireChecklist(content, m); }
  } else {
    // [MEMO-TITLE-FALLBACK] Pas de titre : accroche du contenu en style titre (gras), sans doublon
    // (1re ligne = titre, reste = extrait). Contenu vide/HTML sans texte → placeholder unique.
    if (m.emoji) content.appendChild(el('span', { text: m.emoji + ' ' }));
    const stripped = stripTags(m.content || '').trim();
    if (!stripped) {
      content.appendChild(el('div', { class: 'task-title', attrs: { style: 'font-weight:500;color:var(--muted);font-style:italic' }, text: MEMO_EMPTY_LABEL }));
    } else if (!isRich(m.content)) {
      content.appendChild(el('div', { class: 'task-title', text: memoLeadText(stripped) }));
      const rest = memoRestText(m.content);
      if (rest) { const c = el('div'); c.appendChild(linkify(rest)); dressLinks(c); content.appendChild(c); }  // [LINK-RENDER correctif]
    } else {
      // [V23.6.100] Riche sans titre : 1re ligne/paragraphe/item promu en titre gras, extrait =
      // reste du contenu riche (checklists/tableaux préservés), sans duplication.
      const sp = splitLeadHtml(m.content);
      content.appendChild(el('div', { class: 'task-title', text: memoLeadText(sp.lead) }));
      if (stripTags(sp.restHtml).trim()) { const c = el('div'); c.appendChild(sanitize(sp.restHtml)); dressLinks(c); content.appendChild(c); }
      if (m.can_edit) wireChecklist(content, m);
    }
  }
  // [CARD-PREVIEW] Pictos signature ☑/📷/📎/💬 (la card hub est compacte : rien inline → tous les
  // pictos utiles). Clics : 📷 → visionneuse, 📎 → pop-in fichiers, 💬 → éditeur ; ☑ passif.
  const _pic = memoPictosRow({
    subtasks: m.subtasks,
    images: (m.images || []).length,
    attachments: (m.attachments || []).length,
    comments: cmtHumanCount(m.comments),   // [SYSTEM-LINES-COUNT] messages seuls (ni journaux ni tombales)
    onImages: (m.images || []).length ? () => runImageViewer({
      images: m.images, startIndex: 0,
      imageUrl: (n) => '/share/' + m.share_token + '/image/' + n, downloadUrl: (n) => '/share/' + m.share_token + '/image/' + n, exifUrl: (n) => '/share/' + m.share_token + '/image-exif/' + n,
    }) : null,
    onAttach: (m.attachments || []).length ? () => openHubMemoAttachments(m) : null,
    onComments: cmtHumanCount(m.comments) ? () => openEditor(m) : null,
  });
  if (_pic) content.appendChild(_pic);
  // [MEMO-LINKS] D3 : chips des deux côtés ; clic = éditeur du relié (stopPropagation dans le helper).
  const _lk = memoLinkChips(m.links, (otherId) => {
    const target = (DATA.memos || []).find((x) => x.id === otherId);
    if (target) openEditor(target);
  });
  if (_lk) content.appendChild(_lk);
  content.addEventListener('click', () => openEditor(m));
  row.appendChild(content);
  // [MEMO-VIEW] œil = fiche de LECTURE, visible pour TOUS les lecteurs (le hub n'a pas de sprite
  // → icône trait `hdrIcon('eye')` du partial). stopPropagation : n'ouvre jamais l'éditeur.
  // [MEMO-VIEW correctif 3] l'œil vit dans un GROUPE d'actions poussé à droite (`.task-acts`) :
  // en ≤900 px la rangée wrappe (`.badges` prend 100 %) et un bouton isolé se détachait au milieu
  // de la card. Groupé, il reste calé à droite du contenu, comme sur les autres pages.
  const acts = el('div', { class: 'task-acts' });
  const vBtn = el('button', { class: 'btn', attrs: { type: 'button', title: 'Voir le mémo',
    style: 'padding:0.2rem 0.4rem;flex-shrink:0' } });
  const vIc = hdrIcon('eye'); vIc.setAttribute('width', '16'); vIc.setAttribute('height', '16');
  vBtn.appendChild(vIc);
  vBtn.addEventListener('click', (e) => { e.stopPropagation(); openMemoView(hubMemoViewCfg(), m.id); });
  acts.appendChild(vBtn);
  // [CARD-COVER] en immersif, les actions descendent en pied de card (bas à droite, en verre).
  if (!coverName) row.appendChild(acts);
  const badges = el('div', { class: 'badges' });
  if (prio && prio.color && !m.done) badges.appendChild(el('span', { class: 'prio-chip', text: prio.name, attrs: { style: 'background:' + prio.color + ';color:' + textOn(prio.color) } }));
  const due = dueInfo(m); if (due) badges.appendChild(el('span', { class: 'badge ' + due.cls, text: due.label }));
  if (m.project) badges.appendChild(el('span', { class: 'badge', text: '📁 ' + m.project }));
  // [CARD-PREVIEW] Le compteur 📎 est dans la rangée de pictos (anti-doublon).
  (m.assignees || []).forEach(a => badges.appendChild(el('span', { class: 'asg-av', text: initials(a), attrs: { title: a } })));
  if (!m.can_edit) badges.appendChild(el('span', { class: 'lock', text: '🔒 lecture' }));
  if (badges.children.length) row.appendChild(badges);
  task.appendChild(row);
  const vr = hubVoteRow(m);
  if (vr) task.appendChild(vr);
  // [CARD-COVER] la photo EST la card en immersif.
  // [CARD-COVER v1.1] en compact, la bande de vignettes sous la card cède la place à la vignette
  // carrée posée à DROITE de la rangée (helper partagé) ; la visionneuse montre toujours TOUT
  // (bande de vignettes de [VIEWER-FILMSTRIP]), donc rien n'est perdu.
  if (!coverName && (m.images || []).length) {
    applyCardThumb(row, {
      url: '/share/' + m.share_token + '/image/' + m.images[0], count: m.images.length,
      onOpen: () => runImageViewer({
        images: m.images, startIndex: 0,
        imageUrl: n => '/share/' + m.share_token + '/image/' + n,
        downloadUrl: n => '/share/' + m.share_token + '/image/' + n,
        exifUrl: n => '/share/' + m.share_token + '/image-exif/' + n,
      }),
    });
  }
  // [CARD-COVER] pied (actions) puis habillage photo + voile, en DERNIER : la couche photo
  // passe sous les rangées déjà construites. Clic sur la photo = visionneuse.
  if (coverName) {
    const foot = coverFoot();
    foot.appendChild(acts);
    task.appendChild(foot);
    applyCardCover(task, {
      url: '/share/' + m.share_token + '/image/' + coverName,
      onOpen: () => runImageViewer({
        images: m.images, startIndex: 0,

      if (hubFilesCfg && dk.voice && fp.can_add) {
        const vb = voiceAttachButton(hubFilesCfg);
        if (vb) { vb.style.marginBottom = '0.5rem'; board.appendChild(vb); }
        else board.appendChild(voiceUnavailableNote('margin-bottom:0.5rem'));   // [POLISH-VIEWER-AGENDA-PRIO] icône trait
      }
      // Glisser un FICHIER sur le board déplie l'outil Fichier (recette owner 154).
      if (hubFilesCfg && !dk.file && fp.can_add) {
        board.addEventListener('dragenter', (e) => {
          const t = e.dataTransfer;
          if (!t || !Array.from(t.types || []).includes('Files')) return;
          setHubDock('file', true); render();
        });
      }
    }
  }
  // [TOOLS-DOCK-GUEST] à la RACINE (« Tout ») il n'y a pas de barre d'actions : le dock s'affiche
  // SEUL, aligné à droite, juste au-dessus des barres d'ajout.
  const dock = hubDockState();
  if (FOCUS == null) {
    // [HUB-CHROME] barre monochrome GLOBALE (Plan / Agenda / Carte) — même gabarit que les
    // barres de board (hdrToolbar/hdrBtn, lueur et glowwrap hérités, gotcha V26.2.136) ;
    // elle RELAIE les boutons historiques masqués : zéro logique dupliquée.
    const nav = hdrToolbar();
    const relay = (id) => document.getElementById(id).click();
    nav.add({ icon: 'sitemap', label: 'Plan', title: 'Arborescence de tous vos dossiers', onClick: () => relay('btn-plan') });
    nav.add({ icon: 'calendar', label: 'Agenda', title: 'Agenda global de vos dossiers', onClick: () => relay('btn-agenda') });
    const nPts = (typeof L === 'undefined') ? 0 : hubMapPoints().length;
    if (nPts) nav.add({ icon: 'map', label: 'Carte', count: nPts, title: 'Voir les points géolocalisés', onClick: () => relay('btn-map') });
    const navBar = nav.end();
    const rootDock = hubToolsDock({ memo: editableProjects().length > 0, folder: editableProjects().length > 0, file: false, voice: false });
    const wrap = el('div', { attrs: { style: 'display:flex;align-items:center;justify-content:flex-end;gap:0.5rem;flex-wrap:wrap;margin:0 0 0.6rem' } });
    wrap.appendChild(navBar);
    if (rootDock) wrap.appendChild(rootDock);   // dock en bout de rangée
    board.appendChild(wrap);
  }
  if (dock.memo) {
    board.appendChild(addBar());
    if (hubDockFocusMemo) { hubDockFocusMemo = false; setTimeout(() => { const i = document.querySelector('#board .mab-row1 input[type=text]'); if (i) i.focus(); }, 40); }
  }
  if (dock.folder) { const spb = subProjBar(); if (spb) board.appendChild(spb); }  // [GUEST-SUBPROJECT]
  const vb = hubVotesBar(); if (vb) board.appendChild(vb); // [VOTE-GROUPS] chips/création/gestion
  const ms = focusedMemos().slice().sort((a, b) => (a.done - b.done) || (a.due_date || '').localeCompare(b.due_date || ''));
  // [BOARD-SUBHIDE] chips masquer/afficher par sous-projet (affichage seul — carte inchangée).
  const _sh = subHideBar({
    storageKey: 'hubBoardSubHide:' + FOCUS,
    memos: ms,
    currentProjectId: FOCUS,
    projById: (id) => projById(id) || null,
    onChange: render,
  });
  if (_sh.bar) board.appendChild(_sh.bar);
  const shown = ms.filter(m => !_sh.isHidden(m));
  if (!shown.length) { board.appendChild(el('div', { class: 'empty', text: _sh.bar ? 'Tous les mémos sont masqués.' : 'Aucun mémo ici.' })); return; }
  // [CARD-COVER] bascule « Immersif / Compact », persistée par dossier ouvert. Défaut = Compact.
  {
    const cov = coverToggleBar({
      storageKey: hubCoverKey(),
      hasPhotos: shown.some(m => (m.images || []).length),
      onChange: render,
    });
    if (cov.bar) board.appendChild(cov.bar);
  }
  // [SUBHIDE-V2] « ⤓ Aller en bas » (helper partagé) hors du cadre Sous-dossiers, même seuil que
  // le owner (> 8 mémos affichés) ; pendant ⤒ après la dernière card.
  if (shown.length > 8) board.appendChild(memoJumpBar('down'));
  shown.forEach(m => board.appendChild(memoCard(m)));
  if (shown.length > 8) board.appendChild(memoJumpBar('up'));
}

// [GUEST-ROLES] dossiers où l'invité peut AJOUTER (contributeur+) — pilote les barres d'ajout.
function editableProjects() { return (DATA.projects || []).filter(p => p.can_add); }
/* [TOOLS-DOCK-GUEST] Dock d'outils repliables du hub — parité avec le dock owner
   ([TOOLS-DOCK] V27.1.154) et la page share. Une icône n'apparaît QUE si l'outil est DÉJÀ
   disponible pour ce rôle : le dock AFFICHE ou MASQUE, il n'élargit JAMAIS un droit
   (invariant 5). Persistance par focus (`toolsDock:hub:<focus>`), tout replié par défaut. */
function hubDockKey() { return 'toolsDock:hub:' + (FOCUS == null ? 'all' : FOCUS); }
function hubDockState() {
  const st = { memo: false, file: false, voice: false, folder: false };
  try {
    const raw = JSON.parse(localStorage.getItem(hubDockKey()) || '{}');
    Object.keys(st).forEach(k => { st[k] = raw[k] === true; });
  } catch (e) {}
  return st;
}
function setHubDock(key, val) {
  const st = hubDockState();
  st[key] = !!val;
  try { localStorage.setItem(hubDockKey(), JSON.stringify(st)); } catch (e) {}
}
let hubDockFocusMemo = false;   // focus du champ titre à l'ouverture de l'outil Mémo
// Construit le dock : `avail` = outils réellement disponibles ; `host` = barre d'actions du
// dossier (dock à droite, même rangée) ou null → le caller pose le dock seul, aligné à droite.
function hubToolsDock(avail) {
  const keys = [
    ['memo', 'pencil-plus', 'Mémo', 'Afficher/masquer la barre de création de mémo'],
    ['file', 'paperclip', 'Fichier', 'Afficher/masquer la zone de dépôt de fichiers'],
    ['voice', 'microphone', 'Vocal', 'Afficher/masquer l\'enregistrement vocal'],
    ['folder', 'folder-plus', 'Dossier', 'Afficher/masquer la création de sous-dossier'],
  ].filter(([k]) => avail[k]);
  if (!keys.length) return null;            // lecture seule → aucun dock
  const st = hubDockState();
  const td = hdrToolbar();
  keys.forEach(([k, icon, label, title]) => {
    const b = td.add({ icon, label, title, onClick: () => {
      const next = !st[k];
      if (k === 'memo' && next) hubDockFocusMemo = true;
      setHubDock(k, next); render();
    } });
    if (st[k]) b.classList.add('on');
    b.setAttribute('aria-pressed', st[k] ? 'true' : 'false');
  });
  return td.end();
}

// [GUEST-SUBPROJECT] création de sous-projet depuis le hub (parité share.html) :
// routée vers le POST /share/<share_token>/projects du dossier PARENT choisi —
// revalidé serveur (scope du partage + can_edit + invité approuvé), zéro route
// nouvelle (invariant 5). parent_id = le projet choisi (le serveur ne l'accepte
// que dans les descendants du partage).
function subProjBar() {
  const eps = editableProjects();
  if (!eps.length) return null;
  const bar = el('div', { class: 'addbar' });
  const inp = el('input', { attrs: { type: 'text', placeholder: '+ Nouveau sous-projet (nom)…' } });
  const sel = el('select', { attrs: { title: 'Dossier parent du sous-projet' } });
  // [GUEST-ADD-BAR] nom SEUL (plus de préfixe « dans … ») — même libellé que le sélecteur mémo.
  eps.forEach(p => sel.appendChild(el('option', { attrs: { value: p.id }, text: (p.emoji ? p.emoji + ' ' : '') + p.name })));
  if (FOCUS != null && eps.some(p => p.id === FOCUS)) sel.value = String(FOCUS);
  const add = async () => {
    const name = inp.value.trim(); if (!name) return;
    const pid = Number(sel.value); const proj = projById(pid); if (!proj) return;
    const r = await api(proj.share_token, '/projects', { method: 'POST', body: JSON.stringify({ name, parent_id: pid }) });
    if (r.ok) { inp.value = ''; await reload(); }
    else { const e = await r.json().catch(() => ({})); notify(e.error || 'Création impossible', { error: true }); }
  };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
  // [GUEST-ADD-BAR] « Créer » : icône dossier TRAIT (hdrIcon du partial, currentColor — zéro asset
  // nouveau) au lieu de l'emoji 📁, et bouton en Luciole NEUTRE (l'ajout de mémo garde l'accent).
  const mkBtn = el('button', { class: 'btn' });
  const ic = hdrIcon('folder'); ic.setAttribute('width', '16'); ic.setAttribute('height', '16');
  mkBtn.append(ic, document.createTextNode('Créer'));
  mkBtn.addEventListener('click', add);
  lucioleize(mkBtn, 'luc-neutral');
  bar.append(inp, sel, mkBtn);
  return bar;
}

// [GUEST-ADD-BAR] barre mémo du hub = helper partagé guestMemoAddBar (parité owner [ADD-BAR-V2]).
// Construite UNE fois puis ré-attachée à chaque render (le board est vidé au poll 15 s : réutiliser
// l'élément préserve la saisie, le repli et la priorité choisie). Écriture : POST /share/<token>/memos
// EXISTANT du partage du dossier choisi, puis PUT /share/<token>/memo/<id> EXISTANT pour les
// métadonnées — zéro route nouvelle, scope + rôle revalidés serveur (invariant 5).
let hubAddBarEl = null;
function addBar() {
  const eps = editableProjects();
  if (!eps.length) {
    const bar = el('div', { class: 'addbar' });
    bar.appendChild(el('span', { attrs: { style: 'color:var(--muted);font-size:0.85rem' }, text: 'Aucun dossier modifiable — lecture seule.' }));
    return bar;
  }
  const folders = eps.map(p => ({
    value: p.id,
    label: (p.emoji ? p.emoji + ' ' : '') + p.name,   // nom SEUL, comme le sélecteur de sous-dossier
    selected: FOCUS != null && p.id === FOCUS,
  }));
  if (hubAddBarEl) { hubAddBarEl.updateFolders(folders); return hubAddBarEl; }
  hubAddBarEl = guestMemoAddBar({
    storageKey: 'hubAddDetailsOpen',
    placeholder: '+ Titre du nouveau mémo… (Entrée)',
    folders,
    priorities: DATA.priorities || [],
    allowMeta: true,   // [GUEST-ROLES] pouvoir créer (contributeur+) ⇒ pouvoir éditer SON mémo
    onCreate: async ({ title, projectValue, meta }) => {
      const pid = Number(projectValue); const proj = projById(pid);
      if (!proj) return false;
      const r = await api(proj.share_token, '/memos', { method: 'POST', body: JSON.stringify({ title, project_id: pid }) });
      if (!r.ok) { const e = await r.json().catch(() => ({})); notify(e.error || 'échec', { error: true }); return false; }
      const m = await r.json().catch(() => null);
      if (m && m.id && Object.keys(meta).length) {
        await api(proj.share_token, '/memo/' + m.id, { method: 'PUT', body: JSON.stringify(meta) });
      }
      await reload();
      return true;
    },
  });
  return hubAddBarEl;
}

function renderPlan() {
  const board = document.getElementById('board'); board.innerHTML = '';
  board.appendChild(addBar());
  const spb = subProjBar(); if (spb) board.appendChild(spb); // [GUEST-SUBPROJECT]
  const roots = (DATA.projects || []).filter(p => p.parent_id == null);
  const wrap = el('div');
  const memosOf = (pid) => focusedMemos().filter(m => m.project_id === pid);
  const node = (p, anc, last) => {
    const row = el('div', { class: 'tree-row tree-proj' });
    row.appendChild(el('span', { class: 'tree-pre', text: treeConnector(anc, last) }));
    if (p.emoji) row.appendChild(el('span', { text: p.emoji }));
    row.appendChild(el('span', { class: 'nm', text: p.name }));
    if (!p.can_edit) row.appendChild(el('span', { class: 'ro', attrs: { style: 'color:var(--muted);font-size:0.7rem' }, text: '👁' }));
    row.addEventListener('click', () => hubFocusOn(p.id));
    wrap.appendChild(row);
    const kids = projChildren(p.id), mm = memosOf(p.id);
    const items = [...mm.map(m => ({ m })), ...kids.map(c => ({ c }))];
    items.forEach((it, i) => { const l = i === items.length - 1;
      if (it.m) { const r = el('div', { class: 'tree-row tree-memo' }); r.appendChild(el('span', { class: 'tree-pre', text: treeConnector([...anc, last], l) }));
        r.appendChild(el('span', { text: it.m.done ? '✓ ' : '' })); r.appendChild(el('span', { class: 'nm', text: it.m.title || stripTags(it.m.content).slice(0, 60) || MEMO_EMPTY_LABEL }));
        r.addEventListener('click', () => openEditor(it.m)); wrap.appendChild(r); }
      else node(it.c, [...anc, last], l);
    });
  };
  if (!roots.length) wrap.appendChild(el('div', { class: 'empty', text: 'Aucun dossier.' }));
  roots.forEach((p, i) => node(p, [], i === roots.length - 1));
  board.appendChild(wrap);
}

/* ── [AGENDA] vue calendrier mensuelle du hub — grille CSS maison (invariant 6),
   scopée à focusedMemos() (union des dossiers, FOCUS + recherche). D&D par mémo
   seulement si m.can_edit → putMemo(m, {due_date}) routé sur SON share_token
   (revalidé serveur — invariant 5). due_time conservé (PUT partiel). Mois affiché
   non persisté (spec), conservé au re-render. Mobile ≤900px : liste, pas de D&D. ── */
let agendaYM = null, agendaSelDay = null, agendaDragMemo = null;
// [AGENDA-PROJECT] filtre dossier + descendants (indépendant de FOCUS, non persisté).
// null = agenda GLOBAL (union de tous les dossiers de l'invité).
let hubAgendaFilter = null;
let agendaDropGuard = 0;  // [AGENDA-DAY-POPIN] anti clic-fantôme après un drop (D7)

// Périmètre courant de l'agenda hub (source unique grille + pop-in jour ; inclut la recherche).
function hubAgendaSrc() {
  let src = (DATA.memos || []).filter(m => !m.done && m.due_date);
  src = hubMemoFilter(src);   // [SEARCH-SHARED] même filtre que le board (portées incluses)
  if (hubAgendaFilter != null) {
    const fp = projById(hubAgendaFilter);
    if (fp) { const set = new Set([hubAgendaFilter, ...projDescendants(hubAgendaFilter)]); src = src.filter(m => set.has(m.project_id)); }
  }
  return src;
}

// [AGENDA-DAY-POPIN] config pop-in jour (hub). createForDay = création EXISTANTE sur un dossier
// éditable (FOCUS si éditable, sinon le 1er) puis pose de la date via l'éditeur, gatée par le rôle.
function hubAgendaCfg() {
  return {
    memosForDay: (iso) => agendaGroupByDay(hubAgendaSrc())[iso] || [],
    chipColor: agendaChipColor,
    memoTitle: agendaMemoTitle,
    // [POLISH-VIEWER-AGENDA-PRIO] clic = fiche de lecture 👁 (droits appliqués par la fiche).
    openMemo: (m) => openMemoView(hubMemoViewCfg(), m.id),
    canCreate: () => editableProjects().length > 0,
    createForDay: async (iso) => {
      const eps = editableProjects();
      if (!eps.length) return;
      const target = (FOCUS != null && eps.find(p => p.id === FOCUS)) || eps[0];
      const r = await api(target.share_token, '/memos', { method: 'POST', body: JSON.stringify({ title: 'Nouveau mémo', project_id: target.id }) });
      if (!r.ok) { const e = await r.json().catch(() => ({})); notify(e.error || 'Création impossible', { error: true }); return; }
      const m = await r.json();
      await api(target.share_token, '/memo/' + m.id, { method: 'PUT', body: JSON.stringify({ due_date: iso }) });
      await reload();
      const fresh = (DATA.memos || []).find(x => x.id === m.id);
      if (fresh) openEditor(fresh);
    },
    onNav: (iso) => { const [y, mo] = iso.split('-').map(Number); if (!agendaYM || agendaYM.y !== y || agendaYM.m !== mo - 1) { agendaYM = { y, m: mo - 1 }; renderAgendaHub(); } },
  };
}

function agendaChipColor(m) {
  const p = prioOf(m.priority);
  if (p && p.color) return p.color;
  const proj = projById(m.project_id);
  return usableProjColor(proj && proj.color) || DATA.marker_color || '#e53935';
}

function agendaMemoTitle(m) {
  return (m.emoji ? m.emoji + ' ' : '') + (m.title || stripTags(m.content).slice(0, 40) || MEMO_EMPTY_LABEL);
}

function agendaRow(m) {
  const row = el('div', { class: 'ag-row', on: { click: () => openEditor(m) } });
  row.appendChild(el('span', { class: 'ag-time', text: m.due_time ? fmtMemoTime(m.due_time) : '—' }));
  const dot = el('span', { class: 'ag-dot' });
  dot.style.background = agendaChipColor(m);
  row.appendChild(dot);
  row.appendChild(el('span', { class: 'ag-t', text: agendaMemoTitle(m), attrs: { title: agendaMemoTitle(m) } }));
  if (!m.can_edit) row.appendChild(el('span', { class: 'ro', text: '👁' }));
  return row;
}

function renderAgendaHub() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  agendaDayRefresh();  // [AGENDA-DAY-POPIN] pop-in jour ouverte (drill-down) → re-render frais
  const today = agendaTodayIso();
  if (!agendaYM) { const d = new Date(); agendaYM = { y: d.getFullYear(), m: d.getMonth() }; }
  // [AGENDA-DAY-POPIN] plus d'agendaSelDay : la pop-in jour remplace le panneau.
  // [AGENDA-PROJECT] base = UNION des dossiers (pas FOCUS) + recherche ; le filtre
  // dossier explicite (bouton 📆 du board) restreint à dossier + descendants.
  let src = (DATA.memos || []).filter(m => !m.done && m.due_date);
  src = hubMemoFilter(src);   // [SEARCH-SHARED] même filtre que le board (portées incluses)
  let filterProj = null;
  if (hubAgendaFilter != null) {
    filterProj = projById(hubAgendaFilter);
    if (!filterProj) hubAgendaFilter = null;
    else {
      const set = new Set([hubAgendaFilter, ...projDescendants(hubAgendaFilter)]);
      src = src.filter(m => set.has(m.project_id));
    }
  }
  const byDay = agendaGroupByDay(src);

  const head = el('div', { class: 'ag-head' });
  head.appendChild(el('h2', {
    text: '📆 ' + agendaMonthLabel(agendaYM.y, agendaYM.m)
      + (filterProj ? ' — ' + (filterProj.emoji ? filterProj.emoji + ' ' : '') + filterProj.name : ''),
  }));
  if (filterProj) {
    head.appendChild(el('button', {
      class: 'btn', text: '× tout l\'agenda',
      attrs: { title: 'Retirer le filtre dossier — revenir à l\'agenda de tous vos dossiers' },
      on: { click: () => { hubAgendaFilter = null; renderAgendaHub(); } },
    }));
  }
  const nav = el('div', { class: 'ag-nav' });
  const shift = (d) => { const n = new Date(agendaYM.y, agendaYM.m + d, 1); agendaYM = { y: n.getFullYear(), m: n.getMonth() }; renderAgendaHub(); };
  nav.appendChild(el('button', { class: 'btn', text: '‹', attrs: { title: 'Mois précédent' }, on: { click: () => shift(-1) } }));
  nav.appendChild(el('button', { class: 'btn', text: 'Aujourd\'hui', on: { click: () => { const d = new Date(); agendaYM = { y: d.getFullYear(), m: d.getMonth() }; agendaSelDay = today; renderAgendaHub(); } } }));
  nav.appendChild(el('button', { class: 'btn', text: '›', attrs: { title: 'Mois suivant' }, on: { click: () => shift(1) } }));
  head.appendChild(nav);
  board.appendChild(head);

  // Mobile : liste par jour (jours avec mémos seulement), pas de grille ni D&D.
  if (window.matchMedia('(max-width: 760px)').matches) {
    const prefix = agendaYM.y + '-' + String(agendaYM.m + 1).padStart(2, '0');
    const days = Object.keys(byDay).filter(iso => iso.startsWith(prefix)).sort();
    if (!days.length) { board.appendChild(el('div', { class: 'ag-empty', text: 'Aucun mémo daté ce mois-ci.' })); return; }
    days.forEach(iso => {
      const sec = el('div', { class: 'ag-day-panel' });
      const h = el('h3', { text: agendaShortDayLabel(iso) + ' — ' + byDay[iso].length + ' mémo' + (byDay[iso].length > 1 ? 's' : ''), attrs: { role: 'button', tabindex: '0', title: 'Ouvrir ce jour' } });
      h.style.cursor = 'pointer';
      h.addEventListener('click', () => openAgendaDay(hubAgendaCfg(), iso));  // [AGENDA-DAY-POPIN] en-tête tappable
      h.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openAgendaDay(hubAgendaCfg(), iso); } });
      sec.appendChild(h);
      byDay[iso].forEach(m => sec.appendChild(agendaRow(m)));
      board.appendChild(sec);
    });
    return;
  }

  const grid = el('div', { class: 'ag-grid' });
  AGENDA_DOW.forEach(d => grid.appendChild(el('div', { class: 'ag-dow', text: d })));
  agendaMonthMatrix(agendaYM.y, agendaYM.m).forEach(week => week.forEach(c => {
    const cell = el('div', {
      class: 'ag-cell' + (c.inMonth ? '' : ' out') + (c.iso === today ? ' today' : ''),
    });
    cell.appendChild(el('span', { class: 'ag-num', text: String(c.day) }));
    const list = byDay[c.iso] || [];
    list.slice(0, 3).forEach(m => {
      const label = agendaMemoTitle(m);
      const chip = el('div', { class: 'ag-chip', attrs: { title: label + (m.due_time ? ' · ' + fmtMemoTime(m.due_time) : '') } });
      const dot = el('span', { class: 'ag-dot' });
      dot.style.background = agendaChipColor(m);
      chip.append(dot, el('span', { class: 'ag-t', text: label }));
      if (m.can_edit) { // lecture seule = chips non draggables
        chip.setAttribute('draggable', 'true');
        chip.addEventListener('dragstart', (e) => { e.stopPropagation(); agendaDragMemo = m; e.dataTransfer.effectAllowed = 'move'; });
        chip.addEventListener('dragend', () => { agendaDragMemo = null; });
      }
      chip.addEventListener('click', (e) => { e.stopPropagation(); openEditor(m); });  // chip → éditeur (conservé)
      cell.appendChild(chip);
    });
    // [AGENDA-DAY-POPIN] « +N » = vrai bouton → pop-in du jour.
    if (list.length > 3) cell.appendChild(el('button', { class: 'ag-more', text: '+' + (list.length - 3), attrs: { type: 'button', title: 'Voir les ' + list.length + ' mémos du jour' }, on: { click: (e) => { e.stopPropagation(); openAgendaDay(hubAgendaCfg(), c.iso); } } }));
    if (c.inMonth) {
      cell.addEventListener('click', () => { if (agendaDragMemo || Date.now() < agendaDropGuard) return; openAgendaDay(hubAgendaCfg(), c.iso); });
      cell.addEventListener('dragover', (e) => { if (!agendaDragMemo) return; e.preventDefault(); cell.classList.add('droptarget'); });
      cell.addEventListener('dragleave', () => cell.classList.remove('droptarget'));
      cell.addEventListener('drop', async (e) => {
        e.preventDefault();
        cell.classList.remove('droptarget');
        if (!agendaDragMemo) return;
        const m = agendaDragMemo;
        agendaDragMemo = null;
        agendaDropGuard = Date.now() + 400;  // anti clic fantôme post-drop
        await putMemo(m, { due_date: c.iso }); // reload() → re-render (VIEW conservé)
      });
    }

// En-tête contextuel [MEMO-CONTEXT] : fil d'Ariane scopé + droit (lecture/édition).
function renderEdContext(m) {
  const box = document.getElementById('ed-context'); box.innerHTML = '';
  const byId = {}; (DATA.projects || []).forEach(p => { byId[p.id] = p; });
  const chain = []; let cur = m.project_id, g = 0;
  while (cur != null && byId[cur] && g++ < 50) { chain.push(byId[cur]); cur = byId[cur].parent_id; }
  chain.reverse();
  const crumb = el('div', { class: 'me-crumb' });
  crumb.appendChild(el('span', { class: 'me-sep', text: '📌' }));
  if (!chain.length) crumb.appendChild(el('span', { class: 'me-crumb-node', text: '📥 Inbox' }));
  else chain.forEach((p, i) => { if (i) crumb.appendChild(el('span', { class: 'me-sep', text: '›' }));
    crumb.appendChild(el('span', { class: 'me-crumb-node', text: (p.emoji ? p.emoji + ' ' : '') + p.name })); });
  crumb.appendChild(el('span', { class: 'me-sep', text: m.can_edit ? '· ✏️ modifiable' : '· 🔒 lecture seule' }));
  box.appendChild(crumb);
}

// [MEMO-VIEW] cfg hub : données de `DATA` (déjà bornées au scope) ; un mémo hors scope → null.
function hubMemoViewCfg() {
  return {
    load: (id) => {
      const m = (DATA.memos || []).find(x => x.id === id);
      if (!m) return null;
      const chain = [];
      let pid = m.project_id;
      const seen = new Set();
      while (pid != null && !seen.has(pid)) {
        seen.add(pid);
        const p = projById(pid);
        if (!p) break;
        chain.unshift({ emoji: p.emoji, color: usableProjColor(p.color), name: p.name });
        pid = p.parent_id;
      }
      const created = m.created_at ? new Date(m.created_at) : null;
      const fmt = (d) => d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' })
        + ' à ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
      const due = dueInfo(m);
      let node = null;
      if (isRich(m.content)) { node = el('div', {}); node.appendChild(sanitize(m.content)); }
      else if ((m.content || '').trim()) { node = el('div', { attrs: { style: 'white-space:pre-wrap' } }); node.appendChild(linkify(m.content)); }
      if (node) dressLinks(node);   // [LINK-RENDER] fiche de lecture
      return {
        memo: m,
        title: m.title || memoLeadText(isRich(m.content) ? splitLeadHtml(m.content).lead : stripTags(m.content || '').trim()) || MEMO_EMPTY_LABEL,
        crumb: chain,
        createdLine: created && !isNaN(created) ? '🕒 Créé le ' + fmt(created) : '',
        updatedLine: '',
        canEdit: !!m.can_edit,
        prio: (DATA.priorities || []).find(x => x.id === m.priority) || null,
        dueLabel: due ? due.label : '',
        locLabel: m.location && m.location.label ? m.location.label : '',
        links: m.links || [],
        images: m.images || [],
        subtasks: m.subtasks || [],
        contentNode: node,
      };
    },
    onEdit: (m) => openEditor(m),
    // [MEMO-VIEW évolution] même appel que la card du hub (PUT sur le partage du mémo, scope
    // et rôle revalidés serveur) ; `reload()` rafraîchit les cards derrière.
    onToggleSub: (m, subtasks) => putMemo(m, { subtasks }),
    // [MEMO-VIEW correctif 2] checklist du CONTENU : même bascule que `wireChecklist` des cards.
    onToggleCheck: (m, i) => {
      // ⚠️ mémo relu FRAIS : la fiche n'est pas redessinée après une écriture, `m` serait périmé.
      const cur = (DATA.memos || []).find(x => x.id === m.id) || m;
      const tpl = document.createElement('template');
      tpl.innerHTML = cur.content;
      const items = tpl.content.querySelectorAll('li[data-list="checked"], li[data-list="unchecked"]');
      if (!items[i]) return;
      items[i].setAttribute('data-list', items[i].getAttribute('data-list') === 'checked' ? 'unchecked' : 'checked');
      putMemo(cur, { content: tpl.innerHTML });
    },
    // Les URL d'image sont scopées au partage DU mémo affiché (chaque dossier du hub a son token).
    imageUrl: (n, m) => '/share/' + m.share_token + '/image/' + n,
    onOpenPhoto: (images, i, m) => runImageViewer({
      images, startIndex: i,
      imageUrl: (n) => '/share/' + m.share_token + '/image/' + n,
      downloadUrl: (n) => '/share/' + m.share_token + '/image/' + n,
      exifUrl: (n) => '/share/' + m.share_token + '/image-exif/' + n,
    }),
  };
}

function hubMapPoints() {
  const pts = [];
  focusedMemos().forEach(m => { if (m.location && typeof m.location.lat === 'number') pts.push({ kind: 'memo', id: m.id, lat: m.location.lat, lng: m.location.lng, placeLabel: m.location.label || '', sub: (m.title || stripTags(m.content).slice(0, 40)), project_id: m.project_id, groups: m.map_groups || [], color: (prioOf(m.priority) || {}).color || '',
    due_date: m.due_date || '', due_time: m.due_time || '', trip: hubTripOf(m.project_id),
    imgUrl: imgSize((m.images && m.images.length) ? '/share/' + m.share_token + '/image/' + m.images[0] : '', 't') }); }); // [MAP-TIMELINE][MAP-TRIP-POLISH]
  (DATA.projects || []).forEach(p => { if (p.location && typeof p.location.lat === 'number') pts.push({ kind: 'project', id: p.id, lat: p.location.lat, lng: p.location.lng, placeLabel: p.location.label || '', sub: p.name, project_id: p.id, groups: [], color: usableProjColor(p.color) || '' }); });
  return pts;
}

// [MAP-TIMELINE] Mémos DATÉS du même périmètre (GPS OU NON) pour la frise.
function hubDatedPoints() {
  return focusedMemos().filter(m => m.due_date).map(m => ({
    kind: 'memo', id: m.id, project_id: m.project_id || null, groups: m.map_groups || [],
    title: (m.emoji ? m.emoji + ' ' : '') + (m.title || stripTags(m.content).slice(0, 40) || MEMO_EMPTY_LABEL),
    due_date: m.due_date, due_end: m.due_end || '', due_time: m.due_time || '',  // [MEMO-DATE-RANGE]
    lat: (m.location && typeof m.location.lat === 'number') ? m.location.lat : null,
    lng: (m.location && typeof m.location.lat === 'number') ? m.location.lng : null,
    trip: hubTripOf(m.project_id),
    imgUrl: imgSize((m.images && m.images.length) ? '/share/' + m.share_token + '/image/' + m.images[0] : '', 't'), // [MAP-TRIP-POLISH]
  }));
}
// [VOTE-MAP] Scrutins du dossier focus (hub). Voter routé vers le /share/<share_token> du
// porteur (invité approuvé côté serveur). null si pas de FOCUS ou aucun scrutin.
function buildHubMapVoteData() {
  if (FOCUS == null) return null;
  const proj = projById(FOCUS);
  if (!proj) return null;
  // [VOTE-MAP-SUBPROJECT] agrège le dossier focalisé + ses descendants (scope du token du parent) →
  // le vote d'un sous-projet apparaît sur la carte du parent focalisé côté hub.
  const descIds = projDescendants(FOCUS) || [];
  const order = [proj, ...descIds.map(id => projById(id)).filter(Boolean)];
  let scrutins = [];
  order.forEach((p, i) => { scrutins = scrutins.concat(voteScrutinsForProject(p, DATA.memos, i === 0 ? '' : (p.emoji ? p.emoji + ' ' : '') + p.name)); });
  if (!scrutins.length) return null;
  const token = proj.share_token;
  return {
    scrutins,
    voteKey: 'hubMapVotesOn:' + HUB_TOKEN + ':' + proj.id,
    onVote: token ? (async (memoId, sid) => {
      const r = await api(token, '/memo/' + memoId + '/vote', { method: 'POST', body: JSON.stringify(sid == null ? {} : { vote_id: sid }) });
      if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error || ('HTTP ' + r.status)); }
      const d = await r.json();
      if (sid == null) {
        const opt = {}; (d.options || []).forEach(o => { opt[o.memo_id] = { count: o.vote_count, mine: !!o.vote_mine, is_winner: !!o.is_winner }; const m = (DATA.memos || []).find(x => x.id === o.memo_id); if (m) { m.vote_count = o.vote_count; m.vote_mine = o.vote_mine; m.is_winner = o.is_winner; } });
        return { state: d.vote.vote_state, winner_ids: (d.vote.vote_winner_ids || []).slice(), opt };
      }
      const v = d.vote; const opt = {}; (v.options || []).forEach(o => opt[o.memo_id] = { count: o.vote_count, mine: !!o.vote_mine, is_winner: !!o.is_winner });
      const owner = (DATA.projects || []).find(p => (p.votes || []).some(x => x.id === v.id));  // porteur (focalisé OU descendant)
      if (owner) owner.votes = owner.votes.map(x => x.id === v.id ? v : x);
      return { state: v.vote_state, winner_ids: (v.vote_winner_ids || []).slice(), opt };
    }) : null,
  };
}

document.getElementById('btn-map').addEventListener('click', () => {
  if (typeof L === 'undefined') { notify('Carte indisponible.', { error: true }); return; }
  runMapDialog({ title: DATA.name || 'Mes dossiers', points: hubMapPoints(), recompute: hubMapPoints, editable: false,
    projects: DATA.projects || [], currentProjectId: FOCUS == null ? 'all' : FOCUS, subFilterScope: FOCUS != null,
    defaultMarkerColor: DATA.marker_color, focusKey: 'hubMapFocus:' + HUB_TOKEN, subKey: 'hubMapSub:' + HUB_TOKEN,
    winnerIds: voteWinnerIdSet(FOCUS == null ? null : projById(FOCUS)),  // [VOTE-DECISION]
    voteData: buildHubMapVoteData(),  // [VOTE-MAP]
    datedPoints: hubDatedPoints, timelineKey: 'hubMapTimeline:' + HUB_TOKEN }); // [MAP-TIMELINE]
});
// [HUB-MAP-CLOSE] Le partial runMapDialog ne câble pas #map-close (chaque page le fait, cf.
// index.html/share.html). Fermer + détruire l'instance Leaflet (clic, Échap ou backdrop) →
// pas de .leaflet-container orphelin ni d'empilement à la réouverture.
const mapDialog = document.getElementById('map-dialog');
const closeHubMap = () => mapDialog.close();
document.getElementById('map-close').addEventListener('click', closeHubMap);
// [MAP-CLOSE-UX] ✕ sticky en haut = même fermeture que le Fermer du pied.
document.getElementById('map-close-top').addEventListener('click', closeHubMap);
mapDialog.addEventListener('close', () => { if (activeMap) { activeMap.remove(); activeMap = null; } });
// [LUCIOLE-SWEEP] parité avec les pieds owner/share : UNE seule `.luc-primary` par pop-in.
// `#pin-btn` (formulaire d'accès) garde son `width:100%` inline. Non convertis (doctrine) :
// #notify-dialog, `.btn.danger` (🗑 Corbeille), les toggles de vue Plan/Agenda (classe `primary`
// pilotée par `syncViewBtns`), chips `.prio-btn`, `.hdr-btn`.
[
  ['pin-btn', 'luc-primary'],     // formulaire PIN — première impression invitée
  ['ed-save', 'luc-primary'],     // #ed « Enregistrer »
  ['ed-cancel', 'luc-neutral'],
  ['map-close', 'luc-neutral'],   // le ✕ reste le geste principal
].forEach(([id, variant]) => lucioleize(document.getElementById(id), variant));
// [AGENDA] deux toggles de vue exclusifs (Plan / Agenda) — la classe primary suit VIEW.
function syncViewBtns() {
  document.getElementById('btn-plan').classList.toggle('primary', VIEW === 'plan');
  document.getElementById('btn-agenda').classList.toggle('primary', VIEW === 'agenda');
}
document.getElementById('btn-plan').addEventListener('click', () => { VIEW = VIEW === 'plan' ? 'board' : 'plan'; syncViewBtns(); render(); });
// [AGENDA-PROJECT] le bouton header = agenda GLOBAL (union) : efface le filtre dossier
// et [AGENDA-SMART-MONTH] ouvre toujours sur le mois courant.
document.getElementById('btn-agenda').addEventListener('click', () => { hubAgendaFilter = null; agendaYM = null; agendaSelDay = null; VIEW = VIEW === 'agenda' ? 'board' : 'agenda'; syncViewBtns(); render(); });
function hubRefreshSearch() {
  if (!hubSearch().q) hubSearchWide = false;   // vider la recherche remet la portée par défaut
  if (hubSearchUI) hubSearchUI.refreshHelp();
  if (VIEW === 'plan') renderPlan(); else if (VIEW === 'agenda') renderAgendaHub(); else renderBoard();
}
document.getElementById('search').addEventListener('input', hubRefreshSearch);
document.getElementById('search').addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { e.target.value = ''; hubRefreshSearch(); e.target.blur(); }
});
// [SEARCH-SHARED] composant partagé : aide des raccourcis (desktop) + feuille de recherche
// (mobile) avec portées, aide et résultats en direct. Les résultats sont ceux que la page
// affiche déjà — jamais un mémo hors du périmètre du hub (invariant 5, le serveur borne /data).
const hubSearchUI = attachSearchUI({
  input: document.getElementById('search'),
  anchor: document.getElementById('search'),
  placeholder: 'Rechercher… (p# dossiers)',
  helpRows: [
    { k: 'p#', fill: 'p#', d: 'Chercher un <b>dossier</b> — <i>p#japon</i>' },
    { k: 'm#', fill: 'm#', d: 'Chercher dans les <b>mémos</b> — <i>m#hôtel</i>' },
  ],
  helpFoot: [['Échap', 'efface et ferme']],
  scopeNote: () => {
    const p = FOCUS != null ? projById(FOCUS) : null;
    return p ? 'Dans « ' + p.name +' », la recherche y reste bornée — le chip du dossier élargit à tous tes dossiers.' : '';
  },
  scopes: () => ([{ key: 'all', label: 'Tout' }, { key: 'memos', label: 'Mémos' }, { key: 'projects', label: 'Dossiers' }]),
  folderChip: () => {
    const p = FOCUS != null ? projById(FOCUS) : null;
    if (!p) return null;
    // [SEARCH-MOBILE-HEADER] allumé dès l'ouverture (indépendant de la requête) — cf. owner.
    return { label: (p.emoji || '📁') + ' ' + p.name, active: !hubSearchWide,
      onToggle: () => { hubSearchWide = !hubSearchWide; hubRefreshSearch(); } };
  },
  getQuery: () => hubSearchRaw(),
  setQuery: () => {},   // la valeur vit dans le champ inline, que le composant tient à jour
  getScope: () => hubSearchScope,
  setScope: (v) => { hubSearchScope = v; },
  results: () => {
    const { scope, q } = hubSearch();
    if (!q) return [];
    const label = (id) => { const p = projById(id); return p ? ((p.emoji ? p.emoji + ' ' : '') + p.name) : ''; };
    if (scope === 'projects') {
      return hubMatchingProjects(q).map(p => ({ emoji: p.emoji || '📁', title: p.name, sub: 'Dossier',
        onOpen: () => { FOCUS = p.id; VIEW = 'board'; syncViewBtns(); render(); } }));
    }
    return focusedMemos().map(m => ({ emoji: m.emoji || '📝',
      title: m.title || stripTags(m.content).slice(0, 80) || '(sans titre)',
      sub: label(m.project_id), onOpen: () => openEditor(m) }));
  },
  onChange: () => hubRefreshSearch(),
});

// ── init : toujours tenter /data — cookie de session HttpOnly OU header localStorage
// ([HUB-SESSION]) ; loadDash affiche l'écran code sur 403 (comportement inchangé sans session).
_dangerSoftStyle();   // [DANGER-SOFT] feuille du danger discret posée dès le boot (helper partagé)
// [DANGER-SOFT] pied de l'éditeur invité : l'emoji 🗑 laisse place à l'icône trait `trash`.
{ const _edDel = document.getElementById('ed-del'); if (_edDel) _edDel.insertBefore(hdrIconAt('trash', 15), _edDel.firstChild); }
(function init() { loadDash(); })();
</script>

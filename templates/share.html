<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Partage — Dashboard</title>
<link rel="icon" type="image/svg+xml" href="/share/assets/favicon.svg">
<!-- [PWA] manifest invité GÉNÉRÉ (start_url = ce partage ; pas de share_target ; invariant 5).
     crossorigin=use-credentials inoffensif ici (route /share/* publique, hors Authelia). [PWA-MANIFEST-AUTH] -->
<link rel="manifest" href="/share/{{ share_token }}/manifest.webmanifest" crossorigin="use-credentials">
<meta name="theme-color" content="#0e1217">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Partage">
<link rel="apple-touch-icon" href="/share/assets/apple-touch-icon.png">
<link rel="stylesheet" href="/share/assets/quill.snow.css">
<script src="/share/assets/quill.min.js" defer></script>
<!-- [MEMO-TABLES] tableaux dans l'éditeur (quill-table-better 1.2.3, vendorisé) ; chargé
     APRÈS quill.min.js. Absent => QuillTableBetter undefined => dégradation propre. -->
<link rel="stylesheet" href="/share/assets/quill-table-better.css">
<script src="/share/assets/quill-table-better.js" defer></script>
<link rel="stylesheet" href="/share/assets/leaflet.css">
<script src="/share/assets/leaflet.js" defer></script>
<!-- [PHOTO-CLUSTER] plugin clustering (invité, whitelist SHARE_ASSETS) ; après leaflet.js. -->
<link rel="stylesheet" href="/share/assets/MarkerCluster.css">
<link rel="stylesheet" href="/share/assets/MarkerCluster.Default.css">
<script src="/share/assets/leaflet.markercluster.js" defer></script>
<script src="/share/assets/gsap.min.js" defer></script>
<style>
:root {
  --bg: #0e1217; --panel: #161d25; --panel-2: #212b35; --text: #e8eef5;
  --muted: #9aa7b4; --accent: #4fc3f7; --accent-2: #38aee0; --green: #4caf50; --border: #283340; --border-strong: #3a4655;
  --danger: #ff8a80; --warn: #ffb74d; --guest: #b39ddb; --assignee: #80cbc4;
  --bg-elev: #1c2530; --radius: 10px; --radius-sm: 6px;
  --shadow: 0 1px 2px rgba(0,0,0,0.25), 0 2px 8px rgba(0,0,0,0.18);
  --shadow-lg: 0 8px 28px rgba(0,0,0,0.4);
  --ring: 0 0 0 3px rgba(79,195,247,0.22);
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
}
:root[data-theme="light"] {
  --bg: #eef1f5; --panel: #ffffff; --panel-2: #eef2f7; --text: #1b2531;
  --muted: #5c6b7a; --accent: #0288d1; --accent-2: #0277bd; --green: #2e7d32; --border: #d3dce5; --border-strong: #b3c0cf;
  --danger: #e53935; --warn: #ef6c00; --guest: #6a3fb5; --assignee: #00897b;
  --bg-elev: #f4f7fa;
  --shadow: 0 1px 2px rgba(16,30,50,0.08), 0 2px 8px rgba(16,30,50,0.06);
  --shadow-lg: 0 10px 30px rgba(16,30,50,0.18);
  --ring: 0 0 0 3px rgba(2,136,209,0.28);
}
[data-theme="light"] header { background: linear-gradient(180deg, rgba(255,255,255,0.6), rgba(255,255,255,0.92)), var(--panel); }
[data-theme="light"] #snav { background: linear-gradient(180deg, var(--panel), #eef2f7); }
* { box-sizing: border-box; }
@font-face {
  font-family: 'Inter';
  src: url('/share/assets/Inter.woff2') format('woff2-variations');
  font-weight: 100 900;
  font-display: swap;
}
.ic { width: 1.1em; height: 1.1em; display: inline-block; vertical-align: -0.15em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.ic-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
body {
  margin: 0;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  background:
    radial-gradient(1200px 600px at 100% -10%, rgba(79,195,247,0.06), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(79,195,247,0.04), transparent 55%),
    var(--bg);
  background-attachment: fixed;
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  letter-spacing: 0.01em;
}
::selection { background: rgba(79,195,247,0.28); }
* { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
*::-webkit-scrollbar { width: 9px; height: 9px; }
*::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
header {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.8rem 1.25rem;
  background: linear-gradient(180deg, rgba(33,43,53,0.55), rgba(22,29,37,0.85)), var(--panel);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 10;
  backdrop-filter: blur(8px);
  box-shadow: 0 1px 0 rgba(255,255,255,0.02), var(--shadow);
}
header h1 { margin: 0; font-size: 1.05rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; letter-spacing: -0.01em; }
header .mode { font-size: 0.75rem; color: var(--muted); background: var(--panel-2); padding: 0.2rem 0.6rem; border-radius: 4px; }
header .gs-gear { margin-left: auto; }   /* [GUEST-SETTINGS] l'engrenage prend la place de la lune */
/* [SEARCH-SHARED] la page partagée n'avait AUCUNE recherche. Barre au gabarit de l'owner (mêmes
   tokens, invariant 9) ; sur mobile / pointeur grossier, entrer dedans ouvre la feuille du partial. */
#search-wrap {
  display: flex; align-items: center; gap: 0.4rem; flex: 1;
  max-width: 340px; min-width: 130px; margin-left: 0.6rem;
  background: var(--bg); border: 1px solid var(--border); border-radius: 999px;
  padding: 0.35rem 0.7rem; transition: max-width 0.22s ease, border-color 0.2s, box-shadow 0.2s;
}
#search-wrap:focus-within { max-width: 520px; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,195,247,0.15); }
#search { flex: 1; min-width: 5rem; background: none; border: none; outline: none; color: var(--text); font: inherit; font-size: 0.88rem; }
/* [SEARCH-MOBILE-HEADER] Même traitement qu'à l'owner : pas de sélecteur inline ici (les portées
   vivent dans la feuille), mais la barre gardait ses largeurs de bureau et bousculait le titre et
   le badge de mode. Bornée, et l'élargissement au focus neutralisé — sur mobile le focus ouvre la
   feuille, élargir la barre derrière n'a aucun sens. */
@media (max-width: 900px), (pointer: coarse) {
  #search-wrap, #search-wrap:focus-within { flex: 1 1 7rem; max-width: 12rem; min-width: 0; margin-left: 0.4rem; }
  #search { min-width: 0; }
}
button.icon { display: inline-flex; align-items: center; justify-content: center; width: 2rem; height: 2rem; padding: 0; background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; transition: background 0.15s var(--ease), transform 0.1s var(--ease); }
button.icon:hover { background: var(--bg-elev); }
button.icon:active { transform: scale(0.94); }
.dot { width: 0.7rem; height: 0.7rem; border-radius: 50%; display: inline-block; }
#layout { display: flex; min-height: calc(100dvh - 54px); }
#snav {
  width: clamp(170px, 15vw, 230px);
  flex-shrink: 0;
  background: linear-gradient(180deg, var(--panel), rgba(14,18,23,0.4));
  border-right: 1px solid var(--border);
  padding: 0.75rem 0.5rem;
}
#snav[hidden] { display: none; }
.sitem {
  display: flex;
  align-items: center;
  gap: 0.3rem;
  padding: 0.45rem 0.65rem;
  border-radius: 8px;
  cursor: pointer;
  color: var(--muted);
  font-size: 0.88rem;
  margin-bottom: 3px;
  user-select: none;
  position: relative;
  transition: background 0.15s var(--ease), color 0.15s var(--ease), transform 0.12s var(--ease);
}
.sitem:hover { background: var(--panel-2); color: var(--text); transform: translateX(2px); }
.sitem.active { background: var(--panel-2); color: var(--accent); }
.sitem.active::before {
  content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
  width: 3px; height: 1.05rem; border-radius: 999px; background: var(--accent);
}
.sitem.droptarget { outline: 1px dashed var(--accent); color: var(--accent); }
.sitem .cnt { margin-left: auto; font-size: 0.72rem; opacity: 0.7; flex-shrink: 0; }
.sitem .slabel { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* [PROJ-EDIT-BAR] Le crayon `.cat-edit` de la sidebar est SUPPRIMÉ (avec son CSS [SIDEBAR-EDIT-MONO]
   devenu orphelin) : la sidebar redevient de la navigation pure. L'édition d'un dossier passe par
   l'icône « Modifier » de la barre d'actions du board. */
.sitem:hover .cnt, .sitem:focus-within .cnt { opacity: 0; }
.sdot { width: 0.6rem; height: 0.6rem; border-radius: 50%; display: inline-block; flex-shrink: 0; }
/* [SIDEBAR-TREE] .sb-tree (connecteurs texte) ne sert PLUS dans la sidebar — conservé
   pour la pop-in « Déplacer vers… » ; la vue Plan garde .tree-pre. */
.sb-tree {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  white-space: pre; color: var(--muted); opacity: 0.55;
  font-size: 0.78rem; flex-shrink: 0; line-height: 1;
}
/* [SIDEBAR-TREE] chevron DANS la ligne (colonne fixe, feuilles = span vide). */
.sb-proj-chev {
  width: 1.1rem; flex-shrink: 0; text-align: center;
  color: var(--muted); font-size: 0.85rem; line-height: 1; cursor: pointer;
}
/* [SIDEBAR-TREE] enfants dans un conteneur : indentation fixe ~17px/niveau + ligne
   guide verticale CSS (fini la dérive des connecteurs monospace avec les emojis). */
.sb-kids { margin-left: 0.8rem; padding-left: 0.25rem; border-left: 1px solid var(--border); }
/* [SIDEBAR-TREE] desktop : sidebar statique, scroller propre, épinglée sous le header. */
@media (min-width: 901px) {
  #snav {
    position: sticky;
    top: var(--header-h, 57px);
    height: calc(100dvh - var(--header-h, 57px));
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  #snav::-webkit-scrollbar { width: 8px; }
  #snav::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }
  #snav::-webkit-scrollbar-track { background: transparent; }
}
/* vue Plan invité (arbre projets → mémos) */
#tree-board { max-width: 720px; margin: 0 auto; }
/* [AGENDA] vue calendrier mensuelle — grille CSS maison (invariant 6), tokens (invariant 9) */
#agenda-board { max-width: 720px; margin: 0 auto; }
.ag-head { display: flex; align-items: center; gap: 0.6rem; margin: 0 0 0.6rem; flex-wrap: wrap; }
.ag-head h2 { margin: 0; font-size: 1.05rem; text-transform: capitalize; }
.ag-nav { display: flex; gap: 0.3rem; margin-left: auto; }
.ag-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.ag-dow { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; text-align: center; padding: 0.15rem 0; }
.ag-cell { min-height: 88px; min-width: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 0.25rem 0.3rem; display: flex; flex-direction: column; gap: 2px; cursor: pointer; }
.ag-cell.out { opacity: 0.4; background: transparent; cursor: default; }
.ag-cell.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.ag-cell.sel { background: var(--panel-2); }
.ag-cell.droptarget { outline: 1px dashed var(--accent); }
.ag-num { font-size: 0.7rem; color: var(--muted); }
.ag-cell.today .ag-num { color: var(--accent); font-weight: 700; }
.ag-chip { display: flex; align-items: center; gap: 0.3rem; min-width: 0; font-size: 0.7rem; background: var(--panel-2); border: 1px solid var(--border); border-radius: 999px; padding: 0.05rem 0.4rem; }
.ag-chip .ag-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ag-dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; flex-shrink: 0; }
.ag-more { font-size: 0.68rem; color: var(--muted); padding: 0.05rem 0.2rem; background: none; border: none; text-align: left; cursor: pointer; border-radius: 4px; }
.ag-more:hover { color: var(--text); background: var(--panel-2); }
.ag-day-panel { margin-top: 0.9rem; }
.ag-day-panel h3 { margin: 0 0 0.4rem; font-size: 0.9rem; text-transform: capitalize; }
/* [AGENDA-DAY-POPIN] pop-in « jour » (dialog natif — hérite du style dialog + entrée dlg-in). */
/* [DIALOG-SIZE] le dialog de base share est TRANSPARENT (wrapper) → la pop-in jour doit poser sa
   propre carte (fond/bordure/rayon) + largeur. */
#agenda-day-dialog { width: min(clamp(680px, 52vw, 980px), 94vw); padding: 1rem; background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-lg); }
.agd-head { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.6rem; }
.agd-title { flex: 1; min-width: 0; text-align: center; }
.agd-day { font-size: 1rem; font-weight: 700; text-transform: capitalize; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.agd-count { font-size: 0.75rem; color: var(--muted); }
.agd-nav, .agd-x { flex: 0 0 auto; width: 2.2rem; height: 2.2rem; border-radius: 9px; border: 1px solid var(--border); background: var(--panel-2); color: var(--muted); font-size: 1.1rem; line-height: 1; cursor: pointer;
  /* [POLISH-VIEWER-AGENDA-PRIO] icônes trait CENTRÉES (les glyphes ‹ › ✕ flottaient selon la police). */
  display: inline-flex; align-items: center; justify-content: center; padding: 0; }
.agd-nav:hover, .agd-x:hover { border-color: var(--muted); color: var(--accent); }
.agd-body { display: flex; flex-direction: column; gap: 0.3rem; max-height: 60vh; overflow-y: auto; }
.agd-row { display: flex; align-items: center; gap: 0.5rem; min-height: 44px; padding: 0.4rem 0.5rem; border-radius: 9px; background: var(--panel-2); border: 1px solid var(--border); cursor: pointer; }
.agd-row:hover, .agd-row:focus-visible { border-color: var(--accent); outline: none; }
.agd-dot { flex: 0 0 auto; width: 0.7rem; height: 0.7rem; border-radius: 50%; }
.agd-t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.agd-time { flex: 0 0 auto; font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 0.1rem 0.4rem; }
.agd-chev { flex: 0 0 auto; color: var(--muted); font-size: 1.1rem; display: inline-flex; align-items: center; justify-content: center; }
.agd-empty { color: var(--muted); font-size: 0.9rem; padding: 1rem 0.5rem; text-align: center; }
.agd-foot { margin-top: 0.7rem; }
.agd-add { width: 100%; }
.ag-row { display: flex; align-items: center; gap: 0.5rem; padding: 0.35rem 0.5rem; border-radius: 8px; cursor: pointer; min-width: 0; }
.ag-row:hover { background: var(--panel-2); }
.ag-time { width: 54px; flex-shrink: 0; font-size: 0.75rem; color: var(--muted); }
.ag-row .ag-t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ag-empty { color: var(--muted); font-size: 0.82rem; font-style: italic; padding: 0.3rem 0.5rem; }
.tree-toolbar { display: flex; align-items: center; gap: 0.6rem; margin: 0 0 0.6rem; }
.tree-toolbar h2 { margin: 0; font-size: 1.05rem; }
.tree-rows { display: flex; flex-direction: column; }
.tree-row { display: flex; align-items: center; gap: 0.3rem; padding: 0.16rem 0.4rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; min-width: 0; }
.tree-row:hover { background: var(--panel-2); }
.tree-pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; color: var(--muted); opacity: 0.55; flex-shrink: 0; font-size: 0.8rem; line-height: 1; }
.tree-chev {
  width: 1.4rem; flex-shrink: 0; text-align: center;
  color: var(--muted); font-size: 0.95rem; line-height: 1; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
}
.tree-chev:hover { color: var(--text); }
.tree-check { width: 1rem; flex-shrink: 0; text-align: center; color: var(--green, #4caf50); font-weight: 700; }
.tree-pip { width: 0.55rem; height: 0.55rem; border-radius: 50%; flex-shrink: 0; }
.tree-title { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tree-proj .tree-title { font-weight: 600; }
.tree-projname { cursor: pointer; }
.tree-projname:hover { color: var(--accent); }
.tree-title.done { text-decoration: line-through; color: var(--muted); }
.tree-count { flex-shrink: 0; font-size: 0.72rem; color: var(--muted); margin-left: 0.3rem; }
.tree-meta { display: flex; gap: 0.4rem; flex-shrink: 0; margin-left: 0.5rem; }
.tcol { font-size: 0.72rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tcol-due { width: 84px; } .tcol-asg { width: 96px; } .tcol-loc { width: 120px; }
.tcol-due.due-late { color: var(--danger); } .tcol-due.due-today { color: var(--warn); }
main { flex: 1; min-width: 0; max-width: 720px; margin: 0 auto; padding: 1.25rem; }
@media (max-width: 900px) {
  #layout { flex-direction: column; }
  #snav { width: 100%; display: flex; overflow-x: auto; border-right: none; border-bottom: 1px solid var(--border); padding: 0.5rem 0.75rem; gap: 0.3rem;
    /* Navigation projets collante : épinglée sous le header au défilement (--header-h mesuré en JS). */
    position: sticky; top: var(--header-h, 0px); z-index: 9; background: var(--panel); }
  .sitem { flex-shrink: 0; margin-bottom: 0; }
  /* Barre horizontale : l'arbre vertical n'a pas de sens → masquer connecteurs/chevrons.
     [SIDEBAR-TREE] conteneurs .sb-kids aplatis pour rester dans le flux horizontal. */
  .sb-tree, .sb-proj-chev { display: none; }
  .sb-kids { display: contents; }
  #tree-board { max-width: 100%; }
  .tree-meta { display: none; }
  .tree-pre { font-size: 0.74rem; }
  .tree-chev { width: 1.8rem; height: 1.8rem; font-size: 1.1rem; }
  /* [MAP-TIMELINE-MOBILE-ORDER] CARTE → FRISE → LISTE (frise collée sous la carte). */
  #map-dialog[open] { display: flex; flex-direction: column; overflow-y: auto; max-height: 92vh; } /* [open] : sinon on écrase le dialog:not([open]){display:none} du navigateur → carte visible même fermée */
  #map-row { display: contents !important; } /* bat le display:flex inline du markup */
  #map-el { order: 1; flex: 0 0 auto !important; min-width: 0 !important; }
  #map-timeline { order: 2; }
  #map-list { order: 3; width: 100% !important; flex: 0 0 auto !important; min-height: 110px; max-height: 38vh !important; margin-top: 0.5rem; } /* flex:0 0 auto + min-height : sans ça, le max-height UA du dialog en flex column compressait la liste à 0x0 */
  #map-dialog .actions { order: 4; }
}
.task {
  position: relative;
  z-index: 0;
  background: var(--panel);
  border: 1px solid var(--border);
  border-left: 3px solid var(--border);
  border-radius: 0 var(--radius) var(--radius) 0;
  padding: 0.6rem 0.8rem;
  margin-bottom: 0.5rem;
  box-shadow: var(--shadow);
  transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease), transform 0.15s var(--ease);
}
.task:hover,
.task:focus-within { z-index: 3; }
.task:hover { border-left-color: var(--accent); box-shadow: var(--shadow-lg); transform: translateX(2px); }
.task-row { display: flex; align-items: flex-start; gap: 0.6rem; }
.task-check {
  width: 1.15rem; height: 1.15rem; border-radius: 50%;
  border: 2px solid var(--muted); background: none; flex-shrink: 0;
  cursor: pointer; margin-top: 0.1rem; padding: 0; font-size: 0.7rem; line-height: 1; color: transparent;
}
.task-check:disabled { cursor: default; opacity: 0.6; }
.task.done .task-check { background: var(--green); border-color: var(--green); color: #fff; }
.task-content { flex: 1; font-size: 0.95rem; white-space: pre-wrap; word-break: break-word; }
/* [MEMO-VIEW correctif 3] groupe d'actions : c'est le CONTENEUR qui pousse à droite (les boutons
   ne portent plus `margin-left:auto`, sinon ils se séparaient au wrap mobile). */
.task-acts { display: inline-flex; align-items: center; gap: 0.25rem; flex-shrink: 0; margin-left: auto; }
.task-edit {
  flex-shrink: 0; min-height: 0; width: 1.6rem; height: 1.6rem;
  padding: 0; border: none; background: none; color: var(--muted); cursor: pointer;
  border-radius: 5px; opacity: 0.55; display: inline-flex; align-items: center; justify-content: center;
}
.task:hover .task-edit, .task .task-edit:focus-visible { opacity: 0.9; }
.task-edit:hover { opacity: 1; color: var(--text); background: var(--panel-2); }
@media (max-width: 900px) {
  .task-edit {
    opacity: 1; width: auto; min-width: 46px; min-height: 40px; padding: 0.25rem 0.6rem;
    border: 1px solid var(--accent); border-radius: 10px; background: var(--panel-2); color: var(--accent);
  }
  .task-edit .ic { width: 1.5em; height: 1.5em; }
}

{% include 'partials/_shared.js.html' %}
<script>
const EMBEDDED_BUILD = "{{ build }}";  // [UPDATE-PROMPT] version embarquée au rendu
const TOKEN = location.pathname.split('/')[2];
const API = '/share/' + TOKEN;
// [FX-CONVERTER] widget convertisseur de devises (invité → /share/<token>/fx, taux publics).
if (typeof initFxWidget === 'function') initFxWidget({ fetchUrl: API + '/fx' });
let DATA = null;
let GUEST = { status: 'anonymous', email: '', name: '' };

// Thème clair / sombre (tokens surchargés sous [data-theme=light], persistant)
const themeBtn = document.getElementById('theme-btn');
// [GUEST-SETTINGS] thème à TROIS états (Auto / Clair / Sombre) réglé dans la pop-in Paramètres
// (engrenage de l'en-tête) ; « Auto » suit l'appareil. La page share est mono-partage : ni
// favoris ni renvoi de lien (route hub uniquement) → seule la section Affichage s'affiche.
initThemePref();
{ const _hdr = document.querySelector('header');
  if (_hdr) _hdr.appendChild(guestGearButton('icon', () => openGuestSettings({}))); }

/* [GUEST-ROLES V2 · T4b] « Gérer les accès » — visible UNIQUEMENT pour un Admin (maquette ①).
   Le bouton se pose à côté de l'engrenage : même famille de commandes (l'engrenage règle ce qui
   me concerne, la couronne ce qui concerne les autres). `can_admin` vient du serveur ; la route
   revérifie tout au moment d'ouvrir, donc ce bouton n'accorde rien — il évite juste de proposer
   une porte fermée. Il se redessine à chaque `load()` : un rôle peut être retiré pendant la
   session, et le bouton doit disparaître avec lui. */
function syncAdminButton() {
  const hdr = document.querySelector('header');
  if (!hdr) return;
  const old = document.getElementById('guest-admin-btn');
  // `can_admin` vient du serveur, qui exige déjà un invité APPROUVÉ : redoubler la garde ici avec
  // `approved()` n'ajoutait aucune sécurité (le front ne garde rien) et faisait dépendre le bouton
  // d'un état client qui pouvait, lui, être en retard.
  if (!DATA || !DATA.can_admin) { if (old) old.remove(); return; }
  if (old) return;
  const b = el('button', { class: 'icon gs-gear', attrs: { type: 'button', id: 'guest-admin-btn',
    title: 'Gérer les accès', 'aria-label': 'Gérer les accès' } });
  b.appendChild(el('span', { text: '👑' }));
  b.addEventListener('click', () => openGuestAdmin({
    load: () => fetch(API + '/admin', { headers: { 'X-Guest-Token': guestToken() } })
      .then((r) => (r.ok ? r.json() : null)).catch(() => null),
    setRole: (guestId, projectId, role) => fetch(API + '/guests/' + guestId + '/role', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Guest-Token': guestToken() },
      body: JSON.stringify({ project_id: projectId, role: role }),
    }).then((r) => r.ok).catch(() => false),
    decide: (reqId, decision) => fetch(API + '/role-request/' + reqId, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Guest-Token': guestToken() },
      body: JSON.stringify({ decision: decision }),
    }).then((r) => r.ok).catch(() => false),
    notify: (m, o) => notify(m, o),
  }));
  const gear = document.getElementById('guest-settings-btn');
  if (gear) hdr.insertBefore(b, gear); else hdr.appendChild(b);
}

syncHeaderHeight();
window.addEventListener('resize', syncHeaderHeight);
window.addEventListener('load', syncHeaderHeight);

function guestToken() { return localStorage.getItem('dashguest:' + TOKEN) || ''; }
function canEditNow() { return DATA && DATA.can_edit && GUEST.status === 'approved'; }
// [GUEST-ROLES] capacités résolues (le serveur reste la vérité — ces helpers ne font que
// piloter l'affichage). Un lien « suiveur » avec un override par mémo reste « writable ».
function approved() { return GUEST && GUEST.status === 'approved'; }
function linkWritable() {
  if (!DATA) return false;
  if (DATA.role && DATA.role !== 'viewer') return true;
  return (DATA.memos || []).some(m => m.can_comment || m.can_vote);
}
function canAddNow() { return !!(DATA && DATA.can_add) && approved(); }
/* [TOOLS-DOCK-GUEST] Dock d'outils repliables côté invité — parité avec le dock owner
   ([TOOLS-DOCK] V27.1.154). Une icône n'apparaît QUE si l'outil est DÉJÀ disponible pour ce
   rôle : le dock AFFICHE ou MASQUE, il n'élargit JAMAIS un droit (invariant 5). Persistance
   par contexte (`toolsDock:<TOKEN>:<PFILTER>`), tout replié par défaut. */
function shareDockKey() { return 'toolsDock:' + TOKEN + ':' + PFILTER; }
function shareDockState() {
  const st = { memo: false, file: false, voice: false, folder: false };
  try {
    const raw = JSON.parse(localStorage.getItem(shareDockKey()) || '{}');
    Object.keys(st).forEach(k => { st[k] = raw[k] === true; });
  } catch (e) {}
  return st;
}
function setShareDock(key, val) {
  const st = shareDockState();
  st[key] = !!val;
  try { localStorage.setItem(shareDockKey(), JSON.stringify(st)); } catch (e) {}
}
let shareDockFocusMemo = false;   // focus direct dans le champ titre à l'ouverture de l'outil Mémo
let shareFilesCfg = null;         // cfg de la drop-zone du dossier courant (partagée dock/Vocal)
/* Rend le dock invité. `avail` = quels outils sont RÉELLEMENT disponibles pour ce rôle ;
   aucune icône si aucun (suiveur → pas de dock du tout). Sur un board le dock rejoint la
   barre d'actions à droite (même rangée, space-between + wrap) ; sans barre d'actions il
   s'affiche SEUL, aligné à droite, juste au-dessus des barres d'ajout. */
function renderShareToolsDock(avail) {
  const prev = document.getElementById('share-tools-dock'); if (prev) prev.remove();
  const keys = [
    ['memo', 'pencil-plus', 'Mémo', 'Afficher/masquer la barre de création de mémo'],
    ['file', 'paperclip', 'Fichier', 'Afficher/masquer la zone de dépôt de fichiers'],
    ['voice', 'microphone', 'Vocal', 'Afficher/masquer l\'enregistrement vocal'],
    ['folder', 'folder-plus', 'Dossier', 'Afficher/masquer la création de sous-dossier'],
  ].filter(([k]) => avail[k]);
  if (!keys.length) return;                   // suiveur / lecture seule → aucun dock
  const st = shareDockState();
  const td = hdrToolbar();
  keys.forEach(([k, icon, label, title]) => {
    const b = td.add({ icon, label, title, onClick: () => {
      const next = !st[k];
      if (k === 'memo' && next) shareDockFocusMemo = true;
      setShareDock(k, next); render();
    } });
    if (st[k]) b.classList.add('on');
    b.setAttribute('aria-pressed', st[k] ? 'true' : 'false');
  });
  const bar = td.end();
  const wrap = el('div', { attrs: { id: 'share-tools-dock' } });
  wrap.appendChild(bar);
  const actions = document.getElementById('board-actions');
  if (actions) {   // board : même rangée que la barre d'actions, dock à droite
    actions.style.display = 'flex';
    actions.style.alignItems = 'center';
    actions.style.justifyContent = 'space-between';
    actions.style.flexWrap = 'wrap';
    actions.style.gap = '0.5rem';
    actions.appendChild(wrap);
  } else {         // pas de barre d'actions : dock seul, aligné à droite
    wrap.style.cssText = 'display:flex;justify-content:flex-end;margin:0 0 0.6rem';
    const anchor = document.getElementById('add-bar');
    anchor.parentNode.insertBefore(wrap, anchor);
  }
}
function canEditMemo(m) { return !!(m && m.can_edit) && approved(); }
function canCommentMemo(m) { return !!(m && m.can_comment) && approved(); }
function canVoteMemo(m) { return !!(m && m.can_vote) && approved(); }

async function refreshGuest() {
  /* [GUEST-ROLES V2 · T4b] Ce court-circuit datait d'avant les rôles : sur un lien en lecture,
     personne ne pouvait rien écrire, donc savoir QUI on était ne servait à rien. Depuis T1/T2 une
     personne s'élève par surcharge **indépendamment du rôle du lien** — un Administrateur peut
     très bien être entré par un lien « lecteur ». En sortant ici, la page le laissait `anonymous`
     alors que le serveur le reconnaissait : identité muette, et « Gérer les accès » invisible pour
     celui-là même qui administre. On interroge donc `/me` dès qu'un jeton existe ; sans jeton,
     rien ne change (aucun appel de plus pour un lecteur anonyme). */
  const t = guestToken();
  if (!t) { GUEST = { status: 'anonymous' }; return; }
  try {
    const r = await fetch(API + '/me', { headers: { 'X-Guest-Token': t } });
    GUEST = r.ok ? await r.json() : { status: 'anonymous' };
  } catch (_) { GUEST = { status: 'anonymous' }; }
}

function renderGuestBanner() {
  const b = document.getElementById('guest-banner');
  b.hidden = !linkWritable();
  if (b.hidden) return;
  // Le formulaire de connexion invité est affiché tant que l'invité n'est ni
  // approuvé, ni en attente, ni refusé. S'il est déjà à l'écran, NE PAS le
  // reconstruire : le refresh auto (setInterval 15s → load → ici) effacerait
  // ce que l'invité est en train de taper (prénom / e-mail / code).
  const anonymous = !['approved', 'rejected'].includes(GUEST.status);   // [GUEST-AUTO-APPROVE] plus de 'pending'
  if (anonymous && document.getElementById('guest-form')) return;
  b.innerHTML = '';
  b.className = '';
  if (GUEST.status === 'approved') {
    b.className = 'approved';
    b.textContent = '✅ Connecté·e en tant que ' + (GUEST.name || GUEST.email) + ' — tes modifications sont signées.';
    return;
  }
  // [GUEST-AUTO-APPROVE] plus d'état « en attente » : l'enregistrement par PIN rend l'invité
  // actif immédiatement. Le cas 'pending' ne peut plus survenir côté serveur — le bloc est
  // retiré. Reste la RÉVOCATION, seul contrôle owner.
  if (GUEST.status === 'rejected') {
    b.className = 'rejected';
    b.innerHTML = '<h2>🚫 Accès révoqué</h2><p>Le propriétaire a retiré cet accès. Tu peux consulter, mais pas modifier.</p>';
    return;
  }
  b.innerHTML = '<h2>✏️ Pour modifier, présente-toi</h2><p>Ton e-mail signe tes modifications. Le code à 4 chiffres t\'a été donné par le propriétaire.</p>';
  const form = el('div', '');
  form.id = 'guest-form';
  const nameIn = document.createElement('input');
  nameIn.placeholder = 'Prénom (optionnel)';
  const emailIn = document.createElement('input');
  emailIn.type = 'email';
  emailIn.placeholder = 'ton@email.fr';
  const pinIn = document.createElement('input');
  pinIn.type = 'text';
  pinIn.inputMode = 'numeric';
  pinIn.maxLength = 4;
  pinIn.placeholder = 'Code';
  pinIn.style.cssText = 'flex:0 0 5.5rem;min-width:5.5rem;text-align:center;letter-spacing:0.3em';
  const btn = document.createElement('button');
  btn.textContent = 'Se connecter';
  const errEl = document.createElement('div');
  errEl.id = 'guest-error';
  errEl.setAttribute('role', 'alert');
  const showErr = (msg, focusEl, markEl) => {
    errEl.textContent = msg;
    [nameIn, emailIn, pinIn].forEach(i => i.classList.remove('invalid'));
    if (markEl) markEl.classList.add('invalid');
    if (focusEl) focusEl.focus();
  };
  const submit = async () => {
    const email = emailIn.value.trim();
    if (!email || !email.includes('@')) { showErr('E-mail invalide.', emailIn, emailIn); return; }
    if (!/^\d{4}$/.test(pinIn.value.trim())) { showErr('Le code est composé de 4 chiffres.', pinIn, pinIn); return; }
    errEl.textContent = '';
    const r = await fetch(API + '/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, name: nameIn.value.trim(), pin: pinIn.value.trim() }),
    });
    if (r.ok) {
      const d = await r.json();
      localStorage.setItem('dashguest:' + TOKEN, d.guest_token);
      GUEST = d;
      renderGuestBanner();
      await load();
    } else {
      const err = await r.json().catch(() => ({}));
      // On NE vide PAS prénom/e-mail : seul le code est remis à zéro et refocus.
      pinIn.value = '';
      showErr(err.error || 'Connexion impossible.', pinIn, pinIn);
    }
  };
  btn.addEventListener('click', submit);
  [nameIn, emailIn, pinIn].forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); }));
  form.appendChild(nameIn);
  form.appendChild(emailIn);
  form.appendChild(pinIn);
  form.appendChild(btn);
  form.appendChild(errEl);
  b.appendChild(form);
}

// Remplace les alert() natifs par une pop-in (cohérent avec le reste de l'app).
function notify(message, { title = 'ℹ️ Info', error = false } = {}) {
  if (typeof announce === 'function') announce(message);
  return new Promise(resolve => {
    const dlg = document.getElementById('notify-dialog');
    document.getElementById('notify-title').textContent = error ? '⚠️ Erreur' : title;
    document.getElementById('notify-msg').textContent = message;
    const ok = document.getElementById('notify-ok');
    const done = () => { dlg.close(); ok.onclick = dlg.oncancel = null; resolve(); };
    ok.onclick = done;
    dlg.oncancel = (e) => { e.preventDefault(); done(); };
    dlg.showModal();
  });
}

// Miroir du confirmPopin propriétaire (index.html) — requis par runImageViewer
// (suppression d'image dans le carrousel) côté invité éditeur.
function confirmPopin(message, { title = 'Confirmer la suppression', okLabel = 'Supprimer', danger = true } = {}) {
  return new Promise(resolve => {
    const dlg = document.getElementById('confirm-dialog');
    document.getElementById('confirm-title').textContent = title;
    document.getElementById('confirm-msg').textContent = message;
    const yes = document.getElementById('confirm-yes');
    const no = document.getElementById('confirm-no');
    yes.textContent = okLabel;
    yes.className = danger ? 'confirm-danger' : 'primary';
    const done = (val) => {
      dlg.close();
      yes.onclick = no.onclick = dlg.oncancel = null;
      resolve(val);
    };
    yes.onclick = () => done(true);
    no.onclick = () => done(false);
    dlg.oncancel = (e) => { e.preventDefault(); done(false); };
    dlg.showModal();
  });
}

function shareIcon(name) {
  const NS = 'http://www.w3.org/2000/svg';
  const s = document.createElementNS(NS, 'svg'); s.setAttribute('class', 'ic');
  const u = document.createElementNS(NS, 'use'); u.setAttribute('href', '#ic-' + name);
  s.appendChild(u); return s;
}

// Désactive un bouton pendant une action async (anti double-clic).
async function withBusy(btn, fn) {
  if (btn && btn.disabled) return;
  if (btn) { btn.disabled = true; btn.setAttribute('aria-busy', 'true'); btn.style.opacity = '0.6'; }
  try { return await fn(); }
  finally { if (btn) { btn.disabled = false; btn.removeAttribute('aria-busy'); btn.style.opacity = ''; } }
}

// Rend les éléments "bouton" (sidebar, tuiles) focusables et activables au clavier.
function applyA11y() {
  document.querySelectorAll('.sitem, .tile').forEach(e => {
    if (!e.hasAttribute('tabindex')) e.tabIndex = 0;
    if (!e.hasAttribute('role')) e.setAttribute('role', 'button');
  });
}
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const t = e.target;
  if (t.matches && t.matches('.sitem, .tile') && !t.closest('input, textarea, select')) {
    e.preventDefault();
    t.click();
  }
});

function sanitize(html) {
  const tpl = document.createElement('template');
  tpl.innerHTML = html;
  tpl.content.querySelectorAll('script,style,iframe,object,embed,link,meta,form').forEach(n => n.remove());
  tpl.content.querySelectorAll('*').forEach(n => {
    [...n.attributes].forEach(a => {
      if (/^on/i.test(a.name)) n.removeAttribute(a.name);
      if ((a.name === 'href' || a.name === 'src') && /^\s*javascript:/i.test(a.value)) n.removeAttribute(a.name);
    });
    if (n.tagName === 'A') { n.setAttribute('target', '_blank'); n.setAttribute('rel', 'noopener noreferrer'); }
  });
  return tpl.content;
}

function isRich(c) { return /<(p|div|ul|ol|li|br|strong|em|u|s|a|h[1-6]|blockquote|pre|code|span|table)[\s>/]/i.test(c || ''); }

function linkifyText(text) {
  const frag = document.createDocumentFragment();
  const re = /https?:\/\/[^\s<>"]+/g;
  let last = 0, m;
  while ((m = re.exec(text)) !== null) {
    frag.appendChild(document.createTextNode(text.slice(last, m.index)));
    const a = el('a', '', m[0].replace(/^https?:\/\//, ''));
    a.href = m[0]; a.target = '_blank'; a.rel = 'noopener noreferrer';
    frag.appendChild(a);
    last = m.index + m[0].length;
  }
  frag.appendChild(document.createTextNode(text.slice(last)));
  return frag;
}

// Texte lisible sur un fond coloré (chip de priorité). [CARD-REDESIGN] — identique owner.
function textOn(hex) {
  const c = (hex || '').replace('#', '');
  if (c.length < 6) return '#fff';
  const r = parseInt(c.slice(0, 2), 16), g = parseInt(c.slice(2, 4), 16), b = parseInt(c.slice(4, 6), 16);
  return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#15191e' : '#fff';
}

function renderQContext(memo) {
  const box = document.getElementById('q-context');
  if (!box) return;
  box.innerHTML = '';
  // Fil d'Ariane scopé au partage (📥 Inbox si pas de projet dans le scope).
  // Lecture seule : pas de « créé par » ni de versions (owner-only, invariant 5).
  const byId = {};
  (DATA.projects || []).forEach(p => { byId[p.id] = p; });
  const chain = [];
  let cur = memo.project_id, guard = 0;
  while (cur != null && byId[cur] && guard++ < 50) { chain.push(byId[cur]); cur = byId[cur].parent_id; }
  chain.reverse(); // racine → feuille
  const crumb = el('div', { class: 'me-crumb' });
  crumb.appendChild(el('span', { class: 'me-sep', text: '📌' }));
  if (!chain.length) {
    crumb.appendChild(el('span', { class: 'me-crumb-node', text: '📥 Inbox' }));
  } else {
    chain.forEach((p, i) => {
      if (i) crumb.appendChild(el('span', { class: 'me-sep', text: '›' }));
      crumb.appendChild(el('span', { class: 'me-crumb-node', text: (p.emoji ? p.emoji + ' ' : '') + p.name }));
    });
  }
  box.appendChild(crumb);
  if (memo.created_at) {
    const d = new Date(memo.created_at);
    if (!isNaN(d)) {
      const date = d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
      const time = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
      box.appendChild(el('div', { class: 'me-meta', text: `🕒 Créé le ${date} à ${time}` }));
    }
  }
}

// [MEMO-VIEW] cfg invité (share) : tout vient de `DATA` (déjà borné au scope serveur) —
// un mémo hors scope renvoie null, donc sa chip de lien reste inerte (jamais de titre-fantôme).
function shareMemoViewCfg() {
  return {
    load: (id) => {
      const m = (DATA.memos || []).find(x => x.id === id);
      if (!m) return null;
      const chain = [];
      let pid = m.project_id;
      const seen = new Set();
      while (pid != null && !seen.has(pid)) {
        seen.add(pid);
        const p = (DATA.projects || []).find(x => x.id === pid);
        if (!p) break;
        chain.unshift({ emoji: p.emoji, color: usableProjColor(p.color), name: p.name });
        pid = p.parent_id;
      }
      const created = m.created_at ? new Date(m.created_at) : null;
      const fmt = (d) => d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' })
        + ' à ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
      // même libellé de date que les cards share (pas de `dueInfo` ici — il n'existe pas sur cette page)
      const t = fmtMemoRange(m.due_time, m.end_time);
      const dlbl = m.due_date
        ? ((m.due_end && m.due_end > m.due_date) ? fmtDateRange(m.due_date, m.due_end) : fmtDayShort(m.due_date))
        : '';
      // même pipeline que les cards : sanitize() pour le riche, texte brut sinon
      let node = null;
      if (isRich(m.content)) { node = el('div', ''); node.appendChild(sanitize(m.content)); }
      else if ((m.content || '').trim()) { node = el('div', ''); node.appendChild(linkifyText(m.content)); node.style.whiteSpace = 'pre-wrap'; }
      if (node) dressLinks(node);   // [LINK-RENDER] fiche de lecture
      return {
        memo: m,
        title: m.title || memoLeadText(isRich(m.content) ? splitLeadHtml(m.content).lead : stripTags(m.content || '').trim()) || MEMO_EMPTY_LABEL,
        crumb: chain,
        createdLine: created && !isNaN(created) ? '🕒 Créé le ' + fmt(created) : '',
        updatedLine: '',
        canEdit: canEditMemo(m),
        prio: (DATA.priorities || []).find(x => x.id === m.priority) || null,
        dueLabel: dlbl ? dlbl + (t ? ' · ' + t : '') : '',
        locLabel: m.location && m.location.label ? m.location.label : '',
        links: m.links || [],
        images: m.images || [],
        subtasks: m.subtasks || [],
        contentNode: node,
      };
    },
    onEdit: (m) => openEditor(m, el('span', ''), el('span', '')),
    // [MEMO-VIEW évolution] même appel que la card invitée (PUT /share/<t>/memo/<id> scopé,
    // droits revalidés serveur — invariant 5) ; `load()` rafraîchit les cards derrière.
    onToggleSub: (m, subtasks) => put(m.id, { subtasks }),
    // [MEMO-VIEW correctif 2] checklist du CONTENU : même bascule que la card invitée.
    onToggleCheck: (m, i) => {
      // ⚠️ mémo relu FRAIS : la fiche n'est pas redessinée après une écriture, `m` serait périmé.
      const cur = (DATA.memos || []).find(x => x.id === m.id) || m;
      const tpl = document.createElement('template');
      tpl.innerHTML = cur.content;
      const items = tpl.content.querySelectorAll('li[data-list="checked"], li[data-list="unchecked"]');
      if (!items[i]) return;
      items[i].setAttribute('data-list', items[i].getAttribute('data-list') === 'checked' ? 'unchecked' : 'checked');
      put(cur.id, { content: tpl.innerHTML });
    },
    imageUrl: (n) => API + '/image/' + n,
    onOpenPhoto: (images, i) => runImageViewer({
      images, startIndex: i, imageUrl: (n) => API + '/image/' + n,
      downloadUrl: (n) => API + '/image/' + n, exifUrl: (n) => API + '/image-exif/' + n,
    }),
  };
}

function openEditor(memo, contentEl, taskEl) {
  const q = getShareQuill();
  if (!q) {
    if (taskEl.querySelector('.edit-ta')) return;
    const ta = document.createElement('textarea');
    ta.className = 'edit-ta';
    ta.rows = 4;
    ta.value = memo.content;
    contentEl.replaceWith(ta);
    ta.focus();
    const save = () => {
      const v = ta.value.trim();
      if (v && v !== memo.content) put(memo.id, { content: v });
      else load();
    };
    ta.addEventListener('blur', save);
    ta.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); ta.blur(); }
      if (ev.key === 'Escape') { ta.removeEventListener('blur', save); load(); }
    });
    return;
  }
  editingId = memo.id;
  renderQContext(memo);
  renderQMeta(memo);         // [LESS-BUTTONS] échéance / priorité / position
  renderQPhotos(memo);       // [MEMO-EDITOR-IMAGES]
  renderQAttachments(memo);  // [ATTACHMENTS]
  renderQLinks(memo);        // [MEMO-LINKS]
  const titleEl = document.getElementById('q-title');
  if (titleEl) titleEl.value = memo.title || '';
  editAssignees = [...(memo.assignees || [])];
  renderQPeople();
  q.setContents([]);
  if (isRich(memo.content)) q.clipboard.dangerouslyPasteHTML(0, memo.content);
  else q.setText(memo.content);
  editDialog.showModal();
  applyEditorHeight(document.querySelector('#q-wrap .ql-container'));  // [EDITOR-RESIZE]
  q.focus();
}

document.getElementById('edit-cancel').addEventListener('click', () => editDialog.close());
document.getElementById('edit-save').addEventListener('click', (ev) => withBusy(ev.currentTarget, async () => {

let FILTER = 'all';
let PFILTER = 'all';
let GVIEW = 'board';   // 'board' | 'plan' (vue Plan invité)
// [MAP-MEMO-ROUNDTRIP] mémo « ouvert » depuis la carte (invité, pas de modal) : la card cible est
// DÉCLAMPÉE (contenu complet) + surlignée. État honoré au render (survit aux re-render) ; nettoyé
// au 1er clic ailleurs ou après 5 s. null = aucun.
let shareOpenMemo = null;
// Repli persisté, scopé par partage (TOKEN) — sidebar et vue Plan séparés.
function shareSbProjOpen(id) { return localStorage.getItem('shareSbProjOpen:' + TOKEN + ':' + id) !== '0'; }
function toggleShareSbProj(id) { localStorage.setItem('shareSbProjOpen:' + TOKEN + ':' + id, shareSbProjOpen(id) ? '0' : '1'); }
function shareTreeOpen(id) { return localStorage.getItem('shareTreeOpen:' + TOKEN + ':' + id) !== '0'; }
function setShareTreeOpen(id, v) { localStorage.setItem('shareTreeOpen:' + TOKEN + ':' + id, v ? '1' : '0'); }
let dragShareMemo = null;
let dragShareProj = null;

function projChildren(pid) { return (DATA.projects || []).filter(p => p.parent_id === pid); }
// [SHARE-BOARD-FIX] Icône projet (emoji + pastille couleur) — TOP-LEVEL : visible par la sidebar,
// l'arbre Plan ET le fil d'Ariane des cards du board (sinon ReferenceError, board vide).
function projIcon(p) {
  const icon = el('span', '');
  icon.style.cssText = 'display:inline-flex;align-items:center;gap:0.25rem;flex-shrink:0';
  if (p.emoji) icon.appendChild(el('span', '', p.emoji));
  if (p.color) { const d = el('span', 'sdot'); d.style.background = p.color; if (p.emoji) { d.style.width = '0.4rem'; d.style.height = '0.4rem'; } icon.appendChild(d); }
  if (!p.emoji && !p.color) { const d = el('span', 'sdot'); d.style.background = 'var(--gray)'; icon.appendChild(d); }
  return icon;
}
function projDescendants(pid) {
  const out = [];
  const walk = (id) => projChildren(id).forEach(c => { out.push(c.id); walk(c.id); });
  walk(pid);
  return out;
}

/* ===== [SEARCH-SHARED] recherche du partage =====
   Le filtre de recherche est posé DANS `scopedMemos()`, le passage obligé du board, de la carte et
   de la frise : une seule décision de périmètre, donc jamais un point de carte sans sa card (même
   exigence que le prédicat unique de l'owner, [SEARCH-IN-FOLDER]). `shareSearchWide` n'est pas
   persisté : il retombe dès que la recherche est vidée. */
let shareSearchScope = 'all';
let shareSearchWide = false;
function shareSearchRaw() { const i = document.getElementById('search'); return i ? i.value : ''; }
function shareSearch() { return parseSearchPrefix(shareSearchRaw(), shareSearchScope); }
function shareMatchingProjects(q) {
  if (!q) return [];
  const n = q.charAt(0) === '#' ? q.slice(1) : q;
  return (DATA.projects || []).filter(p => (p.name || '').toLowerCase().includes(n));
}
function shareSearchScoped() { return PFILTER !== 'all' && !!shareSearch().q && !shareSearchWide; }
function scopedMemos() {
  const { scope, q } = shareSearch();
  let ms = DATA.memos || [];
  // Dossier courant : borné au dossier + descendants, sauf si le chip a été éteint (recherche large).
  if (PFILTER !== 'all' && !(q && shareSearchWide)) {
    const set = new Set([PFILTER, ...projDescendants(PFILTER)]);
    ms = ms.filter(m => set.has(m.project_id));
  }
  if (!q) return ms;
  if (scope === 'projects') {
    const ids = new Set(shareMatchingProjects(q).map(p => p.id));
    return ms.filter(m => ids.has(m.project_id));
  }
  return ms.filter(m => ((m.title || '') + ' ' + stripTags(m.content) + ' ' + (m.assignees || []).join(' ')).toLowerCase().includes(q));
}

// [PHOTO-BATCH-DOWNLOAD] Fichiers d'un dossier partagé (+ sous-dossiers) — scope borné à
// DATA.memos (périmètre du partage, invariant 5). Le token borne côté serveur.
function shareProjectZipCount(pid, scope, includeSubs) {
  const set = new Set(includeSubs ? [pid, ...projDescendants(pid)] : [pid]);
  let n = 0;
  (DATA.memos || []).forEach(m => { if (set.has(m.project_id)) n += memoZipCount(m, scope); });
  // [FOLDER-ATTACHMENTS] fichiers rattachés aux dossiers du périmètre
  (DATA.projects || []).forEach(p => { if (set.has(p.id)) (p.attachments || []).forEach(a => { if (scope === 'all' || (a.mime || '').indexOf('image/') === 0) n++; }); });
  return n;
}
// [FILES-VIEW] Vue « Fichiers » d'un dossier partagé (borné au token, invariant 5).
function openShareFileSource(s) {
  if (!s) return;
  if (s.type === 'memo') {
    const m = (DATA.memos || []).find(x => x.id === s.id);
    if (m) { if (canEditMemo(m)) { openEditor(m, el('span', ''), el('span', '')); return; } PFILTER = m.project_id || 'all'; GVIEW = 'board'; render(); return; }
  }
  if (s.type === 'project') { PFILTER = s.id; GVIEW = 'board'; render(); }
}
function openShareFiles(pid) {
  openFilesDialog({
    title: 'Fichiers',
    load: () => fetch(API + '/project/' + pid + '/files').then(r => r.json()),
    onOpenSource: openShareFileSource,
    openImage: (a) => { if (typeof runImageViewer === 'function') runImageViewer({ images: [a], startIndex: 0, imageUrl: (x) => x.url }); else window.open(a.url, '_blank', 'noopener'); },
    zip: { hasSubprojects: true, count: (scope, subs) => shareProjectZipCount(pid, scope, subs),
           buildUrl: (scope, subs) => API + '/project/' + pid + '/download.zip?scope=' + scope + '&subprojects=' + (subs ? 1 : 0) },
  });
}

async function guestPut(url, body) {

  });
  if (!r.ok) {
    const err = await r.json().catch(() => ({}));
    if (err.error) notify(err.error, { error: true });
  }
  await load();
}

function renderSidebar() {
  const nav = document.getElementById('snav');
  const show = DATA.kind === 'project' && (DATA.projects || []).length > 0;
  nav.hidden = !show;
  if (!show) return;
  nav.innerHTML = '';

  const mkItem = (label, icon, count, key, depth, proj) => {
    // En vue Plan/Agenda, aucun item projet/Tous n'est surligné (c'est l'item de vue qui l'est).
    const item = el('div', 'sitem' + (GVIEW === 'board' && PFILTER === key ? ' active' : ''));
    item.style.paddingLeft = (0.6 + (depth || 0) * 0.9) + 'rem';
    if (icon) item.appendChild(icon);
    item.appendChild(el('span', 'slabel', label));
    item.appendChild(el('span', 'cnt', String(count)));
    const select = () => { PFILTER = key; GVIEW = 'board'; render(); };
    if (proj && canEditNow()) {
      let timer = null;
      item.addEventListener('click', () => {
        if (timer) { clearTimeout(timer); timer = null; openProjEditor(proj); return; }
        timer = setTimeout(() => { timer = null; select(); }, 250);
      });
      item.addEventListener('contextmenu', (e) => { e.preventDefault(); openProjEditor(proj); });
      // [PROJ-EDIT-BAR] le ✎ quitte la sidebar (navigation seule, comme côté owner) : l'édition
      // vit désormais dans la barre d'actions du board. Les gestes double-clic / clic droit restent.
      item.title = 'Double-clic ou clic droit pour modifier';
    } else {
      item.addEventListener('click', select);
    }
    return item;
  };

  // Item « Plan » en haut (comme côté propriétaire) — bascule la vue Plan.
  const planItem = el('div', 'sitem' + (GVIEW === 'plan' ? ' active' : ''));
  planItem.appendChild(el('span', '', '🌳'));
  planItem.appendChild(el('span', 'slabel', 'Plan'));
  planItem.title = 'Vue Plan : arbre projets → mémos';
  planItem.addEventListener('click', () => { GVIEW = 'plan'; render(); });
  nav.appendChild(planItem);

  // [AGENDA] Vue calendrier mensuelle des échéances du partage. [AGENDA-PROJECT]
  // l'item sidebar = agenda GLOBAL du partage : il efface le filtre dossier éventuel.
  const agendaItem = el('div', 'sitem' + (GVIEW === 'agenda' ? ' active' : ''));
  agendaItem.appendChild(el('span', '', '📆'));
  agendaItem.appendChild(el('span', 'slabel', 'Agenda'));
  agendaItem.title = 'Vue Agenda : calendrier mensuel des échéances';
  // [AGENDA-SMART-MONTH] global = toujours le mois courant.
  agendaItem.addEventListener('click', () => { shareAgendaFilter = null; agendaYM = null; agendaSelDay = null; GVIEW = 'agenda'; render(); });
  nav.appendChild(agendaItem);

  const pendingAll = DATA.memos.filter(m => !m.done).length;
  nav.appendChild(mkItem('Tous', el('span', '', '🗂'), pendingAll, 'all', 0));

  // En mobile (barre horizontale) on force le dépli pour que tout reste atteignable.
  const flat = window.matchMedia('(max-width: 900px)').matches;
  const projOpen = (id) => flat || shareSbProjOpen(id);
  // [SIDEBAR-TREE] arbre à indentation fixe (.sb-kids, ligne guide CSS) — plus de
  // connecteurs texte. UNE seule icône : emoji, sinon pastille couleur.
  const renderTree = (p, wrap) => {
    const icon = el('span', '');
    icon.style.cssText = 'display:inline-flex;align-items:center;flex-shrink:0';
    if (p.emoji) icon.appendChild(el('span', '', p.emoji));
    else {
      const d = el('span', 'sdot');
      d.style.background = usableProjColor(p.color) || 'var(--gray)';
      icon.appendChild(d);
    }
    const count = DATA.memos.filter(m => m.project_id === p.id && !m.done).length;
    const item = mkItem(p.name, icon, count, p.id, 0, p);
    const lbl = item.querySelector('.slabel');
    if (lbl) lbl.title = p.name;

    // Chevron DANS la ligne (colonne fixe) ; feuille = span vide de même largeur.
    const kids = projChildren(p.id);
    const chev = el('span', 'sb-proj-chev');
    if (kids.length) {
      const open = projOpen(p.id);
      chev.textContent = open ? '▾' : '▸';
      chev.title = open ? 'Replier ce projet' : 'Déplier ce projet';
      chev.addEventListener('click', (e) => { e.stopPropagation(); toggleShareSbProj(p.id); render(); });
    } else { chev.style.cursor = 'default'; }
    item.insertBefore(chev, item.firstChild);

    if (canEditNow()) {
      if (p.id !== DATA.root_id) {
        item.draggable = true;
        item.title = 'Double-clic ou clic droit pour modifier · glisser pour déplacer';
        item.addEventListener('dragstart', (e) => { dragShareProj = p.id; e.dataTransfer.effectAllowed = 'move'; });
        item.addEventListener('dragend', () => { dragShareProj = null; });
      }
      item.addEventListener('dragover', (e) => {
        if (!dragShareMemo && !dragShareProj) return;
        if (dragShareProj && (dragShareProj === p.id || projDescendants(dragShareProj).includes(p.id))) return;
        e.preventDefault();
        item.classList.add('droptarget');
      });
      item.addEventListener('dragleave', () => item.classList.remove('droptarget'));
      item.addEventListener('drop', async (e) => {
        e.preventDefault();
        item.classList.remove('droptarget');
        if (dragShareMemo) {
          await guestPut(API + '/memo/' + dragShareMemo, { project_id: p.id });
        } else if (dragShareProj && dragShareProj !== p.id) {
          await guestPut(API + '/project/' + dragShareProj, { parent_id: p.id });
        }
      });
    }
    wrap.appendChild(item);
    if (kids.length && projOpen(p.id)) {
      const kw = el('div', 'sb-kids');
      kids.forEach(c => renderTree(c, kw));
      wrap.appendChild(kw);
    }
  };
  const root = (DATA.projects || []).find(p => p.id === DATA.root_id);
  if (root) renderTree(root, nav);
}

    if (!m.location) return;
    points.push({
      lat: m.location.lat, lng: m.location.lng,
      title: (m.emoji ? m.emoji + ' ' : '') + (isRich(m.content) ? stripTags(m.content) : m.content).slice(0, 60),
      placeLabel: m.location.label || '',
      sub: m.location.label || '',
      color: m.point_color || (prios[m.priority] || {}).color || DATA.marker_color || '#e53935',
      kind: 'memo', id: m.id, override: m.point_color || '', groups: m.map_groups || [], project_id: m.project_id || null,
      links: memoLinks(m.content),  // [FESTIVAL-FRISE-FOCUS #3] liens dans la bulle du marqueur
      due_date: m.due_date || '', due_time: m.due_time || '', trip: shareTripOf(m.project_id), // [MAP-TIMELINE]
      // [MAP-TRIP-POLISH] 1re photo, URL scopée au partage (invariant 5).
      imgUrl: imgSize((m.images && m.images.length) ? API + '/image/' + m.images[0] : '', 't'),
    });
  });
  (DATA.projects || []).forEach(p => {
    if (p.location && (PFILTER === 'all' || p.id === PFILTER || projDescendants(PFILTER).includes(p.id))) {
      points.push({ lat: p.location.lat, lng: p.location.lng, title: '📁 ' + p.name, placeLabel: p.location.label || '', sub: p.location.label || '', color: p.point_color || p.color || '#81c784', kind: 'project', id: p.id, override: p.point_color || '', groups: [] });
    }
  });
  return points;
}

// [VOTE-MAP] Scrutins du projet actif (invité) pour runMapDialog. Voter réservé à l'invité
// approuvé (le serveur revalide) ; anonyme = lecture (onVote absent). null si aucun scrutin.
function buildShareMapVoteData() {
  const pid = (PFILTER !== 'all') ? PFILTER : DATA.root_id;
  const cur = (DATA.projects || []).find(p => p.id === pid);
  if (!cur) return null;
  // [VOTE-MAP-SUBPROJECT] agrège courant + descendants DANS LE PÉRIMÈTRE DU PARTAGE (invariant 5 :
  // projDescendants ne parcourt que DATA.projects, déjà scopé) → le vote d'un sous-projet partagé
  // via un parent apparaît sur la carte invité.
  const descIds = projDescendants(pid) || [];
  const order = [cur, ...descIds.map(id => (DATA.projects || []).find(p => p.id === id)).filter(Boolean)];
  let scrutins = [];
  order.forEach((p, i) => { scrutins = scrutins.concat(voteScrutinsForProject(p, DATA.memos, i === 0 ? '' : (p.emoji ? p.emoji + ' ' : '') + p.name)); });
  if (!scrutins.length) return null;
  const approved = GUEST.status === 'approved';
  return {
    scrutins,
    voteKey: 'shareMapVotesOn:' + TOKEN + ':' + pid,
    onVote: approved ? (async (memoId, sid) => {
      const r = await fetch(API + '/memo/' + memoId + '/vote', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Guest-Token': guestToken() }, body: JSON.stringify(sid == null ? {} : { vote_id: sid }) });
      if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error || ('HTTP ' + r.status)); }
      const d = await r.json();
      if (sid == null) {
        const opt = {}; (d.options || []).forEach(o => { opt[o.memo_id] = { count: o.vote_count, mine: !!o.vote_mine, is_winner: !!o.is_winner }; const m = (DATA.memos || []).find(x => x.id === o.memo_id); if (m) { m.vote_count = o.vote_count; m.vote_mine = o.vote_mine; m.is_winner = o.is_winner; } });
        return { state: d.vote.vote_state, winner_ids: (d.vote.vote_winner_ids || []).slice(), opt };
      }
      const v = d.vote; const opt = {}; (v.options || []).forEach(o => opt[o.memo_id] = { count: o.vote_count, mine: !!o.vote_mine, is_winner: !!o.is_winner });
      const owner = (DATA.projects || []).find(p => (p.votes || []).some(x => x.id === v.id));  // porteur (courant OU descendant)
      if (owner) owner.votes = owner.votes.map(x => x.id === v.id ? v : x);
      return { state: v.vote_state, winner_ids: (v.vote_winner_ids || []).slice(), opt };
    }) : null,
  };
}

// [FESTIVAL-FRISE-FOCUS] Données d'un passage pour le popup de la frise carte (invité). Tout
// vient de DATA (memos + projects, incl. votes nommés) — scopé au partage, aucune route (invariant 5).
function shareMapPassageInfo(memoId) {
  const m = (DATA.memos || []).find(x => x.id === memoId);
  if (!m) return null;
  const byId = {}; (DATA.projects || []).forEach(p => { byId[p.id] = p; });
  let ll = null, label = '', scene = '', sceneColor = '', pid = m.project_id, g = 0;
  while (pid != null && byId[pid] && g++ < 60) {  // location DATA.projects = objet déjà parsé serveur
    const pl = byId[pid].location;
    if (pl && pl.lat != null) { ll = [pl.lat, pl.lng]; label = pl.label || ''; scene = byId[pid].name; sceneColor = provenanceColor(byId[pid]); break; }
    pid = byId[pid].parent_id;
  }
  if (!scene && m.project_id && byId[m.project_id]) { scene = byId[m.project_id].name; sceneColor = provenanceColor(byId[m.project_id]); }
  let votes = 0;
  (DATA.projects || []).forEach(p => (p.votes || []).forEach(v => (v.options || []).forEach(o => { if (o.memo_id === memoId) votes += o.vote_count || 0; })));
  return { ll, label, scene, sceneColor, artist: m.title || (isRich(m.content) ? stripTags(m.content) : m.content).slice(0, 60),
    hearts: m.hearts_count || 0, voters: m.heart_voters || [], votes,
    links: memoLinks(m.content) };  // [FESTIVAL-FRISE-FOCUS #3] sceneColor = pastille
}

// [FESTIVAL-FRISE-FOCUS #2] snapshot carte mémorisé quand un invité ouvre un mémo depuis la bulle,
// restauré à la PROCHAINE ouverture de la carte (l'invité n'a pas de modal mémo — commentaires/
// réactions/❤️ vivent inline dans la card du board —, donc pas de « close » pour rouvrir auto ;
// le retour à la carte re-restaure vue/jour/chip/bulle avec compteurs à jour). Un seul niveau.
let shareMapRestore = null;

function openShareMap(extra) {
  extra = extra || {};
  if (shareMapRestore && !extra.restore) { extra = Object.assign({ restore: shareMapRestore }, extra); shareMapRestore = null; }
  // Thin wrapper : délègue à runMapDialog (partial) avec le config invité (scopé au partage).
  // [PHOTO-TEMPLATE-MEMO] `extra` = {autoPhoto, focusFilename} pour « 📍 localiser ».
  runMapDialog(Object.assign({
    title: DATA.title, points: shareMapPoints(), recompute: shareMapPoints,
    // [MAP-GROUPS-MENU] canEditNow() (lien can_edit ET invité approuvé) — pas seulement le
    // can_edit du lien : un visiteur anonyme ne voit plus le menu Groupes / les outils
    // d'édition que le serveur lui refuserait de toute façon (403 sans X-Guest-Token).
    editable: canEditNow(),
    projects: DATA.projects || [], currentProjectId: (PFILTER !== 'all') ? PFILTER : DATA.root_id,
    subFilterScope: PFILTER !== 'all',
    defaultMarkerColor: DATA.marker_color,
    winnerIds: voteWinnerIdSet((DATA.projects || []).find(p => p.id === (PFILTER !== 'all' ? PFILTER : DATA.root_id))),
    voteData: buildShareMapVoteData(),  // [VOTE-MAP]
    focusKey: 'shareMapFocus:' + TOKEN + ':' + PFILTER,
    subKey: 'shareMapSubFilter:' + TOKEN + ':' + PFILTER,
    // [FESTIVAL-MAP-OVERLAY] surcouche de plan (invité : image servie depuis /share/assets/,
    // car /static est derrière Authelia — invariant 5/6, image whitelistée SHARE_ASSETS).
    assetBase: '/share/assets/', overlayKey: 'shareMapPlan:' + TOKEN + ':' + PFILTER,
    saveColor: saveSharePointColor, saveGroups: saveShareGroups,
    // [MAP-TIMELINE] frise + tracé voyage (trip résolu serveur, lecture seule).
    datedPoints: shareDatedPoints,
    timelineKey: 'shareMapTimeline:' + TOKEN + ':' + PFILTER,
    // [PHOTO-MAP] Calque photo scopé au partage (endpoint /share/<token>/photos).
    loadPhotos: () => fetch(API + '/photos', { headers: { 'X-Guest-Token': guestToken() } }).then(r => r.json()),
    openImage: (n) => runImageViewer({ images: [n], startIndex: 0, imageUrl: x => API + '/image/' + x, downloadUrl: x => API + '/image/' + x, exifUrl: x => API + '/image-exif/' + x }),
    passageInfo: shareMapPassageInfo,  // [FESTIVAL-FRISE-FOCUS] données du passage pour le popup frise
    // [MAP-MEMO-ROUNDTRIP] « Ouvrir le mémo » invité (pas de modal — détails/commentaires/réactions
    // vivent inline sur la card). Mémorise l'état carte (restauré au retour), ferme la carte, va au
    // board du dossier, DÉPLIE la card cible (contenu déclampé via shareOpenMemo) + surlignage accent
    // net maintenu ~5 s / jusqu'au 1er clic, et scrolle vers ses commentaires. Scroll robuste : double
    // rAF post-render (fiable même sur un board long, ex. ILIONA loin dans Kerouac). Scopé au partage.
    openMemo: (id, snap) => {
      shareMapRestore = snap || null;
      const dlg = document.getElementById('map-dialog'); if (dlg && dlg.open) dlg.close();
      const m = (DATA.memos || []).find(x => x.id === id); if (!m) return;
      shareOpenMemo = id;
      PFILTER = m.project_id || 'all'; GVIEW = 'board'; render();
      const clearFocus = () => {
        if (shareOpenMemo !== id) return;
        shareOpenMemo = null;
        const c = document.querySelector('.task[data-memo-id="' + id + '"]');
        if (c) c.classList.remove('card-focus');
      };
      // double requestAnimationFrame : attend la fin du layout du render() (board potentiellement long).
      requestAnimationFrame(() => requestAnimationFrame(() => {
        const c = document.querySelector('.task[data-memo-id="' + id + '"]');
        if (!c) return;
        // scroller vers les commentaires si présents, sinon vers la card (centrée).
        (c.querySelector('.comment-row') || c).scrollIntoView({ behavior: 'smooth', block: 'center' });
      }));
      // Nettoyage : au 1er clic ailleurs (armé après un tick pour ne pas capter le clic du bouton) OU après 5 s.
      const onDocClick = () => { document.removeEventListener('click', onDocClick, true); clearFocus(); };
      setTimeout(() => document.addEventListener('click', onDocClick, true), 350);
      setTimeout(() => { document.removeEventListener('click', onDocClick, true); clearFocus(); }, 5000);
    },
  }, extra || {}));
}

// [FESTIVAL-VOTE] Écran Résultats (invité, tout accès du lien en lecture). Re-fetch à l'ouverture.
async function openShareFestivalResults() {
  const dlg = document.getElementById('festival-dialog');
  const tabsEl = document.getElementById('festival-tabs');
  const daybar = document.getElementById('festival-daybar');
  const body = document.getElementById('festival-body');
  const foot = document.getElementById('festival-foot');
  let data = { passages: [], voters: [], total_voters: 0 };
  let tab = 'podium', day = null;
  try {
    const r = await fetch(API + '/festival-results', { headers: { 'X-Guest-Token': guestToken() } });
    data = await r.json();
  } catch (e) { notify('Impossible de charger les résultats.', { error: true }); return; }
  // [FESTIVAL-PLANNINGS] pastille couleur scène = même provenanceColor que la carte (scopé partage).
  (data.passages || []).forEach(p => { p.sceneColor = provenanceColor((DATA.projects || []).find(x => x.id === p.project_id)); });
  const draw = () => {
    tabsEl.textContent = ''; daybar.textContent = ''; body.textContent = '';
    const acc = 'background:var(--accent);border-color:var(--accent);color:#10141a';
    [['podium', '🏆 Podium'], ['people', '❤️ Par ami'], ['day', '📅 Par jour']].forEach(([k, lbl]) => {
      const b = el('button', 'prio-btn', lbl);
      if (tab === k) b.style.cssText = acc;
      b.addEventListener('click', () => { tab = k; if (k === 'day' && !day) day = FEST_DAYS[0][0]; draw(); });
      tabsEl.appendChild(b);
    });
    if (tab === 'day') {
      FEST_DAYS.forEach(([iso, lbl]) => {
        const b = el('button', 'prio-btn', lbl);
        if (day === iso) b.style.cssText = acc;
        b.addEventListener('click', () => { day = iso; draw(); });
        daybar.appendChild(b);
      });
    }
    body.appendChild(festivalResultsView(data, tab, day));
    foot.textContent = (data.total_voters || 0) + ' participant' + ((data.total_voters || 0) > 1 ? 's' : '') + ' · le vote reste ouvert';
  };
  draw();
  document.getElementById('festival-close').onclick = () => dlg.close();
  dlg.showModal();
}

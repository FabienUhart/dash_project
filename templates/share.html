function stripTags(html) {
  const tpl = document.createElement('template');
  tpl.innerHTML = html;
  return (tpl.content.textContent || '').replace(/\s+/g, ' ').trim();
}

function renderTiles() {
  const t = todayStr();
  const ms = scopedMemos();
  const defs = [
    ['all', 'En cours', '#4fc3f7', ms.filter(m => !m.done).length],
    // [MEMO-DATE-RANGE] séjour en cours = aujourd'hui ; en retard = après la fin effective
    ['today', "Aujourd'hui", '#4caf50', ms.filter(m => !m.done && memoCoversDay(m, t)).length],
    ['sched', 'Planifiés', 'var(--guest)', ms.filter(m => !m.done && m.due_date > t).length],
    ['late', 'En retard', 'var(--danger)', ms.filter(m => !m.done && m.due_date && memoDueEndDay(m) < t).length],
    ['done', 'Terminés', 'var(--warn)', ms.filter(m => m.done).length],
  ];
  const tiles = document.getElementById('tiles');
  tiles.hidden = false;
  tiles.innerHTML = '';
  defs.forEach(([key, label, color, count]) => {
    const tile = el('div', 'tile' + (FILTER === key ? ' active' : ''));
    tile.appendChild(el('span', 'tn', String(count)));
    const l = el('span', 'tl', label);
    l.style.color = color;
    tile.appendChild(l);
    tile.addEventListener('click', () => { FILTER = key; render(); });
    tiles.appendChild(tile);
  });
  // [HEADER-TOOLBAR] les tuiles d'ACTION (Carte/Résultats/Photos/Fichiers/Télécharger/Agenda)
  // passent dans une barre unifiée bordée (gabarit hdr-btn, icônes trait, pastilles, bascule ‹ ›),
  // insérée AU-DESSUS des tuiles de filtre. Les tuiles de FILTRE (stats + Corbeille) restent #tiles.
  const prevAct = document.getElementById('board-actions'); if (prevAct) prevAct.remove();
  const tb = hdrToolbar();
  let tbN = 0;
  // [PHOTO-TEMPLATE-MEMO] « Photos » pour un partage de projet (charge à l'ouverture).
  if ((DATA.projects || []).length) {
    tb.add({ icon: 'camera', label: 'Photos',
      title: 'Parcourir les photos du projet (lieux, dates EXIF)', onClick: openSharePhotos }); tbN++;
  }
  // [FILES-VIEW] « Fichiers » : retrouver tous les fichiers du dossier partagé.
  if (DATA.kind === 'project') {
    const fpid = (PFILTER !== 'all') ? PFILTER : DATA.root_id;
    if (fpid) {
      tb.add({ icon: 'folder', label: 'Fichiers',
        title: 'Retrouver tous les fichiers du dossier et de ses sous-dossiers',
        onClick: () => openShareFiles(fpid) }); tbN++;
    }
  }
  // [PHOTO-BATCH-DOWNLOAD] « Télécharger » : zip des fichiers du dossier partagé.
  if (DATA.kind === 'project') {
    const zpid = (PFILTER !== 'all') ? PFILTER : DATA.root_id;
    if (zpid && shareProjectZipCount(zpid, 'all', true) > 0) {
      tb.add({ icon: 'download', label: 'Télécharger',
        title: 'Télécharger les fichiers du dossier en .zip',
        onClick: () => downloadZipDialog({
          title: 'Télécharger les fichiers',
          hasSubprojects: true,
          count: (scope, subs) => shareProjectZipCount(zpid, scope, subs),
          buildUrl: (scope, subs) => API + '/project/' + zpid + '/download.zip?scope=' + scope + '&subprojects=' + (subs ? 1 : 0),
        }) }); tbN++;
    }
  }
  // [AGENDA-PROJECT] « Agenda » : pré-filtré sur le dossier courant (PFILTER) + descendants ;
  // sur « Tous » = agenda global du partage (comme la sidebar).
  if (DATA.kind === 'project') {
    tb.add({ icon: 'calendar', label: 'Agenda',
      title: PFILTER !== 'all' ? 'Agenda de ce dossier et de ses sous-dossiers' : 'Agenda du partage',
      onClick: () => {
        shareAgendaFilter = PFILTER !== 'all' ? PFILTER : null;
        if (shareAgendaFilter != null) {
          const set = new Set([shareAgendaFilter, ...projDescendants(shareAgendaFilter)]);
          const start = agendaStartMonth(
            (DATA.memos || []).filter(m => !m.done && m.due_date && set.has(m.project_id)),
            agendaTodayIso()
          );
          agendaYM = { y: start.y, m: start.m };
          agendaSelDay = start.day;
        } else {
          agendaYM = null; agendaSelDay = null; // global = mois courant
        }
        GVIEW = 'agenda';
        render();
      } }); tbN++;
  }
  // [HEADER-TOOLBAR v3] séparateur | groupe carte. [VOTES-FRAME] « Résultats » a quitté la barre →
  // relocalisé dans l'encart Votes (renderShareVotesBar).
  const _located = ms.filter(m => m.location).length
    + (DATA.projects || []).filter(p => p.location).length;
  if (tbN && _located > 0) tb.sep();
  if (_located > 0) {
    tb.add({ icon: 'map', label: 'Carte', count: _located,
      title: 'Voir les points géolocalisés sur une carte', onClick: () => openShareMap() }); tbN++;
  }
  // [PROJ-EDIT-BAR] « Modifier » en FIN de barre d'actions (avant la bascule «) : la barre AGIT sur
  // l'existant, le dock CRÉE. Affiché seulement si le lecteur peut éditer CE dossier — la barre
  // affiche, elle n'élargit aucun droit (invariant 5, le serveur revalide à l'enregistrement).
  // Ouvre la pop-in projet EXISTANTE (#proj-dialog) : renommer / emoji / couleur / description /
  // « ↗ Déplacer vers… », rien de neuf.
  {
    const _epid = (PFILTER !== 'all') ? PFILTER : DATA.root_id;
    const _ep = (DATA.projects || []).find(p => p.id === _epid);
    // Droit : `can_edit` du projet s'il est exposé, sinon la capacité d'édition du lien
    // (`canEditNow()` — c'est exactement ce que gardait le crayon de la sidebar).
    const _canEditProj = (_ep && _ep.can_edit !== undefined) ? !!_ep.can_edit : canEditNow();
    if (_ep && _canEditProj && DATA.kind === 'project') {
      if (tbN) tb.sep();
      tb.add({ icon: 'pencil', label: 'Modifier', title: 'Modifier ce dossier (nom, emoji, couleur, déplacer…)',
        onClick: () => openProjEditor(_ep) }); tbN++;
    }
  }
  if (tbN) {
    tb.end();
    const actions = el('div', { attrs: { id: 'board-actions', style: 'margin:0 0 0.6rem' } });
    actions.appendChild(tb.bar);
    tiles.parentNode.insertBefore(actions, tiles);
  }
  const tn = (DATA.trash || []).length;
  if (DATA.can_edit && tn > 0) {
    const tile = el('div', 'tile' + (FILTER === 'trash' ? ' active' : ''));
    tile.appendChild(el('span', 'tn', String(tn)));
    // [DANGER-SOFT] tuile Corbeille : icône TRAIT + libellé neutre (une tuile de filtre ne crie pas).
    const l = el('span', 'tl');
    l.style.cssText = 'display:inline-flex;align-items:center;gap:0.3rem';
    l.appendChild(hdrIconAt('trash', 14));
    l.appendChild(el('span', '', 'Corbeille'));
    tile.appendChild(l);
    tile.addEventListener('click', () => { FILTER = 'trash'; render(); });
    tiles.appendChild(tile);
  }
}

function renderShareTrash(list) {
  const items = DATA.trash || [];
  if (!items.length) { list.appendChild(el('div', 'empty', 'Corbeille vide. 🎉')); return; }
  items.forEach(m => {
    const row = el('div', 'task');
    row.style.cssText = 'display:flex;align-items:center;gap:0.6rem';
    const main = el('div');
    main.style.cssText = 'flex:1;min-width:0';
    const label = m.title || (m.content || '').replace(/<[^>]+>/g, ' ').trim().slice(0, 90) || MEMO_EMPTY_LABEL;
    main.appendChild(el('div', null, (m.emoji ? m.emoji + ' ' : '') + label));
    let when = '';
    if (m.deleted_at) {
      const d = new Date(m.deleted_at);
      if (!isNaN(d.getTime())) when = 'Supprimé le ' + d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' }) + ' à ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    }
    const meta = el('div', null, when);
    meta.style.cssText = 'color:var(--muted);font-size:0.78rem;margin-top:0.15rem';
    main.appendChild(meta);
    row.appendChild(main);
    const rb = document.createElement('button');
    rb.className = 'tool-btn';
    rb.textContent = '↩ Restaurer';
    rb.addEventListener('click', async () => {
      const r = await fetch(API + '/memo/' + m.id + '/restore', { method: 'POST', headers: { 'X-Guest-Token': guestToken() } });
      if (r.ok) await load(); else notify('Restauration impossible.', { error: true });
    });
    row.appendChild(rb);
    list.appendChild(row);
  });
}

function renderShareTreeView() {
  const board = document.getElementById('tree-board');
  board.innerHTML = '';
  const root = (DATA.projects || []).find(p => p.id === DATA.root_id);
  if (!root) { board.appendChild(el('p', '', 'Aucun projet à afficher.')); return; }
  const prios = Object.fromEntries((DATA.priorities || []).map(p => [p.id, p]));
  const today = todayStr();

  const bar = el('div', 'tree-toolbar');
  bar.appendChild(el('h2', '', '🌳 Plan'));
  const allIds = (DATA.projects || []).map(p => p.id);
  const anyClosed = allIds.some(id => !shareTreeOpen(id));
  const tb = el('button', 'tool-btn', anyClosed ? 'Tout déplier' : 'Tout replier');
  tb.addEventListener('click', () => { allIds.forEach(id => setShareTreeOpen(id, anyClosed)); renderShareTreeView(); });
  bar.appendChild(tb);
  board.appendChild(bar);

  const tree = el('div', 'tree-rows');
  board.appendChild(tree);

  const activeMemos = (pid) => DATA.memos.filter(m => m.project_id === pid && !m.deleted_at);
  const countActive = (pid) => {
    let n = DATA.memos.filter(m => m.project_id === pid && !m.deleted_at && !m.done).length;
    projChildren(pid).forEach(c => { n += countActive(c.id); });
    return n;
  };
  const connOf = treeConnector;

  function memoRow(m, conn) {
    const row = el('div', 'tree-row tree-memo');
    if (canEditMemo(m)) row.addEventListener('click', () => openEditor(m, null, null));  // [GUEST-ROLES]
    row.appendChild(el('span', 'tree-pre', conn));
    row.appendChild(el('span', 'tree-check', m.done ? '✓' : ''));
    const pip = el('span', 'tree-pip');
    const prio = prios[m.priority];
    if (prio && prio.color) pip.style.background = prio.color; else pip.style.visibility = 'hidden';
    row.appendChild(pip);
    const label = m.title || (isRich(m.content) ? stripTags(m.content) : (m.content || '')).slice(0, 60) || MEMO_EMPTY_LABEL;
    row.appendChild(el('span', 'tree-title' + (m.done ? ' done' : ''), label));
    const meta = el('div', 'tree-meta');
    let dueTxt = '', dueCls = '';
    if (m.due_date) {
      const dt = fmtMemoTime(m.due_time);  // [MEMO-DATE-RANGE] libellé plage + retard sur fin effective
      const lbl = (m.due_end && m.due_end > m.due_date) ? fmtDateRange(m.due_date, m.due_end) : fmtDayShort(m.due_date);
      dueTxt = '📅 ' + lbl + (dt ? ' · ' + dt : '');
      if (memoDueEndDay(m) < today) dueCls = ' due-late'; else if (memoCoversDay(m, today)) dueCls = ' due-today';
    }
    meta.appendChild(el('span', 'tcol tcol-due' + dueCls, dueTxt));
    const asg = m.assignees || [];
    meta.appendChild(el('span', 'tcol tcol-asg', asg.length ? '👤 ' + asg[0] + (asg.length > 1 ? ' +' + (asg.length - 1) : '') : ''));
    meta.appendChild(el('span', 'tcol tcol-loc', m.location ? '📍 ' + ((m.location.label || '').slice(0, 18)) : ''));
    row.appendChild(meta);
    return row;
  }

  function node(p, ancestorsLast, isLast) {
    const kids = projChildren(p.id);
    const memos = activeMemos(p.id);
    const hasChildren = kids.length || memos.length;
    const open = shareTreeOpen(p.id);
    const row = el('div', 'tree-row tree-proj');
    row.appendChild(el('span', 'tree-pre', connOf(ancestorsLast, isLast)));
    const chev = el('span', 'tree-chev');
    if (hasChildren) {
      chev.textContent = open ? '▾' : '▸';
      chev.title = open ? 'Replier' : 'Déplier';
      chev.addEventListener('click', (e) => { e.stopPropagation(); setShareTreeOpen(p.id, !open); renderShareTreeView(); });
    } else { chev.style.visibility = 'hidden'; }
    row.appendChild(chev);
    row.appendChild(projIcon(p));
    const nameEl = el('span', 'tree-title tree-projname', p.name);
    nameEl.addEventListener('click', () => { PFILTER = p.id; GVIEW = 'board'; render(); });
    row.appendChild(nameEl);
    row.appendChild(el('span', 'tree-count', String(countActive(p.id))));
    tree.appendChild(row);
    if (open && hasChildren) {
      const childAnc = [...ancestorsLast, isLast];
      const items = [...memos.map(m => ({ memo: m })), ...kids.map(c => ({ proj: c }))];
      items.forEach((it, i) => {
        const last = i === items.length - 1;
        if (it.memo) tree.appendChild(memoRow(it.memo, connOf(childAnc, last)));
        else node(it.proj, childAnc, last);
      });
    }
  }

  node(root, [], true);
}

function visibleShareMemos() {
  const t = todayStr();
  return scopedMemos().filter(m => {
    if (FILTER === 'all') return !m.done;
    if (FILTER === 'today') return !m.done && memoCoversDay(m, t);  // [MEMO-DATE-RANGE]
    if (FILTER === 'sched') return !m.done && m.due_date > t;
    if (FILTER === 'late') return !m.done && m.due_date && memoDueEndDay(m) < t;
    return m.done;
  });
}

/* ── [AGENDA] vue calendrier mensuelle invité — grille CSS maison (invariant 6),
   scopée à DATA.memos ; D&D seulement si canEditNow() → PUT /share/<t>/memo/<id>
   {due_date} existant, revalidé serveur (invariant 5). due_time conservé (PUT partiel).
   Mois affiché non persisté (spec), conservé au re-render (variables module). ── */
let agendaYM = null, agendaSelDay = null, agendaDragId = null;
// [AGENDA-PROJECT] filtre dossier courant + descendants (non persisté, comme le mois).
let shareAgendaFilter = null;
let agendaDropGuard = 0;  // [AGENDA-DAY-POPIN] anti clic-fantôme après un drop (D7)

// Périmètre courant de l'agenda (source unique grille + pop-in jour).
function shareAgendaSrc() {
  let src = (DATA.memos || []).filter(m => !m.done && m.due_date);
  if (shareAgendaFilter != null) {
    const fp = (DATA.projects || []).find(p => p.id === shareAgendaFilter);
    if (fp) { const set = new Set([shareAgendaFilter, ...projDescendants(shareAgendaFilter)]); src = src.filter(m => set.has(m.project_id)); }
  }
  return src;
}

// [AGENDA-DAY-POPIN] config pop-in jour (invité). createForDay = création EXISTANTE puis pose de la
// date via l'éditeur (la route /memos ignore due_date côté serveur), gatée par le rôle (canAddNow).
function shareAgendaCfg() {
  return {
    memosForDay: (iso) => agendaGroupByDay(shareAgendaSrc())[iso] || [],
    chipColor: agendaChipColor,
    memoTitle: agendaMemoTitle,
    // [POLISH-VIEWER-AGENDA-PRIO] clic = fiche de lecture 👁 (elle applique déjà les droits :
    // pas de « ✎ Modifier » sans can_edit) ; la création garde le chemin éditeur.
    openMemo: (m) => openMemoView(shareMemoViewCfg(), m.id),
    canCreate: () => canAddNow(),
    createForDay: async (iso) => {
      const pid = (shareAgendaFilter != null) ? shareAgendaFilter : ((PFILTER !== 'all') ? PFILTER : DATA.root_id);
      const H = { 'Content-Type': 'application/json', 'X-Guest-Token': guestToken() };
      const r = await fetch(API + '/memos', { method: 'POST', headers: H, body: JSON.stringify({ title: 'Nouveau mémo', project_id: pid }) });
      if (!r.ok) { const e = await r.json().catch(() => ({})); notify(e.error || 'Création impossible', { error: true }); return; }
      const m = await r.json();
      await fetch(API + '/memo/' + m.id, { method: 'PUT', headers: H, body: JSON.stringify({ due_date: iso }) });
      await load();
      const fresh = (DATA.memos || []).find(x => x.id === m.id) || m;
      agendaOpen(fresh);
    },
    onNav: (iso) => { const [y, mo] = iso.split('-').map(Number); if (!agendaYM || agendaYM.y !== y || agendaYM.m !== mo - 1) { agendaYM = { y, m: mo - 1 }; renderShareAgenda(); } },
  };
}

function agendaChipColor(m) {
  const p = (DATA.priorities || []).find(x => x.id === m.priority);
  if (p && p.color) return p.color;
  const proj = (DATA.projects || []).find(x => x.id === m.project_id);
  return usableProjColor(proj && proj.color) || DATA.marker_color || '#e53935';
}

function agendaMemoTitle(m) {
  return (m.emoji ? m.emoji + ' ' : '') + (m.title || stripTags(m.content).slice(0, 40) || MEMO_EMPTY_LABEL);
}

function agendaOpen(m) {
  // Pop-in d'édition existante, gatée can_edit (les spans factices couvrent le
  // repli sans-Quill d'openEditor, qui attend contentEl/taskEl).
  if (canEditMemo(m)) openEditor(m, el('span', ''), el('span', ''));  // [GUEST-ROLES] own-or-editor
}

function agendaRow(m) {
  const row = el('div', 'ag-row');
  row.addEventListener('click', () => agendaOpen(m));
  row.appendChild(el('span', 'ag-time', m.due_time ? fmtMemoTime(m.due_time) : '—'));
  const dot = el('span', 'ag-dot');
  dot.style.background = agendaChipColor(m);
  row.appendChild(dot);
  const t = el('span', 'ag-t', agendaMemoTitle(m));
  t.title = agendaMemoTitle(m);
  row.appendChild(t);
  return row;
}

function renderShareAgenda() {
  const board = document.getElementById('agenda-board');
  board.innerHTML = '';
  agendaDayRefresh();  // [AGENDA-DAY-POPIN] pop-in jour ouverte (drill-down) → re-render frais
  const today = agendaTodayIso();
  if (!agendaYM) { const d = new Date(); agendaYM = { y: d.getFullYear(), m: d.getMonth() }; }
  // [AGENDA-DAY-POPIN] plus d'agendaSelDay : la pop-in jour remplace le panneau.
  let src = (DATA.memos || []).filter(m => !m.done && m.due_date);
  // [AGENDA-PROJECT] mode filtré : dossier courant + descendants (le scope partage
  // s'applique déjà côté serveur — on ne fait que restreindre l'affichage).
  let filterProj = null;
  if (shareAgendaFilter != null) {
    filterProj = (DATA.projects || []).find(p => p.id === shareAgendaFilter) || null;
    if (!filterProj) shareAgendaFilter = null;
    else {
      const set = new Set([shareAgendaFilter, ...projDescendants(shareAgendaFilter)]);
      src = src.filter(m => set.has(m.project_id));
    }
  }
  const byDay = agendaGroupByDay(src);

  const head = el('div', 'ag-head');
  head.appendChild(el('h2', '', '📆 ' + agendaMonthLabel(agendaYM.y, agendaYM.m)
    + (filterProj ? ' — ' + (filterProj.emoji ? filterProj.emoji + ' ' : '') + filterProj.name : '')));
  if (filterProj) {
    const clearBtn = el('button', 'prio-btn', '× tout l\'agenda');
    clearBtn.title = 'Retirer le filtre dossier — revenir à l\'agenda du partage';
    clearBtn.addEventListener('click', () => { shareAgendaFilter = null; renderShareAgenda(); });
    head.appendChild(clearBtn);
  }
  const nav = el('div', 'ag-nav');
  const shift = (d) => { const n = new Date(agendaYM.y, agendaYM.m + d, 1); agendaYM = { y: n.getFullYear(), m: n.getMonth() }; renderShareAgenda(); };
  const navBtn = (txt, fn, title) => { const b = el('button', 'prio-btn', txt); if (title) b.title = title; b.addEventListener('click', fn); return b; };
  nav.appendChild(navBtn('‹', () => shift(-1), 'Mois précédent'));
  nav.appendChild(navBtn('Aujourd\'hui', () => { const d = new Date(); agendaYM = { y: d.getFullYear(), m: d.getMonth() }; agendaSelDay = today; renderShareAgenda(); }));
  nav.appendChild(navBtn('›', () => shift(1), 'Mois suivant'));
  head.appendChild(nav);
  board.appendChild(head);

  // Mobile : liste par jour (jours avec mémos seulement), pas de grille ni D&D.
  if (window.matchMedia('(max-width: 900px)').matches) {
    const prefix = agendaYM.y + '-' + String(agendaYM.m + 1).padStart(2, '0');
    const days = Object.keys(byDay).filter(iso => iso.startsWith(prefix)).sort();
    if (!days.length) { board.appendChild(el('div', 'ag-empty', 'Aucun mémo daté ce mois-ci.')); return; }
    days.forEach(iso => {
      const sec = el('div', 'ag-day-panel');
      const h = el('h3', '', agendaShortDayLabel(iso) + ' — ' + byDay[iso].length + ' mémo' + (byDay[iso].length > 1 ? 's' : ''));
      h.setAttribute('role', 'button'); h.setAttribute('tabindex', '0'); h.title = 'Ouvrir ce jour'; h.style.cursor = 'pointer';
      h.addEventListener('click', () => openAgendaDay(shareAgendaCfg(), iso));  // [AGENDA-DAY-POPIN] en-tête tappable
      h.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openAgendaDay(shareAgendaCfg(), iso); } });
      sec.appendChild(h);
      byDay[iso].forEach(m => sec.appendChild(agendaRow(m)));
      board.appendChild(sec);
    });
    return;
  }

  const grid = el('div', 'ag-grid');
  AGENDA_DOW.forEach(d => grid.appendChild(el('div', 'ag-dow', d)));
  agendaMonthMatrix(agendaYM.y, agendaYM.m).forEach(week => week.forEach(c => {
    const cell = el('div', 'ag-cell' + (c.inMonth ? '' : ' out') + (c.iso === today ? ' today' : ''));
    cell.appendChild(el('span', 'ag-num', String(c.day)));
    const list = byDay[c.iso] || [];
    list.slice(0, 3).forEach(m => {
      const label = agendaMemoTitle(m);
      const chip = el('div', 'ag-chip');
      chip.title = label + (m.due_time ? ' · ' + fmtMemoTime(m.due_time) : '');
      const dot = el('span', 'ag-dot');
      dot.style.background = agendaChipColor(m);
      chip.appendChild(dot);
      chip.appendChild(el('span', 'ag-t', label));
      if (canEditNow()) { // lecture seule = chips non draggables
        chip.setAttribute('draggable', 'true');
        chip.addEventListener('dragstart', (e) => { e.stopPropagation(); agendaDragId = m.id; e.dataTransfer.effectAllowed = 'move'; });
        chip.addEventListener('dragend', () => { agendaDragId = null; });
      }
      chip.addEventListener('click', (e) => { e.stopPropagation(); agendaOpen(m); });  // chip → éditeur (conservé)
      cell.appendChild(chip);
    });
    // [AGENDA-DAY-POPIN] « +N » = vrai bouton → pop-in du jour.
    if (list.length > 3) { const more = el('button', 'ag-more', '+' + (list.length - 3)); more.type = 'button'; more.title = 'Voir les ' + list.length + ' mémos du jour'; more.addEventListener('click', (e) => { e.stopPropagation(); openAgendaDay(shareAgendaCfg(), c.iso); }); cell.appendChild(more); }
    if (c.inMonth) {
      cell.addEventListener('click', () => { if (agendaDragId != null || Date.now() < agendaDropGuard) return; openAgendaDay(shareAgendaCfg(), c.iso); });
      cell.addEventListener('dragover', (e) => { if (agendaDragId == null) return; e.preventDefault(); cell.classList.add('droptarget'); });
      cell.addEventListener('dragleave', () => cell.classList.remove('droptarget'));
      cell.addEventListener('drop', async (e) => {
        e.preventDefault();
        cell.classList.remove('droptarget');
        if (agendaDragId == null) return;
        const id = agendaDragId;
        agendaDragId = null;
        agendaDropGuard = Date.now() + 400;  // anti clic fantôme post-drop
        await guestPut(API + '/memo/' + id, { due_date: c.iso }); // recharge + re-render
      });
    }
    grid.appendChild(cell);
  }));
  board.appendChild(grid);
  // [AGENDA-DAY-POPIN] plus de panneau du jour sous la grille (la pop-in le remplace — D1).
}

function render() {
  // [QUICK-MEMO] widget de capture rapide invité — créé une seule fois (idempotent) dès que le
  // rôle permet la création (canAddNow). Destination via POST /share/<token>/memos EXISTANT
  // (X-Guest-Token, scope revalidé serveur — invariant 5, zéro route nouvelle). Pas d'offline (owner-only, D5).
  if (typeof initQuickMemo === 'function') initQuickMemo({
    canUse: () => canAddNow(),
    folders: () => qmFolderOptions((DATA.projects || []).filter(p => p.can_add)),
    defaultFolder: () => String((PFILTER !== 'all') ? PFILTER : (DATA.root_id || '')),
    submit: async ({ title, content, folder }) => {
      const body = {};
      if (title) body.title = title;
      if (content) body.content = content;
      if (folder) body.project_id = Number(folder);
      const r = await fetch(API + '/memos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Guest-Token': guestToken() },
        body: JSON.stringify(body),
      });
      if (!r.ok) { const e = await r.json().catch(() => ({})); notify(e.error || 'Création impossible', { error: true }); return null; }
      const memo = await r.json().catch(() => null);
      await load();
      return (memo && memo.id) ? memo : true;   // objet {id,…} → le widget peut y accrocher les médias
    },
    // [QUICK-MEMO V2] médias posés APRÈS création, par les routes invité EXISTANTES sous /share/…
    // (invariant 5 : aucune route nouvelle, scope revalidé serveur, X-Guest-Token obligatoire).
    // ⚠️ Côté invité le serveur n'accepte que PNG/JPEG (GUEST_IMG_EXT) : un HEIC d'iPhone est
    // refusé en 400 et compté comme échec — le message le dit, rien n'est perdu en silence.
    uploadMedia: async (memo, { photos, voices }) => {
      let failed = 0;
      for (const file of photos) {
        const fd = new FormData(); fd.append('image', file);
        const r = await fetch(API + '/memo/' + memo.id + '/images', {
          method: 'POST', headers: { 'X-Guest-Token': guestToken() }, body: fd }).catch(() => null);
        if (!r || !r.ok) failed++;
      }
      for (const v of voices) {   // un clip = une PJ ; séquentiel, chaque échec compté à part
        const fd = new FormData(); fd.append('files', v.blob, v.filename);
        const r = await fetch(API + '/memo/' + memo.id + '/attachments', {
          method: 'POST', headers: { 'X-Guest-Token': guestToken() }, body: fd }).catch(() => null);
        if (!r || !r.ok) failed++;
      }
      await load();
      return failed;
    },
  });
  document.getElementById('title').innerHTML = '';
  const h = document.getElementById('title');
  if (DATA.color) {
    const d = el('span', 'dot');
    d.style.background = DATA.color;
    h.appendChild(d);
  }
  h.appendChild(document.createTextNode(DATA.title));
  // [VOTE-DECISION] badge du dossier actif s'il est en mode vote (lecture seule invité).
  const _vpid = PFILTER !== 'all' ? PFILTER : DATA.root_id;
  const _vproj = (DATA.projects || []).find(p => p.id === _vpid);
  if (_vproj && _vproj.vote_enabled) {
    const vb = el('span', 'prio-btn', voteStatusLabel(_vproj));  // gabarit .prio-btn, texte complet
    vb.style.cssText = 'margin-left:0.5rem;cursor:default';
    vb.title = voteDeadlineTitle(_vproj);
    h.appendChild(vb);
  }
  // [T2-FIX] Le chip de mode dit ce que l'invité peut VRAIMENT faire. Il n'avait que deux
  // extrêmes — « modifiable » ou « lecture seule » — si bien qu'un Commentateur (rôle du lien ou
  // rôle accordé sur le dossier) voyait « 👁 lecture seule » avec un composeur juste en dessous.
  // Le serveur tranche : `can_edit` = éditeur quelque part, `can_write` = peut écrire QUELQUE
  // CHOSE quelque part (commenter, voter, cocher, ajouter). Le survol dit le rôle exact.
  const modeEl = document.getElementById('mode'); modeEl.textContent = '';
  const _appr = approved();
  const _mode = (DATA.can_edit && _appr) ? 'modifiable'
    : (DATA.can_write && _appr) ? 'participation'
    : ((DATA.can_edit || DATA.can_write) ? 'sur validation' : 'lecture seule');
  // `reply` = prendre la parole (il n'y a pas d'icône « message » dans cette page).
  modeEl.append(shareIcon(_mode === 'modifiable' ? 'pencil' : (_mode === 'participation' ? 'reply' : 'eye')),
                ' ' + _mode);
  modeEl.title = roleLabel(DATA.role_effective || DATA.role || '');
  syncAdminButton();   // [GUEST-ROLES V2 · T4b] couronne « Gérer les accès » si Admin
  renderWelcome();   // [GUEST-ROLES V2 · T2] bandeau d'accueil + demande de rôle (§5)
  const pdesc = document.getElementById('pdesc');
  let curDesc = DATA.description || '';
  if (PFILTER !== 'all') {
    const fp = (DATA.projects || []).find(p => p.id === PFILTER);
    curDesc = (fp && fp.description) || '';
  }
  pdesc.hidden = !curDesc;
  pdesc.textContent = curDesc;
  // [FOLDER-ATTACHMENTS] fichiers rattachés au dossier courant (vue board d'un projet).
  const pfiles = document.getElementById('pfiles');
  pfiles.innerHTML = '';
  shareFilesCfg = null;   // [TOOLS-DOCK-GUEST] cfg de la section Fichiers du dossier courant
  if (DATA.kind === 'project' && GVIEW === 'board') {
    const zpid = PFILTER !== 'all' ? PFILTER : DATA.root_id;
    const fp = (DATA.projects || []).find(p => p.id === zpid);
    if (fp && ((fp.attachments || []).length || canAddNow())) {  // [GUEST-ROLES] PJ dossier = contributeur
      // [TOOLS-DOCK-GUEST] `hideVoice` : le 🎤 sort de la section (bascule « Vocal » du dock) ;
      // même cfg → flux d'enregistrement identique. Chaque outil est monté derrière sa bascule.
      shareFilesCfg = {
        attachments: fp.attachments || [],
        canEdit: canAddNow(),
        uploadUrl: API + '/project/' + fp.id + '/attachments',
        headers: { 'X-Guest-Token': guestToken() },
        onChange: async () => { await load(); },
        openImage: (a) => { if (typeof runImageViewer === 'function') runImageViewer({ images: [a], startIndex: 0, imageUrl: (x) => x.url }); else window.open(a.url, '_blank', 'noopener'); },
      };
      const _dk = shareDockState();
      if (_dk.file) pfiles.appendChild(renderAttachments(Object.assign({ hideVoice: true }, shareFilesCfg)));
      if (_dk.voice && canAddNow()) {
        const vb = voiceAttachButton(shareFilesCfg);
        if (vb) { vb.style.marginBottom = '0.5rem'; pfiles.appendChild(vb); }
        else pfiles.appendChild(voiceUnavailableNote());   // [POLISH-VIEWER-AGENDA-PRIO] icône trait
      }
      // Glisser un FICHIER sur la page déplie l'outil Fichier (recette owner 154 ; garde
      // `types` = 'Files' → un drag interne ne déclenche rien).
      if (!_dk.file && canAddNow()) {
        document.getElementById('list').addEventListener('dragenter', (e) => {
          const t = e.dataTransfer;
          if (!t || !Array.from(t.types || []).includes('Files')) return;
          setShareDock('file', true); render();
        });
      }
    }
  }
  // [GUEST-ROLES passe 2] on ne peut ajouter que dans les dossiers OÙ on a le droit (can_add) :
  // zone (role_floor) et dossier perso inclus. Le sélecteur ne liste que ces dossiers.
  const addable = (DATA.projects || []).filter(p => p.can_add && approved());
  const canAddHere = canAddNow() && DATA.kind === 'project' && addable.length > 0;
  // [TOOLS-DOCK-GUEST] les deux barres passent DERRIÈRE leur bascule (repliées par défaut).
  const _dock = shareDockState();
  document.getElementById('add-bar').hidden = !(canAddHere && _dock.memo);
  document.getElementById('proj-bar').hidden = !(canAddHere && _dock.folder);
  renderShareAddBar(addable, canAddHere);
  if (canAddHere && _dock.memo && shareDockFocusMemo) {
    shareDockFocusMemo = false;
    setTimeout(() => { const i = document.querySelector('#add-bar input[type=text]'); if (i) i.focus(); }, 40);
  }
  renderGuestBanner();
  renderSidebar();
  renderTiles();
  // [TOOLS-DOCK-GUEST] APRÈS renderTiles : c'est lui qui crée `#board-actions` (la barre
  // d'actions), et le dock doit s'y greffer à droite quand elle existe.
  renderShareToolsDock({ memo: canAddHere, folder: canAddHere, file: !!shareFilesCfg, voice: !!shareFilesCfg && canAddNow() });
  applyA11y();
  // Le titre (nom du projet) peut faire varier la hauteur du header → re-mesurer
  // pour caler la barre de projets collante.
  syncHeaderHeight();

  // Vues Plan / Agenda : plein écran (board et barres d'ajout masqués).
  const treeBoard = document.getElementById('tree-board');
  const agendaBoard = document.getElementById('agenda-board');
  const showPlan = GVIEW === 'plan' && DATA.kind === 'project';
  const showAgenda = GVIEW === 'agenda' && DATA.kind === 'project';
  treeBoard.hidden = !showPlan;
  agendaBoard.hidden = !showAgenda;
  document.getElementById('list').hidden = showPlan || showAgenda;
  // [VOTE-GROUPS] reset de la sélection de scrutin au changement de projet actif.
  if (shareVoteBoardPid !== ((PFILTER !== 'all') ? PFILTER : DATA.root_id)) {
    shareSelectedVoteId = null; shareVoteCreate = null;
    shareVoteBoardPid = (PFILTER !== 'all') ? PFILTER : DATA.root_id;
  }
  const voteBar = document.getElementById('vote-bar');
  if (voteBar) voteBar.innerHTML = '';
  if (showPlan || showAgenda || FILTER === 'trash') {
    if (showPlan || showAgenda) {
      document.getElementById('add-bar').hidden = true;
      document.getElementById('proj-bar').hidden = true;
      if (showPlan) renderShareTreeView();
      else renderShareAgenda();
      return;
    }
  } else {
    renderShareVotesBar();  // chips/création/gestion au-dessus des sections
  }

  const list = document.getElementById('list');
  list.innerHTML = '';
  if (FILTER === 'trash') { renderShareTrash(list); return; }
  const visible = visibleShareMemos();
  // Tri intra-jour : date croissante, puis mémos sans heure d'abord, puis heure croissante.
  // [FESTIVAL-DATES] dates réelles → tri chronologique naturel (voir board owner).
  visible.sort((a, b) =>
    (a.due_date || '').localeCompare(b.due_date || '') ||
    ((a.due_time ? 1 : 0) - (b.due_time ? 1 : 0)) ||
    (a.due_time || '').localeCompare(b.due_time || ''));
  // [BOARD-SUBHIDE] chips masquer/afficher par sous-projet (affichage seul — tuiles/carte inchangées).
  const _sh = subHideBar({
    storageKey: 'shareBoardSubHide:' + TOKEN + ':' + PFILTER,
    memos: visible,
    currentProjectId: (PFILTER !== 'all') ? PFILTER : DATA.root_id,
    projById: (id) => (DATA.projects || []).find(p => p.id === id) || null,
    onChange: render,
  });
  if (_sh.bar) list.appendChild(_sh.bar);
  const shown = visible.filter(m => !_sh.isHidden(m));
  if (!shown.length) {
    list.appendChild(el('div', 'empty', _sh.bar ? 'Tous les mémos sont masqués.' : 'Rien dans cette vue. 🎉'));
    return;
  }
  // [CARD-COVER] bascule « Immersif / Compact », persistée par TOKEN + dossier ouvert (les
  // invités du voyage sont le premier public de ce mode). Défaut = Compact.
  const _cov = coverToggleBar({
    storageKey: 'shareBoardCover:' + TOKEN + ':' + PFILTER,
    hasPhotos: shown.some(m => (m.images || []).length),
    onChange: render,
  });
  if (_cov.bar) list.appendChild(_cov.bar);
  // [SUBHIDE-V2] « ⤓ Aller en bas » (helper partagé, nouveau chez les invités) : hors du cadre
  // Sous-dossiers, juste au-dessus des cards, même seuil que le owner (> 8 mémos affichés).
  if (shown.length > 8) list.appendChild(memoJumpBar('down'));
  const prios = Object.fromEntries((DATA.priorities || []).map(p => [p.id, p]));
  shown.forEach(memo => {
    // [CARD-COVER] la card ouverte depuis la carte reste DÉCLAMPÉE (rendu classique complet).
    const coverName = (_cov.on && shareOpenMemo !== memo.id && (memo.images || []).length) ? memo.images[0] : '';
    const t = el('div', 'task' + (memo.done ? ' done' : '') + (shareOpenMemo === memo.id ? ' card-focus' : ''));
    t.dataset.memoId = memo.id;  // [MAP-MEMO-ROUNDTRIP] cible du scroll « Ouvrir le mémo » depuis la carte
    if (canEditMemo(memo) && DATA.kind === 'project') {  // [GUEST-ROLES] D&D = éditer ce mémo
      t.draggable = true;
      t.addEventListener('dragstart', (e) => { dragShareMemo = memo.id; e.dataTransfer.effectAllowed = 'move'; });
      t.addEventListener('dragend', () => { dragShareMemo = null; });
    }
    const prio = prios[memo.priority];
    // Bordure gauche = priorité, sinon couleur du projet (rien si done). [CARD-REDESIGN]
    if (!memo.done) {
      let leftCol = (prio && prio.color) ? prio.color : '';
      if (!leftCol && memo.project_id) {
        const pj = (DATA.projects || []).find(p => p.id === memo.project_id);
        if (pj) leftCol = usableProjColor(pj.color);
      }
      if (leftCol) t.style.borderLeftColor = leftCol;
    }

    const row = el('div', 'task-row');
    const check = el('button', 'task-check', '✓');
    const _ceMemo = canEditMemo(memo);  // [GUEST-ROLES] cocher = éditer ce mémo (own-or-editor)
    check.disabled = !_ceMemo;
    check.title = _ceMemo ? (memo.done ? 'Rouvrir' : 'Terminer') : 'Modification réservée';
    check.addEventListener('click', () => { if (canEditMemo(memo)) put(memo.id, { done: !memo.done }); });
    row.appendChild(check);

    const content = el('div', 'task-content');
    // Extrait dans un wrapper clampable (3 lignes), sauf s'il contient une liste à
    // cocher : les invités doivent pouvoir cocher tous les items. [CARD-REDESIGN]
    const buildExc = (html, plain) => {
      const exc = el('div', '');
      if (!plain && isRich(html)) exc.appendChild(sanitize(html));
      else exc.appendChild(linkifyText(html || ''));
      dressLinks(exc);   // [LINK-RENDER]
      exc.querySelectorAll('.mention[data-mention]').forEach(sp => {
        if (shareNoAccess(sp.getAttribute('data-mention'))) { sp.classList.add('noaccess'); sp.title = NO_ACCESS_TIP; }
      });
      // [MAP-MEMO-ROUNDTRIP] la card ouverte depuis la carte est DÉCLAMPÉE (contenu complet visible).
      if (shareOpenMemo !== memo.id && !exc.querySelector('li[data-list], table')) exc.classList.add('task-clamp'); // [MEMO-TABLES] un tableau reste lisible
      return exc;
    };
    const mkTitle = (muted) => {
      const tl = el('div', '', '');
      tl.style.cssText = 'font-weight:' + (muted ? '500' : '600') + ';font-size:0.95rem;margin-bottom:0.15rem' + (muted ? ';color:var(--muted);font-style:italic' : '');
      return tl;
    };
    if (coverName) {
      // [CARD-COVER] carte d'appel : titre + une ligne, en TEXTE pur au-dessus du voile
      // (ni checklist, ni tableau, ni fil de commentaires — le détail vit dans la fiche 👁).
      content.appendChild(memoCoverHead(memo, memoCoverTexts(memo, stripTags)));
    } else if (memo.title) {
      const tl = mkTitle(false);
      if (memo.emoji) { const em = el('span', '', memo.emoji); em.style.marginRight = '0.35rem'; tl.appendChild(em); }
      tl.appendChild(document.createTextNode(memo.title));
      content.appendChild(tl);
      content.appendChild(buildExc(memo.content, false));
    } else {
      // [MEMO-TITLE-FALLBACK] Pas de titre : accroche du contenu en style titre (gras), sans doublon
      // (1re ligne = titre, reste = extrait). Contenu vide/HTML sans texte → placeholder unique.
      if (memo.emoji) { const em = el('span', '', memo.emoji); em.style.marginRight = '0.35rem'; content.appendChild(em); }
      const stripped = stripTags(memo.content || '').trim();
      if (!stripped) {
        const tl = mkTitle(true); tl.appendChild(document.createTextNode(MEMO_EMPTY_LABEL)); content.appendChild(tl);
      } else if (!isRich(memo.content)) {
        const tl = mkTitle(false); tl.appendChild(document.createTextNode(memoLeadText(stripped))); content.appendChild(tl);
        const rest = memoRestText(memo.content);
        if (rest) content.appendChild(buildExc(rest, true));
      } else {
        // [V23.6.100] Riche sans titre : 1re ligne/paragraphe/item promu en titre gras, extrait =
        // reste du contenu riche (checklists/tableaux préservés → clic conservé), sans duplication.
        const sp = splitLeadHtml(memo.content);
        const tl = mkTitle(false); tl.appendChild(document.createTextNode(memoLeadText(sp.lead))); content.appendChild(tl);
        if (stripTags(sp.restHtml).trim()) content.appendChild(buildExc(sp.restHtml, false));
      }
    }
    content.querySelectorAll('li[data-list="checked"], li[data-list="unchecked"]').forEach((li, i) => {
      if (!canEditMemo(memo)) return;  // [GUEST-ROLES] cocher un item = éditer ce mémo
      li.classList.add('cl-edit');
      li.title = 'Cliquer pour cocher / décocher';
      li.addEventListener('click', () => {
        const tpl = document.createElement('template');
        tpl.innerHTML = memo.content;
        const items = tpl.content.querySelectorAll('li[data-list="checked"], li[data-list="unchecked"]');
        if (!items[i]) return;
        items[i].setAttribute('data-list', items[i].getAttribute('data-list') === 'checked' ? 'unchecked' : 'checked');
        put(memo.id, { content: tpl.innerHTML });
      });
    });
    // [CARD-PREVIEW] Pictos signature 📷 / 📎 (les sous-tâches et commentaires sont déjà affichés
    // inline plus bas sur la card invité → pas de compteur ☑/💬 en double). Clics existants conservés.
    const _pic = memoPictosRow({
      images: (memo.images || []).length,
      attachments: (memo.attachments || []).length,
      onImages: (memo.images || []).length ? () => runImageViewer({
        images: memo.images, startIndex: 0,
        imageUrl: (n) => API + '/image/' + n, downloadUrl: (n) => API + '/image/' + n, exifUrl: (n) => API + '/image-exif/' + n,
        canDelete: canEditMemo(memo), onDelete: async (n) => { const r = await fetch(API + '/memo/' + memo.id + '/images/' + n, { method: 'DELETE', headers: { 'X-Guest-Token': guestToken() } }); if (r.ok) await load(); },
      }) : null,
      onAttach: (memo.attachments || []).length ? () => openShareMemoAttachments(memo) : null,
    });
    if (_pic) content.appendChild(_pic);
    // [MEMO-LINKS] D3 : chips des deux côtés ; clic = éditeur du mémo relié (si droit d'éditer).
    const _lk = memoLinkChips(memo.links, (otherId) => {
      const target = (DATA.memos || []).find((x) => x.id === otherId);
      if (target && canEditMemo(target)) openEditor(target, el('span', ''), el('span', ''));
    });
    if (_lk) content.appendChild(_lk);
    const _vr = shareVoteRow(memo);
    if (_vr) content.appendChild(_vr);
    row.appendChild(content);

    // Chip de priorité visible (en plus de la bordure gauche). [CARD-REDESIGN]
    if (prio && prio.color && !memo.done) {
      const pc = el('span', 'prio-chip', prio.name || ('P' + memo.priority));
      pc.style.cssText = 'background:' + prio.color + ';color:' + textOn(prio.color);
      pc.title = 'Priorité ' + (prio.name || '');
      row.appendChild(pc);
    }
    if (memo.location) {
      const la = el('a', 'badge'); la.append(shareIcon('map-pin'), memo.location.label ? ' ' + memo.location.label : '');
      la.href = 'https://www.openstreetmap.org/?mlat=' + memo.location.lat + '&mlon=' + memo.location.lng + '#map=17/' + memo.location.lat + '/' + memo.location.lng;
      la.target = '_blank';
      la.rel = 'noopener noreferrer';
      la.style.cssText = 'text-decoration:none;color:var(--accent)';
      la.title = 'Voir sur la carte';
      row.appendChild(la);
    }
    // Assignés en pastilles d'initiales (nom complet en tooltip ; ⚠ ambre si sans accès). [CARD-REDESIGN]
    const asg = memo.assignees || [];
    if (asg.length) {
      const stack = el('div', 'asg-stack');
      asg.forEach(a => {
        const noAcc = shareNoAccess(a);
        const av = el('span', 'asg-av' + (noAcc ? ' noaccess' : ''), initials(a));
        av.title = (noAcc ? '⚠ ' : '') + a + (noAcc ? ' — ' + NO_ACCESS_TIP : '');
        stack.appendChild(av);
      });
      row.appendChild(stack);
    }
    if (memo.project) row.appendChild(el('span', 'badge', memo.project));
    if (memo.due_date) {
      const dt = fmtMemoRange(memo.due_time, memo.end_time);  // [FESTIVAL-VOTE] plage horaire début → fin
      // [MEMO-DATE-RANGE] libellé « 3 → 6 nov » si plage de dates.
      const dlbl = (memo.due_end && memo.due_end > memo.due_date) ? fmtDateRange(memo.due_date, memo.due_end) : fmtDayShort(memo.due_date);
      row.appendChild(el('span', 'badge', '📅 ' + dlbl + (dt ? ' · ' + dt : '')));
    }
    // [FESTIVAL-VOTE] Chip ❤️ : invité APPROUVÉ peut poser (can_edit NON requis) ; anonyme = lecture.
    {
      const hchip = heartChip(memo, canVoteMemo(memo), shareToggleHeart);  // [GUEST-ROLES] ❤️ = voter
      if (hchip) row.appendChild(hchip);
    }
    // [CARD-PREVIEW] Le compteur 📎 passe dans la rangée de pictos (avec 📷) — anti-doublon.
    // [MEMO-VIEW] œil = fiche de LECTURE, visible pour TOUS les lecteurs (suiveur inclus :
    // c'est justement sa seule façon de lire confortablement). Placé AVANT le crayon.
    // [MEMO-VIEW correctif 3] Les actions vivent dans UN conteneur `.task-acts` : en ≤900 px la
    // rangée passe en `flex-wrap` et le contenu prend toute la largeur — sans groupe, le 👁
    // (premier bouton, porteur du `margin-left:auto`) se détachait sur la ligne des badges
    // pendant que ✎ et ⋯ basculaient plus loin. Groupés, ils wrappent ENSEMBLE, œil en tête.
    const acts = el('div', 'task-acts');
    const vBtn = el('button', 'task-edit');
    vBtn.appendChild(shareIcon('eye'));
    vBtn.title = 'Voir le mémo';
    vBtn.addEventListener('click', (ev) => { ev.stopPropagation(); openMemoView(shareMemoViewCfg(), memo.id); });
    acts.appendChild(vBtn);
    // [CARD-COVER] en immersif les actions descendent dans un pied de card (bas à droite,
    // sur fond de verre) ; en compact elles restent où elles ont toujours été.
    if (!coverName) row.appendChild(acts);
    if (canEditMemo(memo)) {  // [GUEST-ROLES] ✎/⋯ (éditer/supprimer) = own-or-editor
      const eBtn = el('button', 'task-edit');
      eBtn.appendChild(shareIcon('pencil'));
      eBtn.title = 'Modifier ce mémo';
      eBtn.addEventListener('click', () => openEditor(memo, content, t));
      acts.appendChild(eBtn);
      // [LESS-BUTTONS] Menu ⋯ compact : Déplacer / Supprimer (le reste des contrôles passe en pop-in).
      const more = el('div', 'task-more'); more.style.cssText = 'position:relative;display:inline-flex';
      const moreBtn = el('button', 'task-edit', '⋯'); moreBtn.title = "Plus d'actions";
      const moreMenu = el('div', 'card-menu'); moreMenu.hidden = true;
      const mv = el('button', '', '↗ Déplacer vers…');
      mv.addEventListener('click', (e) => { e.stopPropagation(); moreMenu.hidden = true; openMoveShareMemo(memo); });
      moreMenu.appendChild(mv);
      const del = dangerSoftize(el('button', 'danger-item', 'Supprimer'), 'trash', 'item');   // [DANGER-SOFT]
      del.addEventListener('click', async (e) => { e.stopPropagation(); moreMenu.hidden = true; const r = await fetch(API + '/memo/' + memo.id, { method: 'DELETE', headers: { 'X-Guest-Token': guestToken() } }); if (r.ok) await load(); });
      moreMenu.appendChild(del);
      moreBtn.addEventListener('click', (e) => { e.stopPropagation(); moreMenu.hidden = !moreMenu.hidden; });
      more.appendChild(moreBtn); more.appendChild(moreMenu);
      acts.appendChild(more);
    }
    t.appendChild(row);

    (coverName ? [] : (memo.subtasks || [])).forEach((st, i) => {
      const s = el('div', 'subtask' + (st.done ? ' stdone' : ''));
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = !!st.done;
      cb.disabled = !canEditMemo(memo);  // [GUEST-ROLES] own-or-editor
      cb.addEventListener('change', () => {
        const next = memo.subtasks.map((x, j) => j === i ? { ...x, done: cb.checked } : x);
        put(memo.id, { subtasks: next });
      });
      s.appendChild(cb);
      s.appendChild(el('span', '', st.content));
      t.appendChild(s);
    });

    const makeItemAdd = () => {
      const addItem = document.createElement('input');
      addItem.className = 'item-add';
      addItem.placeholder = '+ Ajouter un article… (Entrée)';
      addItem.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        const val = addItem.value.trim();
        if (!val) return;
        const tpl = document.createElement('template');
        tpl.innerHTML = memo.content || '';
        let target = null;
        [...tpl.content.querySelectorAll('ul, ol')].reverse().some(l => {
          if (l.querySelector('li[data-list="checked"], li[data-list="unchecked"]')) { target = l; return true; }
          return false;
        });
        if (!target) {
          target = document.createElement('ul');
          tpl.content.appendChild(target);
        }
        const li = document.createElement('li');
        li.setAttribute('data-list', 'unchecked');
        li.textContent = val;
        target.appendChild(li);
        put(memo.id, { content: tpl.innerHTML });
      });
      return addItem;
    };
    const hasChecklist = !!content.querySelector('li[data-list]');
    if (canEditMemo(memo) && hasChecklist) {  // [GUEST-ROLES] ajouter un item = éditer ce mémo
      t.appendChild(makeItemAdd());
    }

    // [CARD-COVER] le fil de commentaires n'a pas sa place sur une couverture (fiche 👁 / compact).
    if (!coverName && ((memo.comments || []).length || canCommentMemo(memo))) {  // [GUEST-ROLES] commentateur+ ou override
      const cwrap = el('div', '');
      cwrap.style.cssText = 'margin:0.4rem 0 0 1.75rem';
      const comments = memo.comments || [];
      // [COMMENTS-V2] une bulle par commentaire (squelette partagé `cmtRow`) — droits INCHANGÉS.
      const buildC = (c, isReply) => {
        const author = (c.author || '').replace(/\s*<[^>]*>/, '');
        const vf = renderVoiceBody(c.body, voiceUrlFor(memo.attachments));   // [VOICE-MESSAGES]
        // [COMMENT-VOTE] scrutin → la bulle de vote remplace le corps. Voter exige la capacité
        // `comment` (voter, c'est prendre la parole) ; le SERVEUR revalide périmètre et rôle à
        // chaque appel — la page ne fait qu'afficher ce qu'il autorise (invariant 5).
        const pollNode = c.poll ? cmtPollNode(c.poll, {
          canVote: canCommentMemo(memo),
          onVote: async (optionId) => {
            const r = await fetch(API + '/comment-poll/' + c.id + '/vote', {
              method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Guest-Token': guestToken() },
              body: JSON.stringify({ option_id: optionId }) });
            if (r.ok) await load(); else notify('Vote impossible.', { error: true });
          },
          onClose: async () => {
            if (!(await confirmPopin('Le gagnant sera figé et plus personne ne pourra voter.', { title: 'Clore ce vote ?', okLabel: 'Clore', danger: false }))) return;
            const r = await fetch(API + '/comment-poll/' + c.id + '/close', {
              method: 'POST', headers: { 'X-Guest-Token': guestToken() } });
            if (r.ok) await load(); else notify('Clôture impossible.', { error: true });
          },
        }) : null;
        const bodyNode = pollNode || vf || commentBodyNode(c.body);           // [COMMENT-LINKIFY]
        const self = (GUEST && (GUEST.name || GUEST.email)) || '';
        const others = (c.seen || []).filter(v => v && v !== author && v !== self);
        const when = new Date(c.created_at).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
        const _sys = cmtSystemInfo(c.body);   // [SYSTEM-LINES-MONO]
        return cmtRow({
          author: c.author, guest: !!c.guest, bodyNode, isReply,
          when: when + (vf ? ' · 🎤 message vocal' : ''),
          seenText: others.length ? ('👁 ' + others.join(', ')) : '',
          priority: c.priority, prioColor: commentPrioColor, prioLabel: commentPrioLabel,
          deleted: !!c.deleted,   // [COMMENTS-V2 addendum] pierre tombale
          system: _sys,           // [SYSTEM-LINES-MONO]
          actions: [
            (!isReply && canCommentMemo(memo)) && { label: '↩ Répondre', onClick: (r) => {   // [GUEST-ROLES]
              if (r.nextSibling && r.nextSibling.classList && r.nextSibling.classList.contains('reply-box')) { r.nextSibling.remove(); return; }
              const rb = shareCommentInput(memo, c.id);
              rb.classList.add('reply-box');
              rb.style.marginLeft = '1.5rem';
              r.after(rb);
              rb.querySelector('input').focus();
            } },
            // [COMMENTS-V2 addendum] l'AUTEUR supprime SON message. `can_delete` est calculé par le
            // SERVEUR (match par e-mail) : la page ne fait qu'afficher — viser le message d'un
            // autre reste refusé côté serveur (403), invariant 5.
            c.can_delete && { label: '✕', title: 'Supprimer mon message', danger: true, onClick: async () => {
              if (!(await confirmPopin('Il laissera une trace « Message supprimé » et les réponses resteront.', { title: 'Supprimer ton message ?' }))) return;
              const resp = await fetch(API + '/comment/' + c.id, { method: 'DELETE', headers: { 'X-Guest-Token': guestToken() } });
              if (resp.ok) await load(); else notify('Suppression impossible.', { error: true });
            } },
          ],
          // [COMMENT-REACTIONS] invité APPROUVÉ peut réagir (can_edit non requis).
          reactionsRow: reactionRow(c.reactions, !_sys && canCommentMemo(memo), async (emoji) => {
            const resp = await fetch(API + '/comment/' + c.id + '/react', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Guest-Token': guestToken() }, body: JSON.stringify({ emoji }) });
            if (resp.ok) await load(); else notify('Réaction impossible.', { error: true });
          }),
        });
      };
      // au-delà de 2 réponses : repliées derrière « ▾ Voir n réponses de plus » (état de session).
      cmtHideVoiceLogs(comments).filter(c => !c.parent_id).forEach(c => {
        cwrap.appendChild(buildC(c, false));
        const replies = cmtHideVoiceLogs(comments).filter(ch => ch.parent_id === c.id);
        replies.slice(0, 2).forEach(ch => cwrap.appendChild(buildC(ch, true)));
        const extra = replies.slice(2);
        if (extra.length) {
          const holder = el('div', '');
          holder.style.display = 'none';
          extra.forEach(ch => holder.appendChild(buildC(ch, true)));
          cwrap.appendChild(cmtMoreToggle(extra.length, (open) => { holder.style.display = open ? '' : 'none'; }));
          cwrap.appendChild(holder);
        }
      });
      if (canCommentMemo(memo)) cwrap.appendChild(shareCommentInput(memo, null));  // [GUEST-ROLES]
      t.appendChild(cwrap);
      if (comments.length && canCommentMemo(memo)) markMemoSeen(memo.id);
    }

    // [CARD-COVER] la photo EST la card en immersif.
    // [CARD-COVER v1.1] en compact, la bande de vignettes sous la card cède la place à la
    // vignette carrée posée à DROITE de la rangée (helper partagé, `?size=t`, clic = visionneuse).
    if (!coverName && (memo.images || []).length) {
      applyCardThumb(row, {
        url: API + '/image/' + memo.images[0], count: memo.images.length,
        onOpen: () => runImageViewer({
          images: memo.images, startIndex: 0,
          imageUrl: (n) => API + '/image/' + n,
          downloadUrl: (n) => API + '/image/' + n,
          exifUrl: (n) => API + '/image-exif/' + n,
          canDelete: canEditMemo(memo),
          onDelete: async (n) => {
            const r = await fetch(API + '/memo/' + memo.id + '/images/' + n, {
              method: 'DELETE', headers: { 'X-Guest-Token': guestToken() },
            });
            if (r.ok) await load();
          },
        }),
      });
    }

    // [LESS-BUTTONS] L'ancien bloc « memo-tools » (crumb, date/heure, priorité, Photo, Liste,
    // Position, Modifier, Déplacer, Corbeille, adresse, titre, assignés) a été retiré : ces
    // contrôles vivent désormais dans la pop-in « Modifier le mémo » (renderQMeta + sections
    // existantes) et dans le menu ⋯ de la rangée. La card ne garde que la consultation active.
    // [CARD-COVER] pied (actions) puis habillage photo + voile, en DERNIER : la couche photo
    // passe sous les rangées déjà construites. Clic sur la photo = visionneuse.
    if (coverName) {
      const foot = coverFoot();
      foot.appendChild(acts);
      t.appendChild(foot);
      applyCardCover(t, {
        url: API + '/image/' + coverName,
        onOpen: () => runImageViewer({
          images: memo.images, startIndex: 0,
          imageUrl: (n) => API + '/image/' + n, downloadUrl: (n) => API + '/image/' + n, exifUrl: (n) => API + '/image-exif/' + n,
          canDelete: canEditMemo(memo),
          onDelete: async (n) => { const r = await fetch(API + '/memo/' + memo.id + '/images/' + n, { method: 'DELETE', headers: { 'X-Guest-Token': guestToken() } }); if (r.ok) await load(); },
        }),
      });
    }
    list.appendChild(t);
  });
  // [SUBHIDE-V2] pendant ⤒ du bas (parité owner : on peut revenir en haut après le saut).
  if (shown.length > 8) list.appendChild(memoJumpBar('up'));
}

async function load() {
  // [GUEST-EDIT] jeton joint quand il existe : côté serveur il ne sert qu'à poser la
  // « dernière connexion » de l'invité (header approuvé requis) — la lecture reste identique.
  const gt = guestToken();
  const r = await fetch(API + '/data', gt ? { headers: { 'X-Guest-Token': gt } } : {});
  if (!r.ok) {
    document.getElementById('title').textContent = 'Lien invalide ou révoqué';
    document.getElementById('list').innerHTML = '';
    document.getElementById('guest-banner').hidden = true;
    document.getElementById('add-bar').hidden = true;
    return;
  }
  DATA = await r.json();
  if (Array.isArray(DATA.reaction_emojis)) REACTION_EMOJIS = DATA.reaction_emojis;  // [REACTION-PALETTE]
  promptReloadIfStale(EMBEDDED_BUILD, DATA.build_version);  // [UPDATE-PROMPT]
  await refreshGuest();
  render();
}

document.getElementById('lightbox').addEventListener('click', () => document.getElementById('lightbox').close());
// [LESS-BUTTONS] ferme les menus ⋯ des cards au clic ailleurs (un seul handler global).
document.addEventListener('click', () => { document.querySelectorAll('.task-more .card-menu:not([hidden])').forEach(m => { m.hidden = true; }); });
// [GUEST-ADD-BAR] barre mémo invitée = helper partagé guestMemoAddBar (parité owner [ADD-BAR-V2]).
// Construite UNE fois puis rafraîchie (le poll 15 s ne doit pas effacer la saisie ni le repli).
// Écriture : POST /share/<token>/memos EXISTANT (titre + dossier) puis, si des métadonnées sont
// remplies, PUT /share/<token>/memo/<id> EXISTANT — zéro route nouvelle, scope et rôle revalidés
// par le serveur (invariant 5). Matrice [GUEST-ROLES] : pouvoir créer (contributeur+) implique
// pouvoir éditer SON mémo (action 'own') → la rangée 2 est offerte dès que canAddNow().
let shareAddBarEl = null;
function renderShareAddBar(addable, canAddHere) {
  const host = document.getElementById('add-bar');
  if (!canAddHere) { host.innerHTML = ''; shareAddBarEl = null; return; }
  const folders = addable.map(p => ({
    value: p.id,
    label: (p.emoji ? p.emoji + ' ' : '') + p.name,   // nom SEUL — plus de préfixe « dans … »
    selected: PFILTER !== 'all' && p.id === PFILTER,
  }));
  if (shareAddBarEl && shareAddBarEl.isConnected) { shareAddBarEl.updateFolders(folders); return; }
  shareAddBarEl = guestMemoAddBar({
    storageKey: 'shareAddDetailsOpen:' + TOKEN,
    placeholder: '+ Titre du nouveau mémo… (Entrée)',
    folders,
    priorities: DATA.priorities || [],
    allowMeta: canAddNow(),
    onCreate: async ({ title, projectValue, meta }) => {
      const body = { title };
      if (projectValue) body.project_id = Number(projectValue);
      const r = await fetch(API + '/memos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Guest-Token': guestToken() },
        body: JSON.stringify(body),
      });
      if (!r.ok) {
        const e = await r.json().catch(() => ({}));
        notify(e.error || 'Création impossible', { error: true });
        return false;
      }
      const m = await r.json().catch(() => null);
      if (m && m.id && Object.keys(meta).length) {
        await fetch(API + '/memo/' + m.id, {   // métadonnées : route scopée existante
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'X-Guest-Token': guestToken() },
          body: JSON.stringify(meta),
        });
      }
      await load();
      return true;
    },
  });
  host.innerHTML = '';
  host.appendChild(shareAddBarEl);
}

const projInput = document.getElementById('proj-input');
async function addSubProject() {
  const name = projInput.value.trim();
  if (!name) return;
  const r = await fetch(API + '/projects', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Guest-Token': guestToken() },
    body: JSON.stringify({ name }),
  });
  if (r.ok) { projInput.value = ''; await load(); }
  else {
    const err = await r.json().catch(() => ({}));
    notify(err.error || 'Création impossible', { error: true });
  }
}
projInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addSubProject(); });
// [GUEST-ADD-BAR] « Créer » : emoji 📁 remplacé par l'icône dossier TRAIT (hdrIcon du partial,
// currentColor, zéro asset nouveau) et bouton converti en Luciole NEUTRE — hiérarchie visuelle :
// l'ajout de mémo (accent) prime sur la création de dossier (neutre).
const projBtn = document.getElementById('proj-btn');
projBtn.addEventListener('click', (e) => withBusy(e.currentTarget, addSubProject));
(function () {
  const ic = hdrIcon('folder');

  projBtn.textContent = '';
  projBtn.append(ic, document.createTextNode('Créer'));

})();

// [LUCIOLE-SWEEP] parité avec le pied owner (147) : UNE seule `.luc-primary` par pop-in.
// `lucioleize` ne change ni le type ni les handlers. Non convertis (doctrine) : #notify-dialog,
// `.confirm-danger` (danger rouge), chips `.prio-btn`, `.hdr-btn`.
[
  ['edit-save', 'luc-primary'],    // #edit-dialog « Enregistrer »
  ['edit-cancel', 'luc-neutral'],
  ['pd-save', 'luc-primary'],      // #proj-dialog « Enregistrer »
  ['pd-cancel', 'luc-neutral'],

_dangerSoftStyle();   // [DANGER-SOFT] feuille du danger discret posée dès le boot (helper partagé)
/* [SEARCH-SHARED] recherche du partage : le composant du partial (aide desktop + feuille mobile).
   Les résultats sont EXACTEMENT ce que la page affiche déjà (`scopedMemos`) — le composant ne lit
   pas les données, il ne peut donc rien montrer hors du partage (invariant 5 : le serveur borne
   déjà `share_data`, on ne fait que présenter ce qui est là). Zéro route nouvelle. */
function shareRefreshSearch() {
  if (!shareSearch().q) shareSearchWide = false;   // vider remet la portée par défaut
  if (shareSearchUI) shareSearchUI.refreshHelp();
  render();
}
const shareSearchUI = attachSearchUI({
  input: document.getElementById('search'),
  anchor: document.getElementById('search-wrap'),
  placeholder: 'Rechercher… (p# dossiers)',
  helpRows: [
    { k: 'p#', fill: 'p#', d: 'Chercher un <b>dossier</b> — <i>p#hôtels</i>' },
    { k: 'm#', fill: 'm#', d: 'Chercher dans les <b>mémos</b> — <i>m#train</i>' },
  ],
  helpFoot: [['Échap', 'efface et ferme']],
  scopeNote: () => {
    const p = PFILTER !== 'all' ? (DATA.projects || []).find(x => x.id === PFILTER) : null;
    return p ? 'Dans « ' + p.name + ' », la recherche y reste bornée — le chip du dossier élargit à tout le partage.' : '';
  },
  scopes: () => ([{ key: 'all', label: 'Tout' }, { key: 'memos', label: 'Mémos' }, { key: 'projects', label: 'Dossiers' }]),
  folderChip: () => {
    const p = PFILTER !== 'all' ? (DATA.projects || []).find(x => x.id === PFILTER) : null;
    if (!p) return null;
    // [SEARCH-MOBILE-HEADER] allumé dès l'ouverture (indépendant de la requête) — cf. owner.
    return { label: (p.emoji || '📁') + ' ' + p.name, active: !shareSearchWide,
      onToggle: () => { shareSearchWide = !shareSearchWide; shareRefreshSearch(); } };
  },
  getQuery: () => shareSearchRaw(),
  setQuery: () => {},   // la valeur vit dans le champ inline, tenu à jour par le composant
  getScope: () => shareSearchScope,
  setScope: (v) => { shareSearchScope = v; },
  results: () => {
    const { scope, q } = shareSearch();
    if (!q) return [];
    const label = (id) => { const p = (DATA.projects || []).find(x => x.id === id); return p ? ((p.emoji ? p.emoji + ' ' : '') + p.name) : ''; };
    if (scope === 'projects') {
      return shareMatchingProjects(q).map(p => ({ emoji: p.emoji || '📁', title: p.name, sub: 'Dossier',
        onOpen: () => { PFILTER = p.id; render(); } }));
    }
    return scopedMemos().map(m => ({ emoji: m.emoji || '📝',
      title: m.title || stripTags(m.content).slice(0, 80) || '(sans titre)',
      sub: label(m.project_id), onOpen: () => openEditor(m) }));
  },
  onChange: () => shareRefreshSearch(),
});
{ const _si = document.getElementById('search');
  // Loupe : le sprite de cette page n'a pas `ic-search`, on prend celle du jeu d'icônes partagé.
  { const _ic = hdrIconAt('search', 16); _ic.style.color = 'var(--muted)'; _si.parentElement.insertBefore(_ic, _si); }
  _si.addEventListener('input', shareRefreshSearch);
  _si.addEventListener('keydown', (e) => { if (e.key === 'Escape') { _si.value = ''; shareRefreshSearch(); _si.blur(); } }); }
/* ═══ [SHARE-REFRESH-GUARD] le tick de 15 s ne détruit plus une saisie en cours ═══════════
   Bug PRÉ-EXISTANT prouvé par Cowork en session invitée réelle : `setInterval(load, 15000)` →
   `load()` → `render()` reconstruit toutes les cards, donc TOUT texte en train d'être tapé dans
   un composeur de fil disparaît au tick suivant. Le « ; » et les frappes n'y étaient pour rien ;
   c'est ce qui expliquait aussi les impressions de « ça se ferme tout seul » côté invité. La
   frappe longue des commandes `/vote_choix …` l'a simplement rendu systématique.

   La garde est posée sur le TICK, jamais sur `load()` : les rafraîchissements EXPLICITES (après
   avoir posté, voté, clos…) doivent toujours rendre — c'est le rafraîchissement AUTOMATIQUE, et
   lui seul, qui doit savoir attendre. Même doctrine que les deux gardes déjà en place sur cette
   page (le formulaire d'identification et la barre d'ajout mémo) : on ne reconstruit pas ce dans
   quoi l'invité est en train d'écrire.

   Conséquence assumée : tant qu'un brouillon non envoyé traîne dans un composeur, la page reste
   sur ses données. C'est le bon compromis — des données d'il y a 30 s se rattrapent, une phrase
   effacée ne se rattrape pas. Pour ne pas faire attendre 15 s de plus après coup, un tick sauté
   arme une reprise courte déclenchée à la sortie du champ. */
let _refreshPending = false, _refreshTimer = null;
function shareRefreshBlocked() {
  // Une pop-in ouverte : le tick reconstruirait le board DERRIÈRE elle.
  if (document.querySelector('dialog[open]')) return 'pop-in ouverte';
  const a = document.activeElement;
  if (a && a !== document.body
      && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT' || a.isContentEditable)) {
    return 'saisie en cours';
  }
  // Texte non envoyé, MÊME sans focus : l'invité a pu cliquer ailleurs sans valider.
  const dirty = [...document.querySelectorAll('.cmt-composer input, #add-bar input, #add-bar textarea')]
    .some(i => (i.value || '').trim());
  return dirty ? 'brouillon non envoyé' : '';
}
function shareAutoRefresh() {
  if (shareRefreshBlocked()) { _refreshPending = true; return; }
  _refreshPending = false;
  load();
}
load();
setInterval(shareAutoRefresh, 15000);
// Reprise courte : à la sortie d'un champ, si un tick a été sauté et que plus rien ne bloque,
// on rattrape sans attendre les 15 s suivantes.
document.addEventListener('focusout', () => {
  if (!_refreshPending) return;
  clearTimeout(_refreshTimer);
  _refreshTimer = setTimeout(() => { if (_refreshPending) shareAutoRefresh(); }, 1200);
});

/* ------------------------------------------------ animations GSAP
   Dégrade proprement si gsap.min.js est absent.
   load() est rappelé toutes les 15 s ; on n'anime l'entrée QUE quand
   le filtre ou le projet change (FILTER|PFILTER), pas à chaque refresh. */
window.addEventListener('DOMContentLoaded', () => {
  const g = window.gsap;
  if (!g) return;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function countUp(node) {
    const to = parseInt(node.textContent, 10);
    if (isNaN(to) || reduce) return;
    const o = { v: 0 };
    g.fromTo(o, { v: 0 }, {
      v: to, duration: 0.7, ease: 'power1.out', snap: { v: 1 },
      onUpdate: () => { node.textContent = Math.round(o.v); },
    });
  }
  function animateView() {
    stagger('#tiles .tile', { y: 10, duration: 0.35, stagger: 0.03 });
    stagger('#list .task');
    document.querySelectorAll('#tiles .tn').forEach(countUp);
  }

  const viewKey = () => [typeof FILTER !== 'undefined' ? FILTER : '', typeof PFILTER !== 'undefined' ? PFILTER : ''].join('|');
  let lastKey = null;
  let firstPaint = true;

  function playIntro() {
    if (!firstPaint) return;
    firstPaint = false;
    lastKey = viewKey();
    if (!reduce) {
      g.from('header', { y: -20, autoAlpha: 0, duration: 0.4, ease: 'power2.out', clearProps: 'all' });
      g.from('#snav .sitem', { x: -12, autoAlpha: 0, duration: 0.3, stagger: 0.03, ease: 'power2.out', delay: 0.08, clearProps: 'all' });
    }
    animateView();
  }

  const _render = render;
  render = function () {
    const r = _render.apply(this, arguments);
    if (firstPaint) { playIntro(); }
    else { const k = viewKey(); if (k !== lastKey) { lastKey = k; animateView(); } }
    return r;
  };

  if (document.querySelector('#list .task') || document.querySelector('#tiles .tile')) playIntro();

  // Entrée des pop-ins : gérée en CSS (@keyframes dlg-in / dlg-bd).
  // Ne pas wrapper showModal pour animer le <dialog> via GSAP : poser un transform
  // dessus le sort du top-layer Chromium et casse le centrage + le backdrop.
});
</script>

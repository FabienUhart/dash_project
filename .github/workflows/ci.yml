name: CI

# Vérifs rapides sur push main + toute pull request. Aucun déploiement.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compilation Python (app.py)
        run: python -m py_compile app.py

      # Validation syntaxe du JS des templates : on extrait chaque bloc <script>…</script>
      # attr-less (le partial + les scripts inline des pages ; les libs externes sont en
      # <script src=…> et sont ignorées), on neutralise le Jinja ({{…}} → 0, {%…%} supprimé)
      # puis node --check. Échoue si un bloc ne parse pas.
      - name: Validation syntaxe JS des templates
        run: |
          python3 - <<'PY'
          import re, subprocess, sys, tempfile, os
          files = [
              "templates/index.html",
              "templates/share.html",
              "templates/hub.html",
              "templates/partials/_shared.js.html",
          ]
          fail = False
          for f in files:
              html = open(f, encoding="utf-8").read()
              blocks = re.findall(r"<script>(.*?)</script>", html, re.S)
              for i, js in enumerate(blocks):
                  if not js.strip():
                      continue
                  js = re.sub(r"{{.*?}}", "0", js, flags=re.S)   # {{ version }} → 0
                  js = re.sub(r"{%.*?%}", "", js, flags=re.S)     # {% ... %} supprimé
                  with tempfile.NamedTemporaryFile("w", suffix=".js", delete=False, encoding="utf-8") as tmp:
                      tmp.write(js)
                      path = tmp.name
                  r = subprocess.run(["node", "--check", path], capture_output=True, text=True)
                  os.unlink(path)
                  if r.returncode != 0:
                      fail = True
                      print(f"❌ {f} (bloc script #{i+1}) :\n{r.stderr}", file=sys.stderr)
                  else:
                      print(f"✅ {f} (bloc script #{i+1})")
          sys.exit(1 if fail else 0)
          PY

      - name: Build de l'image Docker (sans déploiement)
        run: docker build -t dashboard:ci .

  # [TEST-HARNESS] Deux jobs séparés : le back est rapide (quelques secondes) et doit
  # rendre son verdict tout de suite ; l'e2e paie l'installation d'un navigateur, on ne
  # veut pas que sa lenteur masque un rouge back. Les deux sont bloquants.
  tests-back:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deps
        run: pip install -r requirements-dev.txt
      - name: Tests back (unit + invariants)
        run: pytest -m "not e2e" --junitxml=junit-back.xml
      # [TEST-REPORTS] `if: always()` n'est pas un détail : c'est SURTOUT quand c'est rouge
      # qu'on veut le rapport. Sans ça, l'étape serait sautée à l'échec — au moment précis
      # où le fichier devient utile.
      - name: Rapport JUnit back (artefact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-back
          path: junit-back.xml

  tests-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deps
        run: pip install -r requirements-dev.txt
      - name: Navigateur headless
        run: playwright install --with-deps chromium
      - name: Tests e2e (front)
        run: pytest -m e2e --junitxml=junit-e2e.xml
      - name: Rapport JUnit e2e (artefact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-e2e
          path: junit-e2e.xml

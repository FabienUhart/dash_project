# fail2ban — filtre [DASH-API] : 401 sur /api/v1 et /mcp dans le log d'accès JSON de Caddy.
# Proposition NON appliquée (voir docs/infra/authelia-api-v1.md § 4). 5 échecs en 10 min → 1 h de ban.
# Le log Caddy JSON porte "request":{"remote_ip":"…","uri":"/api/v1/…"} et "status":401.
[Definition]
failregex = ^.*"remote_ip":"<HOST>".*"uri":"/(api/v1|mcp)/[^"]*".*"status":401.*$
ignoreregex =
datepattern = "ts":{EPOCH}

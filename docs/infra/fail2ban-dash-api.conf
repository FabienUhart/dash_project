# fail2ban — filtre [DASH-API] : 401 sur /api/v1 et /mcp dans le log d'accès JSON de Caddy.
# Proposition REDONDANTE, NON appliquée (voir docs/infra/authelia-api-v1.md § 4) : la jail `caddy-auth`
# existante matche déjà TOUT 401 du log Caddy via "client_ip". Gardé pour mémoire. 5 échecs en 10 min → 1 h.
[Definition]
failregex = ^\{.*"client_ip":"<ADDR>".*"uri":"/(api/v1|mcp)/[^"]*".*"status":401.*\}$
ignoreregex =
datepattern = "ts":{EPOCH}
